name: Temporary Image Studio gofmt

on:
  push:
    branches:
      - feat/image-studio-edit-contract-20260812

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[gofmt]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/image-studio-edit-contract-20260812
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false
      - name: Format Image Studio backend files
        run: gofmt -w backend/internal/api/image_session_handler.go backend/internal/llm/image_studio.go backend/internal/llm/image_studio_test.go
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/internal/api/image_session_handler.go backend/internal/llm/image_studio.go backend/internal/llm/image_studio_test.go
          git commit -m 'style(image): gofmt Image Studio backend [gofmt]'
          git push origin HEAD:feat/image-studio-edit-contract-20260812
