name: Video Cursor Export Parity Patch

on:
  push:
    branches: [feat/video-wysiwyg-phase3-cursor-export-parity]
    paths:
      - '.github/workflows/video-cursor-export-parity-patch.yml'

permissions:
  contents: write

jobs:
  patch-tracker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/video-wysiwyg-phase3-cursor-export-parity
      - name: Update durable WYSIWYG tracker
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md')
          text = path.read_text()

          old_handoff = '''Latest merged WYSIWYG program PR: **#306 — Bind FFmpeg text to immutable project font resources** — squash merge `1edbd24ebfe66f990373526276228d0cc5ba5a29`. The renderer now consumes the exact staged Render Manifest face for every text clip that declares `font_resource_id`; unresolved resource-backed text fails closed instead of falling back to a host family name. #306's exact final head `89ab620dddc3a2db1d0b78f90e3f1d7a1a548152` passed the complete Quality/Security/playback/pixelate/platform matrix before merge.

Current implementation PR: **#307 — Gate immutable resource text glyph parity** on branch `feat/video-wysiwyg-phase3-font-glyph-parity`, normalized directly onto #306's actual squash result. `parity-resource-text-v1` isolates one 640×360/30 fps black canvas, one static `WYSIWYG 42` text clip at 48 px/400/white, and one immutable DejaVu Sans project font resource. Two independent hosted measurements produced identical frame-15 metrics before the envelope was frozen. Hard-gate run `33792035551` passed on head `dda1873e9f5e167c855b187056c1863dda403d1e`; retained artifact `9907747511` is SHA-256 `3afe45506bba1fc56a5cb8ac6f754623d6f930390607aedd5847c239ca754304`. The exact face SHA-256 is `ae7b7855e115a5966d8b1b3f80f254ccc117ec86f9965e202ee2940453837280` (759,720 bytes). The focused gate preserves the repository-global ±2 diagnostics but accepts this known Chromium/FFmpeg rasterizer envelope only when pixel pass is ≥0.988, SSIM ≥0.900, MAE ≤1.20, RMSE ≤13.20, and changed bounds are exactly `[165,161)-[471,199)` after exact font-resource, runtime-alias, and canonical-frame identity checks.
'''
          new_handoff = '''Latest merged WYSIWYG program PR: **#307 — Gate immutable resource text glyph parity** — squash merge `0718f1069c0e4531a5a0ebd9334f74c9edb2ae68`. Its exact final PR head `8ea1c90ee41761706c797b646c37546881c84dd4` passed the complete exact-head Quality/Security/browser/renderer/platform matrix before merge. `parity-resource-text-v1` remains the retained immutable project-font Chromium↔FFmpeg acceptance gate; hard-gate artifact `9907747511` is SHA-256 `3afe45506bba1fc56a5cb8ac6f754623d6f930390607aedd5847c239ca754304`.

Current implementation slice: **canonical cursor export parity** on branch `feat/video-wysiwyg-phase3-cursor-export-parity`, created directly from #307's actual squash result and kept behind `main` by zero during implementation. The supported static-2D media subset now evaluates `cursor-state-v1` at exact output-frame rational times, emits deterministic pointer/highlight/click-ring rasters on the owner track, preserves the strict `<300 ms` click-ring window, and inherits static x/y, uniform scale, Z rotation, and opacity. Smoothing, animated/3D/camera/effect/transition parents, ambiguous same-track overlaps, and clips beyond the bounded fidelity expansion remain on the compatibility path; click audio is still not synthesized, so renderer capability remains deliberately `Partial`.

The cursor slice also pins visual palette semantics instead of inheriting mutable theme tokens: highlight `rgba(255, 223, 32, 0.3)` and ring `rgba(0, 188, 255, 0.8)` are explicit in canonical and compatibility preview painters and in the Go rasterizer. Focused hosted validation run `33800486954` passed `go test ./internal/video/...` plus the full frontend `tsc -b && vite build` before committing the palette correction as `9fa841a8e610e0021a3d194e079a17f20b2e54cd`.

`parity-cursor-v1` isolates one lossless 640×360 black PNG, 100 fps, one static media clip, and exact frames `20/21/50/79/80` around a click at 500 ms. Frames 20 and 80 are exactly ±300 ms and must omit the ring; 21/50/79 must include it. Two independent hosted attempts on run `33800619647` reproduced every numeric metric and changed bound exactly. Artifacts `9910959242` / `9911073577` are SHA-256 `8ea87cd181e399736580ded5c785f1d169ac416a23b2d7e37281ee7c82c9183e` / `49250eafc469cbe956bb83c08d6fb3146b458f29e486de8a25d4a26699155ca0`. No-ring frames measured pixel pass `0.9911935764`, SSIM `0.9867336425`, MAE `0.2817129630`, RMSE `3.6370401899`; ring frames measured `0.9851866319`, `0.9837122720`, `0.4196397569`, `4.3971392544`; maximum channel delta is `178`. Hard-gate run `33801254401` passed on head `ed58353d555db10092421c494c02ebe6c65173ce`; retained artifact `9911228698` is SHA-256 `0c41d4996d66b44582d2627036fbc0aec1ddd065d6617a14063dc26b9327c9e1`. The gate requires no-ring ≥0.990 pixel pass / ≥0.985 SSIM / ≤0.31 MAE / ≤3.80 RMSE, ring ≥0.984 / ≥0.982 / ≤0.45 / ≤4.50, max channel delta ≤180, exact per-frame changed bounds, exact pinned palette, immutable backdrop identity, canonical frame identity, and strict ring-boundary structure.
'''
          if old_handoff not in text:
              raise SystemExit('current handoff anchor not found')
          text = text.replace(old_handoff, new_handoff, 1)

          text = text.replace('### #307 resource-backed Chromium↔FFmpeg glyph evidence', '### #307 merged resource-backed Chromium↔FFmpeg glyph evidence', 1)

          cursor_section_anchor = '''- Hard-gate run `33792035551` passed with a fixture-specific envelope derived from those repeated measurements: ±2 pass rate ≥0.988, SSIM ≥0.900, MAE ≤1.20, RMSE ≤13.20, and exact changed bounds `[165,161)-[471,199)` after font/frame/runtime identity checks. Artifact `9907747511` is SHA-256 `3afe45506bba1fc56a5cb8ac6f754623d6f930390607aedd5847c239ca754304`.

### #289 merged result
'''
          cursor_section = '''- Hard-gate run `33792035551` passed with a fixture-specific envelope derived from those repeated measurements: ±2 pass rate ≥0.988, SSIM ≥0.900, MAE ≤1.20, RMSE ≤13.20, and exact changed bounds `[165,161)-[471,199)` after font/frame/runtime identity checks. Artifact `9907747511` is SHA-256 `3afe45506bba1fc56a5cb8ac6f754623d6f930390607aedd5847c239ca754304`.
- Exact final PR head `8ea1c90ee41761706c797b646c37546881c84dd4` passed the complete triggered matrix and #307 squash-merged as `0718f1069c0e4531a5a0ebd9334f74c9edb2ae68`.

### Canonical cursor export parity slice

- `FidelityRenderer` no longer turns the supported cursor path into a sampled Unicode `➤` plus rectangle click approximation. The admitted subset calls the existing backend `cursor-state-v1` evaluator for each exact output frame and emits deterministic raster assets only for frames that are actually rendered.
- Cursor pixels remain adjacent to the owning media clip on the owning track rather than moving to a synthetic global topmost track. This preserves track visibility/order and prevents cursor export from acquiring a second stacking model.
- Static owner x/y, uniform scale, Z rotation, and opacity are inherited. Cursor smoothing, visual keyframes/animation, 3D/perspective/anchor transforms, scene camera overlap, enabled effects/transitions/fades, ambiguous same-track overlap, non-media owners, and durations that exceed the bounded segment budget retain the compatibility fallback instead of claiming exact support.
- Generated cursor PNGs are materialized after diagnostic-frame filtering, registered as render-only resolved assets, and removed after the delegate render. Diagnostic evidence therefore creates only the raster assets needed by the selected frame.
- Pointer geometry remains the canonical 64 px arrow at scale 1; highlight is 2.2× pointer size and click ring is 2.6× with an inward 2 px border. Preview and export pin highlight `#ffdf20` at 30% and ring `#00bcff` at 80%, avoiding Tailwind-version palette drift.
- Focused backend tests cover exact ±300 ms click boundaries, owner-track preservation, parent affine transform/opacity, smoothing fallback, deterministic raster generation/cleanup, and byte-level pinned palette values. Hosted run `33800486954` passed `go test ./internal/video/...` and the full frontend production build.
- `parity-cursor-v1` uses a source/download SHA-verified black PNG and samples frames 20/21/50/79/80 at 100 fps. Browser evidence requires canonical frame mode, exact interpolated cursor position, 64×64 pointer geometry, pinned palette, highlight presence, and ring presence only at 21/50/79. FFmpeg evidence compares the full 640×360 decoded diagnostic frame.
- Two independent measurement attempts on run `33800619647` reproduced all metrics and changed bounds exactly. The retained measurement artifacts are `9910959242` (`8ea87cd181e399736580ded5c785f1d169ac416a23b2d7e37281ee7c82c9183e`) and `9911073577` (`49250eafc469cbe956bb83c08d6fb3146b458f29e486de8a25d4a26699155ca0`).
- Hard-gate run `33801254401` passed with `focused_pass=true` on all five samples. Artifact `9911228698` is SHA-256 `0c41d4996d66b44582d2627036fbc0aec1ddd065d6617a14063dc26b9327c9e1`. Repository-global ±2 diagnostics remain independent; the cursor gate records the stable Chromium-vs-Go antialiasing envelope rather than weakening global thresholds.
- Renderer capability remains `Partial`: this slice deliberately does not synthesize click audio and does not admit smoothing/animated/3D/camera/effect/transition parents or unbounded cursor expansion.

### #289 merged result
'''
          if cursor_section_anchor not in text:
              raise SystemExit('cursor section insertion anchor not found')
          text = text.replace(cursor_section_anchor, cursor_section, 1)

          table_anchor = '''| #306 | FFmpeg immutable project-font selection for resource-backed text | `1edbd24ebfe66f990373526276228d0cc5ba5a29` |
'''
          table_new = table_anchor + '''| #307 | Immutable project-font Chromium↔FFmpeg glyph acceptance gate | `0718f1069c0e4531a5a0ebd9334f74c9edb2ae68` |
'''
          if table_anchor not in text:
              raise SystemExit('phase 3 table anchor not found')
          text = text.replace(table_anchor, table_new, 1)

          lineage_old = '''#306 was created directly from that result and squash-merged as `1edbd24ebfe66f990373526276228d0cc5ba5a29`; **current #307 is normalized directly onto #306 squash `1edbd24ebfe66f990373526276228d0cc5ba5a29` and is behind `main` by zero**.'''
          lineage_new = '''#306 was created directly from that result and squash-merged as `1edbd24ebfe66f990373526276228d0cc5ba5a29`; #307 was normalized directly onto #306, validated at exact head `8ea1c90ee41761706c797b646c37546881c84dd4`, and squash-merged as `0718f1069c0e4531a5a0ebd9334f74c9edb2ae68`; **the current cursor-export branch was created directly from that actual #307 squash result and was behind `main` by zero when its hard gate was frozen**.'''
          if lineage_old not in text:
              raise SystemExit('lineage anchor not found')
          text = text.replace(lineage_old, lineage_new, 1)

          baseline_anchor = '''Normal-playback v4 includes deterministic project-font bytes and proves exact Chromium `FontFace` readiness, stabilized layout evidence, mixed consumer ownership, and atomic revocation for the supported fixture. #306 now binds FFmpeg resource-backed text to the immutable staged face. #307 adds `parity-resource-text-v1`, a focused browser↔export glyph acceptance gate on Ubuntu 24.04 after two identical measurement runs. The 103-sample torture baseline still does not include a project font resource, and no second supported OS/FFmpeg retained font run exists yet. Do not treat cross-machine glyph identity as closed.
'''
          baseline_new = baseline_anchor + '''
`parity-cursor-v1` is the focused static-2D cursor browser↔export acceptance gate. It independently proves exact `cursor-state-v1` output-frame sampling, owner-track export, pinned cursor palette, immutable backdrop identity, and strict `<300 ms` click-ring boundaries. It does not admit cursor during normal playback and does not cover smoothing, animated/3D/camera/effect/transition parents, click audio, or unbounded cursor expansion.
'''
          if baseline_anchor not in text:
              raise SystemExit('baseline cursor anchor not found')
          text = text.replace(baseline_anchor, baseline_new, 1)

          risk_anchor = '''| A renderer-specific painter approximation is mistaken for an exact raster source | #299 explicitly rejects broad shape admission after inspecting current FFmpeg shape approximations. New painter/source classes require independent ordering, readiness, geometry, and retained pixel evidence before classifier admission. |
'''
          risk_new = risk_anchor + '''| Cursor theme tokens drift independently from export raster colors | The supported cursor visual contract pins explicit sRGB highlight/ring values in canonical preview, compatibility preview, and Go export. `parity-cursor-v1` hard-gates those exact palette values plus the stable Chromium-vs-Go edge envelope. |
| Partial cursor support is mistaken for universal cursor parity | Capability remains `Partial`; smoothing, animated/3D/camera/effect/transition parents, ambiguous overlap, long unbounded expansion, and click audio are not claimed by the canonical export path. |
'''
          if risk_anchor not in text:
              raise SystemExit('risk cursor anchor not found')
          text = text.replace(risk_anchor, risk_new, 1)

          next_old = '''1. **Merge #307 only after the final tracker-bearing exact head passes Video Resource Text Parity Evidence plus every Quality/Security/browser/renderer/platform workflow triggered by the PR diff.** The pre-tracker hard-gate run proves the envelope but does not exempt the documentation head from exact validation.
2. **Start the next implementation slice directly from #307's actual squash result and replace the current renderer cursor approximation with `cursor-state-v1`-aligned export semantics before admitting cursor during normal playback.** The current FidelityRenderer samples at 12–30 Hz, paints a Unicode `➤`, uses a renderer-specific text face/stroke/shadow, and approximates click rings with a rectangle; those pixels are not canonical cursor evidence.
3. Build the cursor slice around exact output-frame sampling, the existing strict `<300 ms` click window, canonical scale/highlight/click-ring state, and a focused retained browser↔export fixture. Do not promote cursor playback until export evidence passes and the complete-frame fallback control remains green.
4. Keep general shape playback deferred until the current FFmpeg shape approximations are replaced or independently proven. In parallel, add a second supported OS/toolchain run for the resource-font fixture so Phase 0 can retire the remaining cross-machine font-evidence debt without delaying cursor implementation.'''
          next_new = '''1. **Open and merge the cursor-export parity PR only after the final tracker-bearing exact head passes Video Cursor Parity Evidence plus every Quality/Security/browser/renderer/platform workflow triggered by the PR diff.** The pre-PR hard-gate run `33801254401` proves the frozen envelope but does not exempt the final PR head from exact validation.
2. **Start the next slice directly from the cursor PR's actual squash result and admit only the proven static-2D cursor subset during normal playback.** Extend complete-frame atomic composition so a ready canonical cursor can coexist with supported media/resource-text/weighted consumers, while any unsupported cursor case still revokes the entire visual frame to legacy-time fallback.
3. Add retained normal-playback cursor authority/readiness evidence before broadening the playback classifier. Preserve exact output-frame identity, owner-layer ordering, pinned palette, strict `<300 ms` ring state, and whole-frame revocation controls; do not treat the export-only hard gate as playback proof.
4. Keep general shape playback deferred until FFmpeg shape approximations are replaced or independently proven. Cursor smoothing/animated-parent semantics and click-audio synthesis should remain separate follow-on renderer slices. In parallel, add a second supported OS/toolchain run for the resource-font fixture to reduce the remaining cross-machine font-evidence debt.'''
          if next_old not in text:
              raise SystemExit('next recommended slice anchor not found')
          text = text.replace(next_old, next_new, 1)

          path.write_text(text)
          PY
      - name: Verify tracker diff
        run: |
          git diff --check
          grep -q '33801254401' docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md
          grep -q '0718f1069c0e4531a5a0ebd9334f74c9edb2ae68' docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md
          grep -q 'parity-cursor-v1' docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md
      - name: Commit tracker update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md
          git commit -m 'Update WYSIWYG cursor parity tracker'
          git push origin HEAD:feat/video-wysiwyg-phase3-cursor-export-parity
