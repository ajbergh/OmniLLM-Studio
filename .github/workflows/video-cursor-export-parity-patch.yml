name: Video Cursor Export Parity Patch

on:
  push:
    branches: [feat/video-wysiwyg-phase3-cursor-export-parity]
    paths:
      - '.github/workflows/video-cursor-export-parity-patch.yml'

permissions:
  contents: write

jobs:
  patch-tracker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/video-wysiwyg-phase3-cursor-export-parity
      - name: Update durable WYSIWYG tracker
        run: python3 scripts/patch-video-cursor-export-parity.py
      - name: Verify tracker diff
        run: |
          git diff --check
          grep -q '33801254401' docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md
          grep -q '0718f1069c0e4531a5a0ebd9334f74c9edb2ae68' docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md
          grep -q 'parity-cursor-v1' docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md
      - name: Commit tracker update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md
          git commit -m 'Update WYSIWYG cursor parity tracker'
          git push origin HEAD:feat/video-wysiwyg-phase3-cursor-export-parity
