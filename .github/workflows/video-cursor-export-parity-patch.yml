name: Video Cursor Export Parity Patch

on:
  push:
    branches: [feat/video-wysiwyg-phase3-cursor-export-parity]
    paths:
      - '.github/workflows/video-cursor-export-parity-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/video-wysiwyg-phase3-cursor-export-parity
      - name: Make cursor evidence color-space independent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/video-cursor-parity-capture.mjs')
          text = path.read_text()
          old = """    const highlight = cursorEvidence.child_divs.find((item) => item.background_color === 'rgba(253, 224, 71, 0.3)');\n    const ring = cursorEvidence.child_divs.find((item) => item.border_top_color === 'rgba(56, 189, 248, 0.8)' && item.border_top_width === '2px');"""
          new = """    const highlight = cursorEvidence.child_divs.find((item) =>\n      item.border_top_width === '0px'\n      && Math.abs(Number.parseFloat(item.width) - cursorEvidence.svg_width * 2.2) < 0.05\n      && Math.abs(Number.parseFloat(item.height) - cursorEvidence.svg_height * 2.2) < 0.05);\n    const ring = cursorEvidence.child_divs.find((item) =>\n      item.border_top_width === '2px'\n      && Math.abs(Number.parseFloat(item.width) - cursorEvidence.svg_width * 2.6) < 0.05\n      && Math.abs(Number.parseFloat(item.height) - cursorEvidence.svg_height * 2.6) < 0.05);"""
          if old not in text:
              raise SystemExit('cursor evidence color assertion anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate capture script
        run: |
          node --check scripts/video-cursor-parity-capture.mjs
          git diff --check
      - name: Commit evidence assertion fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/video-cursor-parity-capture.mjs
          git commit -m 'Make cursor evidence color-space independent'
          git push origin HEAD:feat/video-wysiwyg-phase3-cursor-export-parity
