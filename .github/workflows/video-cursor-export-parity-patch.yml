name: Video Cursor Export Parity Patch

on:
  push:
    branches: [feat/video-wysiwyg-phase3-cursor-export-parity]
    paths:
      - '.github/workflows/video-cursor-export-parity-patch.yml'

permissions:
  contents: write

env:
  GO_VERSION: '1.25.13'
  NODE_VERSION: '24'

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/video-wysiwyg-phase3-cursor-export-parity
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin canonical cursor palette
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'patch anchor not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'frontend/src/components/video/PreviewCanonicalPainters.tsx',
              '''          className="absolute rounded-full bg-yellow-300/30"\n          style={{ width: size * 2.2, height: size * 2.2, left: -size * 1.1, top: -size * 1.1 }}''',
              '''          className="absolute rounded-full"\n          style={{ width: size * 2.2, height: size * 2.2, left: -size * 1.1, top: -size * 1.1, background: 'rgba(255, 223, 32, 0.3)' }}''',
          )
          replace_once(
              'frontend/src/components/video/PreviewCanonicalPainters.tsx',
              '''          className="absolute rounded-full border-2 border-sky-400/80"\n          style={{ width: size * 2.6, height: size * 2.6, left: -size * 1.3, top: -size * 1.3 }}''',
              '''          className="absolute rounded-full"\n          style={{ width: size * 2.6, height: size * 2.6, left: -size * 1.3, top: -size * 1.3, border: '2px solid rgba(0, 188, 255, 0.8)' }}''',
          )
          replace_once(
              'frontend/src/components/video/VideoPreviewCanvasLegacy.tsx',
              '''                  className="absolute rounded-full bg-yellow-300/30"\n                  style={{ width: size * 2.2, height: size * 2.2, left: -size * 1.1, top: -size * 1.1 }}''',
              '''                  className="absolute rounded-full"\n                  style={{ width: size * 2.2, height: size * 2.2, left: -size * 1.1, top: -size * 1.1, background: 'rgba(255, 223, 32, 0.3)' }}''',
          )
          replace_once(
              'frontend/src/components/video/VideoPreviewCanvasLegacy.tsx',
              '''                  className="absolute rounded-full border-2 border-sky-400/80"\n                  style={{ width: size * 2.6, height: size * 2.6, left: -size * 1.3, top: -size * 1.3 }}''',
              '''                  className="absolute rounded-full"\n                  style={{ width: size * 2.6, height: size * 2.6, left: -size * 1.3, top: -size * 1.3, border: '2px solid rgba(0, 188, 255, 0.8)' }}''',
          )
          replace_once(
              'backend/internal/video/renderer_cursor.go',
              '''\t\tout = overPixel(out, 253.0/255, 224.0/255, 71.0/255, 0.30)''',
              '''\t\t// Pinned sRGB cursor palette; keep in sync with CanonicalPreviewCursor.\n\t\tout = overPixel(out, 1, 223.0/255, 32.0/255, 0.30)''',
          )
          replace_once(
              'backend/internal/video/renderer_cursor.go',
              '''\t\t\tout = overPixel(out, 56.0/255, 189.0/255, 248.0/255, 0.80)''',
              '''\t\t\tout = overPixel(out, 0, 188.0/255, 1, 0.80)''',
          )

          test_path = Path('backend/internal/video/renderer_cursor_test.go')
          text = test_path.read_text()
          if 'TestCanonicalCursorRasterUsesPinnedSRGBPalette' not in text:
              text = text.replace('import (\n\t"image/png"', 'import (\n\t"image/color"\n\t"image/png"', 1)
              text += '''\nfunc TestCanonicalCursorRasterUsesPinnedSRGBPalette(t *testing.T) {\n\tspec := cursorRasterSpec{Scale: 1, Highlight: true, ClickRing: true}\n\thighlight := supersampledCursorPixel(320, 180, 320, 180, spec)\n\tif want := (color.NRGBA{R: 255, G: 223, B: 32, A: 77}); highlight != want {\n\t\tt.Fatalf("cursor highlight pixel = %+v, want %+v", highlight, want)\n\t}\n\tring := supersampledCursorPixel(402, 180, 320, 180, spec)\n\tif want := (color.NRGBA{R: 0, G: 188, B: 255, A: 204}); ring != want {\n\t\tt.Fatalf("cursor ring pixel = %+v, want %+v", ring, want)\n\t}\n}\n'''
              test_path.write_text(text)
          PY
      - name: Format and verify diff
        run: |
          gofmt -w backend/internal/video/renderer_cursor.go backend/internal/video/renderer_cursor_test.go
          git diff --check
      - name: Run focused backend tests
        working-directory: backend
        run: go test ./internal/video/...
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Commit pinned cursor palette
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/internal/video/renderer_cursor.go \
            backend/internal/video/renderer_cursor_test.go \
            frontend/src/components/video/PreviewCanonicalPainters.tsx \
            frontend/src/components/video/VideoPreviewCanvasLegacy.tsx
          git commit -m 'Pin cursor palette across preview and export'
          git push origin HEAD:feat/video-wysiwyg-phase3-cursor-export-parity
