name: Video Pixelate Parity Evidence

on:
  pull_request:
    paths:
      - '.github/workflows/video-pixelate-parity.yml'
      - 'backend/internal/video/parity_fixture_pixelate.go'
      - 'backend/internal/video/parity_fixture_pixelate_test.go'
      - 'backend/internal/video/renderer.go'
      - 'backend/internal/video/renderer_pixelate_sampling_test.go'
      - 'frontend/src/components/video/PreviewPixelateBackdropConsumer.tsx'
      - 'frontend/src/components/video/PreviewPixelateCanvas.tsx'
      - 'frontend/src/components/video/previewPixelateBackdrop.ts'
      - 'frontend/src/components/video/previewPixelateCanvasRuntime.ts'
      - 'frontend/src/components/video/previewPixelateRaster.ts'
      - 'scripts/video-pixelate-parity-assert.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/video-pixelate-parity.yml'
      - 'backend/internal/video/parity_fixture_pixelate.go'
      - 'backend/internal/video/parity_fixture_pixelate_test.go'
      - 'backend/internal/video/renderer.go'
      - 'backend/internal/video/renderer_pixelate_sampling_test.go'
      - 'frontend/src/components/video/PreviewPixelateBackdropConsumer.tsx'
      - 'frontend/src/components/video/PreviewPixelateCanvas.tsx'
      - 'frontend/src/components/video/previewPixelateBackdrop.ts'
      - 'frontend/src/components/video/previewPixelateCanvasRuntime.ts'
      - 'frontend/src/components/video/previewPixelateRaster.ts'
      - 'scripts/video-pixelate-parity-assert.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-pixelate-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.13'
  NODE_VERSION: '24'

jobs:
  bootstrap-renderer-fix:
    name: Bootstrap proven pixelate renderer fix
    if: github.event_name == 'pull_request' && github.head_ref == 'test/video-wysiwyg-phase3-pixelate-opaque-parity-evidence'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test/video-wysiwyg-phase3-pixelate-opaque-parity-evidence
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Apply guarded renderer substitutions
        shell: python
        run: |
          from pathlib import Path

          path = Path('backend/internal/video/renderer.go')
          text = path.read_text()
          replacements = [
              (
                  'parts = append(parts, "[0:v]setpts=PTS-STARTPTS[base_v]")',
                  '// Keep the compositing graph in RGB until the final output/codec boundary.\n\t// FFmpeg overlay otherwise negotiates a subsampled YUV format, which loses\n\t// chroma bytes before pixelate samples the already-composited backdrop.\n\tparts = append(parts, "[0:v]format=rgba,setpts=PTS-STARTPTS[base_v]")',
              ),
              (
                  'overlayFilter := fmt.Sprintf("%s%soverlay=enable=\'between(t\\\\,%.3f\\\\,%.3f)\':x=\'%s\':y=\'%s\'%s",',
                  'overlayFilter := fmt.Sprintf("%s%soverlay=enable=\'between(t\\\\,%.3f\\\\,%.3f)\':x=\'%s\':y=\'%s\':format=rgb%s",',
              ),
              (
                  'fmt.Sprintf("%scrop=%d:%d:%d:%d,scale=%d:%d:flags=neighbor,scale=%d:%d:flags=neighbor%s", srcLabel, boxW, boxH, x, y, downW, downH, boxW, boxH, blurLabel),',
                  'fmt.Sprintf("%scrop=%d:%d:%d:%d,scale=%d:%d:flags=neighbor+full_chroma_inp,scale=%d:%d:flags=neighbor+full_chroma_inp%s", srcLabel, boxW, boxH, x, y, downW, downH, boxW, boxH, blurLabel),',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'guarded renderer replacement matched {count} times, expected exactly once: {old}')
              text = text.replace(old, new, 1)

          start_marker = '\tif shape.Kind == ShapeKindPixelate {'
          end_marker = '\n\t}\n\treturn []string{'
          if text.count(start_marker) != 1:
              raise SystemExit('pixelate renderer branch marker must occur exactly once')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          pixelate = text[start:end]
          overlay_old = 'fmt.Sprintf("%s%soverlay=%d:%d:enable=\'between(t\\\\,%.3f\\\\,%.3f)\'%s", baseLabel, blurLabel, x, y, startS, endS, outLabel),'
          overlay_new = 'fmt.Sprintf("%s%soverlay=%d:%d:enable=\'between(t\\\\,%.3f\\\\,%.3f)\':format=rgb%s", baseLabel, blurLabel, x, y, startS, endS, outLabel),'
          if pixelate.count(overlay_old) != 1:
              raise SystemExit(f'pixelate-scoped overlay replacement matched {pixelate.count(overlay_old)} times, expected exactly once')
          pixelate = pixelate.replace(overlay_old, overlay_new, 1)
          text = text[:start] + pixelate + text[end:]
          path.write_text(text)
      - name: Validate focused renderer contract
        run: |
          gofmt -w backend/internal/video/renderer.go backend/internal/video/renderer_pixelate_sampling_test.go
          cd backend
          go test ./internal/video -run 'TestBlurRegionPartsPixelateUsesByteExactRGBNeighborSampling|TestBuildFilterComplexKeepsVisualCompositionInRGB' -count=1
      - name: Commit only production and test changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout 3f7021a7ee1d97cbcad5fd477abf806895669dfc -- .github/workflows/video-pixelate-parity.yml
          git rm -f .github/workflows/patch-video-pixelate-rgb.yml
          git add backend/internal/video/renderer.go backend/internal/video/renderer_pixelate_sampling_test.go .github/workflows/video-pixelate-parity.yml
          git commit -m 'fix(video): preserve exact pixelate rgb sampling'
          git push origin HEAD:test/video-wysiwyg-phase3-pixelate-opaque-parity-evidence

  evidence:
    name: Opaque PNG pixelate preview-render evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - working-directory: frontend
        run: npm ci
      - name: Install parity dependencies
        run: |
          bash scripts/ci-apt-install.sh ffmpeg
          bash scripts/ci-playwright-install.sh
          command -v ffmpeg
          command -v ffprobe
      - name: Generate focused fixture and shared deterministic media
        run: |
          set -euo pipefail
          (
            cd backend
            go run ./cmd/video-parity-fixture \
              --output-dir ../output/video-pixelate-parity/fixture \
              --random-samples 0 \
              --generate-media
            go run ./cmd/video-pixelate-parity-fixture \
              --output-dir ../output/video-pixelate-parity/fixture
          )
      - name: Capture and report pixelate evidence
        shell: bash
        run: |
          set -euo pipefail
          runtime="$GITHUB_WORKSPACE/output/video-pixelate-parity/runtime"
          mkdir -p "$runtime/attachments"
          export OMNILLM_PORT=18091
          export OMNILLM_DB_PATH="$runtime/parity.db"
          export OMNILLM_ATTACHMENTS_DIR="$runtime/attachments"
          (
            cd backend
            go run ./cmd/server >"$runtime/backend.log" 2>"$runtime/backend.err.log"
          ) &
          backend_pid=$!
          (
            cd frontend
            OMNILLM_API_PROXY_TARGET=http://127.0.0.1:18091 npm run dev -- --host 127.0.0.1 --port 14174 >"$runtime/frontend.log" 2>"$runtime/frontend.err.log"
          ) &
          frontend_pid=$!
          cleanup() {
            kill "$frontend_pid" "$backend_pid" 2>/dev/null || true
            wait "$frontend_pid" "$backend_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18091/v1/health >/dev/null && curl --fail --silent http://127.0.0.1:14174/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "pixelate parity servers did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

          fixture=output/video-pixelate-parity/fixture/parity-pixelate-opaque-v1.json
          regions=output/video-pixelate-parity/fixture/parity-pixelate-opaque-v1.regions.json
          capture=output/video-pixelate-parity/capture
          node scripts/video-parity-capture.mjs \
            --url http://127.0.0.1:14174 \
            --fixture "$fixture" \
            --media-dir output/video-pixelate-parity/fixture/media \
            --output "$capture"
          node scripts/video-pixelate-parity-assert.mjs \
            --url http://127.0.0.1:14174 \
            --fixture "$fixture" \
            --seed-result "$capture/seed-result.json" \
            --output "$capture/pixelate-canvas-evidence.json"

          timeline_hash="$(node -p "require('./$capture/seed-result.json').timeline_sha256")"
          (
            cd backend
            go run ./cmd/video-parity-report \
              --preview-dir ../$capture/preview \
              --rendered-dir ../$capture/rendered \
              --output-dir ../$capture/pixelate-report \
              --fps 30 \
              --fixture parity-pixelate-opaque-v1 \
              --timeline-sha256 "$timeline_hash" \
              --regions ../$regions \
              --allow-fail
          )

          node - <<'NODE'
          const fs = require('fs');
          const fixture = JSON.parse(fs.readFileSync('output/video-pixelate-parity/fixture/parity-pixelate-opaque-v1.json', 'utf8'));
          const consumer = JSON.parse(fs.readFileSync('output/video-pixelate-parity/capture/pixelate-canvas-evidence.json', 'utf8'));
          const report = JSON.parse(fs.readFileSync('output/video-pixelate-parity/capture/pixelate-report/parity-report.json', 'utf8'));
          if (consumer.frames.length !== fixture.samples.length) throw new Error('pixelate consumer evidence sample count mismatch');
          if (report.frames.length !== fixture.samples.length) throw new Error('pixelate parity report sample count mismatch');
          let exact = 0;
          const summaries = report.frames.map((frame) => {
            const region = (frame.structural_regions || []).find((candidate) => candidate.name === 'pixelate-output');
            if (!region) throw new Error(`frame ${frame.frame_index} is missing pixelate-output structural evidence`);
            if (region.compared_pixels !== 403 * 307) throw new Error(`frame ${frame.frame_index} compared ${region.compared_pixels} region pixels, want ${403 * 307}`);
            if (region.exact) exact += 1;
            return {
              frame_index: frame.frame_index,
              exact: region.exact,
              changed_pixels: region.changed_pixels,
              pixel_pass_rate: frame.pixel_pass_rate,
              ssim: frame.ssim,
              max_channel_delta: frame.max_channel_delta,
            };
          });
          const summary = {
            schema_version: 1,
            fixture: fixture.name,
            samples: fixture.samples.length,
            exact_region_frames: exact,
            all_regions_exact: exact === fixture.samples.length,
            whole_frame_report_pass: report.pass,
            frames: summaries,
          };
          fs.writeFileSync('output/video-pixelate-parity/capture/pixelate-evidence-summary.json', `${JSON.stringify(summary, null, 2)}\n`);
          console.log(JSON.stringify(summary));
          NODE
      - name: Record toolchain
        if: always()
        run: |
          mkdir -p output/video-pixelate-parity
          {
            go version
            node --version
            npm --version
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1
            node -e "console.log('playwright ' + require('playwright/package.json').version)"
          } > output/video-pixelate-parity/toolchain.txt
      - name: Upload pixelate parity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-pixelate-parity-evidence
          path: output/video-pixelate-parity
          if-no-files-found: error
          retention-days: 14
