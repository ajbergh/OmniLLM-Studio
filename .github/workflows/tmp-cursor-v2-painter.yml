name: Cursor V2 Painter Integration

on:
  push:
    branches:
      - feat/video-wysiwyg-phase3-cursor-smoothing-parity

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply v2 painter patch
        run: |
          set -euo pipefail
          python scripts/tmp-cursor-v2-painter-patch.py
          git diff --check
      - name: Validate v2 canonical painter
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          npx vitest run \
            src/components/video/PreviewCanonicalPainters.test.ts \
            test/renderContractCursor.test.ts \
            test/renderContractFrameStateCursor.test.ts \
            src/components/video/previewCursorPlayback.test.ts
          npm run build
      - name: Commit validated v2 painter
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-cursor-v2-painter.yml
          rm scripts/tmp-cursor-v2-painter-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Accept cursor-state-v2 in canonical preview painter"
          git push origin HEAD:feat/video-wysiwyg-phase3-cursor-smoothing-parity
