name: Temporary media geometry integration

on:
  push:
    branches: [feat/video-wysiwyg-phase2-media-geometry]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/video-wysiwyg-phase2-media-geometry
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Fold media geometry into FrameState and update tracker
        run: |
          python3 - <<'PY'
          from pathlib import Path

          go = Path('backend/internal/video/rendercontract/frame_state.go')
          s = go.read_text()
          old = '\tContentBounds *TimelineV2ContentBounds `json:"content_bounds,omitempty"`\n\tTransform     EvaluatedTransform       `json:"transform"`\n'
          new = '\tContentBounds *TimelineV2ContentBounds `json:"content_bounds,omitempty"`\n\tGeometry      *EvaluatedMediaGeometry  `json:"geometry,omitempty"`\n\tTransform     EvaluatedTransform       `json:"transform"`\n'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = '''\tbounds := effectiveContentBounds(canvas, clip)\n\tunresolved := unresolvedLayerFeatures(clip, bounds)\n\tanchorOffsetX, anchorOffsetY := 0.0, 0.0\n'''
          new = '''\tbounds := effectiveContentBounds(canvas, clip)\n\tunresolved := unresolvedLayerFeatures(clip, bounds)\n\tvar geometry *EvaluatedMediaGeometry\n\tif clip.AssetID != "" {\n\t\tif clip.ContentBounds == nil {\n\t\t\tunresolved = append(unresolved, "media_source_bounds")\n\t\t} else {\n\t\t\tevaluated, geometryErr := EvaluateMediaGeometry(canvas, clip)\n\t\t\tif geometryErr != nil {\n\t\t\t\treturn FrameLayerState{}, fmt.Errorf("clip %q media geometry: %w", clip.ID, geometryErr)\n\t\t\t}\n\t\t\tgeometry = &evaluated\n\t\t}\n\t}\n\tanchorOffsetX, anchorOffsetY := 0.0, 0.0\n'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = '\t\tMediaFit: clip.MediaFit, ContentBounds: bounds, Transform: transform, ViewTransform: view,\n'
          new = '\t\tMediaFit: clip.MediaFit, ContentBounds: bounds, Geometry: geometry, Transform: transform, ViewTransform: view,\n'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = '''\tif clip.AssetID != "" {\n\t\treturn &TimelineV2ContentBounds{Width: float64(canvas.Width), Height: float64(canvas.Height)}\n\t}\n'''
          assert s.count(old) == 1
          s = s.replace(old, '', 1)
          old = '''\tif clip.MaskSourceCrop != nil {\n\t\tunresolved = append(unresolved, "mask_source_crop")\n\t}\n\tif clip.MediaFit != "" && clip.MediaFit != "contain" {\n\t\tunresolved = append(unresolved, "media_fit:"+clip.MediaFit)\n\t}\n'''
          assert s.count(old) == 1
          s = s.replace(old, '', 1)
          go.write_text(s)

          ts = Path('frontend/src/video/renderContractFrameState.ts')
          s = ts.read_text()
          old = "import { normalizeTimelineV2EvaluationInputs } from './renderContractNormalize';\n"
          new = old + "import { evaluateMediaGeometry, type CanonicalMediaGeometry } from './renderContractMediaGeometry';\n"
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = '''  content_bounds?: TimelineV2ContentBounds;\n  transform: CanonicalEvaluatedTransform;\n'''
          new = '''  content_bounds?: TimelineV2ContentBounds;\n  geometry?: CanonicalMediaGeometry;\n  transform: CanonicalEvaluatedTransform;\n'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = '''  const contentBounds = effectiveContentBounds(canvas, clip);\n  const unresolved = unresolvedLayerFeatures(clip);\n  let anchorOffsetX = 0;\n'''
          new = '''  const contentBounds = effectiveContentBounds(canvas, clip);\n  const unresolved = unresolvedLayerFeatures(clip);\n  let geometry: CanonicalMediaGeometry | undefined;\n  if (clip.asset_id) {\n    if (!clip.content_bounds) unresolved.push('media_source_bounds');\n    else geometry = evaluateMediaGeometry(canvas, clip);\n  }\n  let anchorOffsetX = 0;\n'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = '''    ...(contentBounds ? { content_bounds: contentBounds } : {}),\n    transform,\n'''
          new = '''    ...(contentBounds ? { content_bounds: contentBounds } : {}),\n    ...(geometry ? { geometry } : {}),\n    transform,\n'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = "  if (clip.asset_id) return { x: 0, y: 0, width: canvas.width, height: canvas.height };\n"
          assert s.count(old) == 1
          s = s.replace(old, '', 1)
          old = "  if (clip.mask_source_crop) unresolved.push('mask_source_crop');\n  if (clip.media_fit && clip.media_fit !== 'contain') unresolved.push(`media_fit:${clip.media_fit}`);\n"
          assert s.count(old) == 1
          s = s.replace(old, '', 1)
          ts.write_text(s)

          fixture = Path('video-renderer/test/fixtures/visual-frame-state-v1.json')
          s = fixture.read_text()
          old = '            "media_fit": "contain",\n            "fade_in_ms": 10,\n'
          new = '            "media_fit": "contain",\n            "content_bounds": { "x": 0, "y": 0, "width": 200, "height": 100 },\n            "fade_in_ms": 10,\n'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = '            "media_fit": "cover",\n            "transform": { "perspective": 500 },\n'
          new = '            "media_fit": "cover",\n            "content_bounds": { "x": 0, "y": 0, "width": 100, "height": 100 },\n            "transform": { "perspective": 500 },\n'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          s = s.replace('    "unsupported:effects",\n    "unsupported:media_fit:cover"\n', '    "unsupported:effects"\n', 1)
          fixture.write_text(s)

          doc = Path('docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md')
          s = doc.read_text()
          old = '- PR #206 — exact-frame visual FrameState foundation — `c37ba2ed8132133cc913531946d462c3b7b38911`.\n'
          new = old + '- PR #208 — canonical cross-runtime FrameState parity diagnostics — `52683e4d25b22f70e5c6c3b4a8cf3417240be4bc`.\n'
          if new not in s:
              assert s.count(old) == 1
              s = s.replace(old, new, 1)
          start = s.index('Current PR: **#208')
          end = s.index('\n## Phase tracker', start)
          handoff = '''Current PR: **#209 — Canonicalize media fit and crop geometry**.\nCurrent branch: `feat/video-wysiwyg-phase2-media-geometry`.\n\nCurrent slice: make media placement renderer-independent before compositor migration. `media-geometry-v1` defines contain/cover/fill/none, source-mask crop before fit, output crop bounds, and explicit source-bounds provenance. Asset geometry fails closed when `content_bounds` is absent rather than guessing source aspect ratio from the output canvas.\n\nPR #208 merged as `52683e4d25b22f70e5c6c3b4a8cf3417240be4bc`. Its focused hosted parity run `32200543950` passed Go tests/vet, frontend lint/unit/build, 103/103 matching fail-closed saved-timeline diagnostics, and 103/103 matching available transition-free control states. Final-head frontend, dependency audit, and JS/TS CodeQL passed; Go CodeQL/backend runners remained in system-package setup and were recorded as infrastructure-only incomplete checks.\n'''
          s = s[:start] + handoff + s[end:]
          s = s.replace('PR #208 adds permanent cross-runtime FrameState diagnostics. Full media fit/mask/perspective semantics, transitions/effects, text/shape/cursor state, and AudioGraph remain.', 'PR #208 merged permanent cross-runtime FrameState diagnostics. PR #209 is canonicalizing media fit/source-mask/output-crop geometry with explicit source-bounds provenance. Clip perspective, transitions/effects, text/shape/cursor state, and AudioGraph remain.')
          s = s.replace('### Current PR #208 — canonical FrameState parity diagnostics', '### Merged PR #208 — canonical FrameState parity diagnostics', 1)
          marker = '### Remaining Phase 2 work\n'
          assert s.count(marker) == 1
          section = '''### Current PR #209 — canonical media geometry\n\nImplemented so far:\n\n- matching Go/TypeScript `media-geometry-v1` evaluators for `contain`, `cover`, `fill`, and `none`;\n- `mask_source_crop` is applied to explicit source bounds before fit; `transform.crop` produces a separate output clip box;\n- asset source aspect ratio is never inferred from canvas dimensions: missing `content_bounds` is explicit `media_source_bounds` unresolved state;\n- visual FrameState carries the evaluated geometry when source bounds are available, so PR #208's permanent cross-runtime diagnostics automatically cover the new state;\n- shared fixture covers every fit mode plus source-crop/output-crop composition.\n\nScope boundary: #209 does not migrate preview/export composition and does not yet define per-clip perspective projection.\n\n'''
          s = s.replace(marker, section + marker, 1)
          a = s.index('### Remaining Phase 2 work\n')
          b = s.index('\n### Phase 2 exit gate', a)
          remaining = '''### Remaining Phase 2 work\n\n1. Validate and merge PR #209 canonical media geometry.\n2. Define per-clip perspective projection and finish content-bounds/anchor provenance edge cases.\n3. Define transition placement/peer state and effect-stack ordering/animation.\n4. Define text/shape/cursor evaluated state.\n5. Define/compile serializable `AudioGraph` for timing/rate/channel/gain/fade/mute/solo/processing decisions.\n6. Fail closed whenever an authorable field lacks canonical semantics.\n'''
          s = s[:a] + remaining + s[b:]
          marker = '## Next recommended slice\n'
          assert s.count(marker) == 1
          s = s.split(marker, 1)[0] + '''## Next recommended slice\n\nAfter PR #209 is green and merged:\n\n1. Canonicalize per-clip perspective projection and the remaining content-bounds/anchor provenance edge cases in Go and TypeScript.\n2. Keep preview/export compositor behavior unchanged until that geometry state is cross-runtime validated.\n3. Then move to transition placement/peer state and effect-stack semantics as the next Phase 2 feature family.\n4. Continue Phase 0 visual thresholds, unsupported-audio boundary, and second-platform evidence in parallel.\n'''
          doc.write_text(s)
          PY
          gofmt -w backend/internal/video/rendercontract/frame_state.go backend/internal/video/rendercontract/media_geometry.go backend/internal/video/rendercontract/media_geometry_test.go
      - name: Focused Go validation
        working-directory: backend
        run: go test ./internal/video/rendercontract
      - name: Focused frontend validation
        working-directory: frontend
        run: |
          npm ci
          npx vitest run test/renderContractMediaGeometry.test.ts test/renderContractFrameState.test.ts
          npx eslint src/video/renderContractMediaGeometry.ts src/video/renderContractFrameState.ts test/renderContractMediaGeometry.test.ts
      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-media-geometry-integration.yml
          git add backend/internal/video/rendercontract/frame_state.go backend/internal/video/rendercontract/media_geometry.go backend/internal/video/rendercontract/media_geometry_test.go frontend/src/video/renderContractFrameState.ts frontend/src/video/renderContractMediaGeometry.ts frontend/test/renderContractMediaGeometry.test.ts video-renderer/test/fixtures/visual-frame-state-v1.json docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md
          git diff --cached --check
          git commit -m "feat(video): integrate canonical media geometry into FrameState"
          git push origin HEAD:feat/video-wysiwyg-phase2-media-geometry
