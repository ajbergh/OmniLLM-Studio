name: Temporary PR302 WYSIWYG tracker update

on:
  push:
    branches:
      - feat/video-wysiwyg-phase3-weighted-playback

permissions:
  contents: write

jobs:
  update-tracker:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/video-wysiwyg-phase3-weighted-playback
          fetch-depth: 0
      - name: Record exact weighted playback evidence
        run: python3 scripts/temporary_pr302_update_wysiwyg_tracker.py
      - name: Validate tracker diff
        run: git diff --check
      - name: Commit tracker update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md
          git commit -m "docs(video): record weighted playback parity evidence"
          git push origin HEAD:feat/video-wysiwyg-phase3-weighted-playback
