name: Cursor Smoothing Contract Integration

on:
  push:
    branches:
      - feat/video-wysiwyg-phase3-cursor-smoothing-parity

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Define cursor-state-v2 smoothing and admit it
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: anchor count={count}, want 1 for {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # Backend renderer-independent cursor contract: preserve v1 for linear
          # authored state and emit v2 only when smoothing=true.
          replace_once(
              'backend/internal/video/rendercontract/cursor_state.go',
              'const (\n\tCursorStateContractV1 = "cursor-state-v1"\n\tCursorClickWindowMS   = int64(300)',
              'const (\n\tCursorStateContractV1 = "cursor-state-v1"\n\tCursorStateContractV2 = "cursor-state-v2"\n\tCursorClickWindowMS   = int64(300)',
          )
          replace_once(
              'backend/internal/video/rendercontract/cursor_state.go',
              '// EvaluateCursorState samples Timeline v2 cursor metadata using the current\n// editor preview\'s linear interpolation, endpoint hold, and strict <300ms\n// click-proximity semantics. Omitted visible means visible. Smoothing is\n// authorable but has no defined editor algorithm today, so smoothing=true\n// fails closed instead of inventing renderer-specific behavior.',
              '// EvaluateCursorState samples Timeline v2 cursor metadata at exact rational\n// clip-relative time. Linear interpolation remains cursor-state-v1. When\n// smoothing=true, cursor-state-v2 applies deterministic cubic smoothstep timing\n// (3t^2-2t^3) between the same authored event coordinates. Endpoint hold and\n// the strict <300ms click-proximity rule are identical in both versions.',
          )
          replace_once(
              'backend/internal/video/rendercontract/cursor_state.go',
              '\tif cursor.Smoothing {\n\t\treturn nil, fmt.Errorf("canonical cursor smoothing is not defined for %s", CursorStateContractV1)\n\t}\n',
              '',
          )
          replace_once(
              'backend/internal/video/rendercontract/cursor_state.go',
              '\tx, y := sampleCursorPosition(cursor.Events, time)\n\tclick := cursorClickNearTime(cursor.Events, time)\n\treturn &EvaluatedCursorState{\n\t\tContractVersion: CursorStateContractV1,',
              '\tx, y := sampleCursorPosition(cursor.Events, time, cursor.Smoothing)\n\tclick := cursorClickNearTime(cursor.Events, time)\n\tcontractVersion := CursorStateContractV1\n\tif cursor.Smoothing {\n\t\tcontractVersion = CursorStateContractV2\n\t}\n\treturn &EvaluatedCursorState{\n\t\tContractVersion: contractVersion,',
          )
          replace_once(
              'backend/internal/video/rendercontract/cursor_state.go',
              'func sampleCursorPosition(events []TimelineV2CursorEvent, time RationalMilliseconds) (float64, float64) {',
              'func sampleCursorPosition(events []TimelineV2CursorEvent, time RationalMilliseconds, smoothing bool) (float64, float64) {',
          )
          replace_once(
              'backend/internal/video/rendercontract/cursor_state.go',
              '\t\t\tprogress := float64(time.Numerator-at(previous.TimeMS)) / float64(span*time.Denominator)\n\t\t\treturn previous.X + (next.X-previous.X)*progress, previous.Y + (next.Y-previous.Y)*progress',
              '\t\t\tprogress := float64(time.Numerator-at(previous.TimeMS)) / float64(span*time.Denominator)\n\t\t\tif smoothing {\n\t\t\t\tprogress = smoothCursorProgress(progress)\n\t\t\t}\n\t\t\treturn previous.X + (next.X-previous.X)*progress, previous.Y + (next.Y-previous.Y)*progress',
          )
          replace_once(
              'backend/internal/video/rendercontract/cursor_state.go',
              '\treturn previous.X, previous.Y\n}\n\nfunc cursorClickNearTime',
              '\treturn previous.X, previous.Y\n}\n\nfunc smoothCursorProgress(progress float64) float64 {\n\tif progress <= 0 {\n\t\treturn 0\n\t}\n\tif progress >= 1 {\n\t\treturn 1\n\t}\n\treturn progress * progress * (3 - 2*progress)\n}\n\nfunc cursorClickNearTime',
          )

          backend_smoothing_test = r'''
func TestEvaluateCursorStateDefinesDeterministicSmoothstepV2(t *testing.T) {
	cursor := &TimelineV2Cursor{
		Smoothing: true,
		Events: []TimelineV2CursorEvent{
			{TimeMS: 0, X: 0, Y: 0},
			{TimeMS: 1000, X: 100, Y: 200, Click: true},
		},
	}
	for _, sample := range []struct {
		timeMS int64
		x      float64
		y      float64
	}{
		{timeMS: 250, x: 15.625, y: 31.25},
		{timeMS: 500, x: 50, y: 100},
		{timeMS: 750, x: 84.375, y: 168.75},
	} {
		state, err := EvaluateCursorState(cursor, RationalMilliseconds{Numerator: sample.timeMS, Denominator: 1})
		if err != nil {
			t.Fatalf("sample %d: %v", sample.timeMS, err)
		}
		if state == nil || state.ContractVersion != CursorStateContractV2 || math.Abs(state.X-sample.x) > 1e-12 || math.Abs(state.Y-sample.y) > 1e-12 {
			t.Fatalf("sample %d = %+v, want x=%v y=%v v2", sample.timeMS, state, sample.x, sample.y)
		}
	}
	boundary, err := EvaluateCursorState(cursor, RationalMilliseconds{Numerator: 700, Denominator: 1})
	if err != nil || boundary == nil || boundary.Click {
		t.Fatalf("smooth click at exact 300ms boundary = %+v err=%v", boundary, err)
	}
	inside, err := EvaluateCursorState(cursor, RationalMilliseconds{Numerator: 701, Denominator: 1})
	if err != nil || inside == nil || !inside.Click {
		t.Fatalf("smooth click inside 300ms window = %+v err=%v", inside, err)
	}
}

'''
          replace_once(
              'backend/internal/video/rendercontract/cursor_state_test.go',
              'func TestEvaluateCursorStateDefaultsVisibilityAndScale',
              backend_smoothing_test + 'func TestEvaluateCursorStateDefaultsVisibilityAndScale',
          )
          replace_once(
              'backend/internal/video/rendercontract/cursor_state_test.go',
              '\t\t{name: "smoothing", cursor: &TimelineV2Cursor{Smoothing: true, Events: validEvent}, time: RationalMilliseconds{Denominator: 1}, want: "smoothing"},\n',
              '',
          )

          # FrameState now carries the v2 computed state rather than treating
          # authored smoothing as unresolved debt.
          backend_frame_smoothing = r'''
func TestVisualFrameStateProjectsSmoothedCursorV2AtExactRationalTime(t *testing.T) {
	cursor := &TimelineV2Cursor{
		Smoothing: true,
		Events: []TimelineV2CursorEvent{
			{TimeMS: 0, X: 10, Y: 20},
			{TimeMS: 10, X: 40, Y: 50, Click: true},
		},
	}
	state, err := EvaluateVisualFrameState(cursorFrameStateDocument(cursor), 1)
	if err != nil {
		t.Fatalf("EvaluateVisualFrameState: %v", err)
	}
	layer := state.Layers[0]
	want := 10.0 + 30.0*(7.0/27.0)
	wantY := 20.0 + 30.0*(7.0/27.0)
	if layer.Cursor == nil || layer.Cursor.ContractVersion != CursorStateContractV2 || math.Abs(layer.Cursor.X-want) > 1e-12 || math.Abs(layer.Cursor.Y-wantY) > 1e-12 {
		t.Fatalf("smoothed cursor = %+v want x=%v y=%v", layer.Cursor, want, wantY)
	}
	if !layer.Authoritative || !state.Authoritative || len(layer.Unresolved) != 0 || len(state.Unresolved) != 0 {
		t.Fatalf("smoothed authority layer=%v state=%v unresolved=%v/%v", layer.Authoritative, state.Authoritative, layer.Unresolved, state.Unresolved)
	}
}

'''
          replace_once(
              'backend/internal/video/rendercontract/frame_state_cursor_test.go',
              'import (\n\t"strings"\n\t"testing"\n)',
              'import (\n\t"math"\n\t"strings"\n\t"testing"\n)',
          )
          replace_once(
              'backend/internal/video/rendercontract/frame_state_cursor_test.go',
              'func TestVisualFrameStateTreatsHiddenOrEmptyCursorAsResolvedNoPaint',
              backend_frame_smoothing + 'func TestVisualFrameStateTreatsHiddenOrEmptyCursorAsResolvedNoPaint',
          )
          replace_once(
              'backend/internal/video/rendercontract/frame_state_cursor_test.go',
              'func TestVisualFrameStateFailsClosedOnInvalidCursorState(t *testing.T) {\n\tcursor := &TimelineV2Cursor{\n\t\tSmoothing: true,\n\t\tEvents:    []TimelineV2CursorEvent{{TimeMS: 0, X: 1, Y: 2}},\n\t}\n\t_, err := EvaluateVisualFrameState(cursorFrameStateDocument(cursor), 1)\n\tif err == nil || !strings.Contains(err.Error(), "canonical cursor state for clip \\\"cursor-clip\\\"") || !strings.Contains(err.Error(), "smoothing") {\n\t\tt.Fatalf("error = %v", err)\n\t}\n}',
              'func TestVisualFrameStateFailsClosedOnInvalidCursorState(t *testing.T) {\n\tscale := CursorMaxScale + 1\n\tcursor := &TimelineV2Cursor{\n\t\tScale:  &scale,\n\t\tEvents: []TimelineV2CursorEvent{{TimeMS: 0, X: 1, Y: 2}},\n\t}\n\t_, err := EvaluateVisualFrameState(cursorFrameStateDocument(cursor), 1)\n\tif err == nil || !strings.Contains(err.Error(), "canonical cursor state for clip \\\"cursor-clip\\\"") || !strings.Contains(err.Error(), "scale") {\n\t\tt.Fatalf("error = %v", err)\n\t}\n}',
          )

          # Canonical export admission can now use the v2 exact evaluator.
          replace_once(
              'backend/internal/video/renderer_cursor.go',
              '// a renderer-specific approximation (smoothing, animated/3D/camera/effect/\n// transition parents, overlapping same-track siblings, or clips too long for',
              '// a renderer-specific approximation (animated/3D/camera/effect/transition\n// parents, overlapping same-track siblings, or clips too long for',
          )
          replace_once(
              'backend/internal/video/renderer_cursor.go',
              '\tif clip.Cursor.Smoothing || clip.FadeInMS > 0 || clip.FadeOutMS > 0 || len(clip.Transitions) > 0 || len(clip.AnimationBlocks) > 0 {',
              '\tif clip.FadeInMS > 0 || clip.FadeOutMS > 0 || len(clip.Transitions) > 0 || len(clip.AnimationBlocks) > 0 {',
          )

          renderer_smoothing_test = r'''func TestCanonicalCursorRasterSupportsSmoothstepV2(t *testing.T) {
	doc := NewEmptyTimeline(640, 360, 100)
	doc.DurationMS = 1001
	doc.Tracks[0].Clips = []TimelineClip{{
		ID: "cursor-owner", AssetID: "media", StartMS: 0, DurationMS: 1001, TrimOutMS: 1001,
		Transform: map[string]any{"x": 0.0, "y": 0.0, "scale": 1.0, "rotation": 0.0, "opacity": 1.0},
		Effects:   []TimelineEffect{}, Keyframes: []TimelineKeyframe{}, Transitions: []TimelineTransition{},
		Cursor: &TimelineCursor{Visible: true, Scale: 1, Smoothing: true, Events: []TimelineCursorEvent{
			{TimeMS: 0, X: 320, Y: 180},
			{TimeMS: 1000, X: 420, Y: 280},
		}},
	}}

	expanded := ExpandTimelineForFidelity(doc, 100, 120)
	filtered := FilterTimelineAtDiagnosticFrame(expanded, 25, 100, 0)
	found := false
	for _, clip := range filtered.Tracks[0].Clips {
		if clip.Metadata == nil || clip.Metadata[cursorRasterMetadataKey] != cursorRasterContractVersion {
			continue
		}
		found = true
		x, _ := numericTransform(clip.Transform, "x")
		y, _ := numericTransform(clip.Transform, "y")
		if math.Abs(x-15.625) > 1e-9 || math.Abs(y-15.625) > 1e-9 {
			t.Fatalf("smoothed frame-25 cursor transform = x=%v y=%v, want 15.625/15.625", x, y)
		}
		if clip.Text != nil || clip.Shape != nil || !strings.HasPrefix(clip.AssetID, cursorRasterAssetPrefix) {
			t.Fatalf("smoothed cursor did not use canonical raster: %+v", clip)
		}
	}
	if !found {
		t.Fatalf("smoothed cursor did not produce a canonical v2 raster: %+v", filtered.Tracks[0].Clips)
	}
}

'''
          old_renderer_test_start = 'func TestCanonicalCursorRasterFallsBackForSmoothing(t *testing.T) {'
          old_renderer_test_end = '\nfunc TestMaterializeCanonicalCursorRasterAssets'
          p = Path('backend/internal/video/renderer_cursor_test.go')
          text = p.read_text()
          start = text.find(old_renderer_test_start)
          end = text.find(old_renderer_test_end, start)
          if start < 0 or end < 0:
              raise SystemExit('renderer smoothing fallback test anchors not found')
          p.write_text(text[:start] + renderer_smoothing_test + text[end+1:])

          # Frontend renderer-independent contract mirrors the Go evaluator.
          replace_once(
              'frontend/src/video/renderContractCursor.ts',
              "export const CURSOR_STATE_CONTRACT_V1 = 'cursor-state-v1' as const;",
              "export const CURSOR_STATE_CONTRACT_V1 = 'cursor-state-v1' as const;\nexport const CURSOR_STATE_CONTRACT_V2 = 'cursor-state-v2' as const;",
          )
          replace_once(
              'frontend/src/video/renderContractCursor.ts',
              '  contract_version: typeof CURSOR_STATE_CONTRACT_V1;',
              '  contract_version: typeof CURSOR_STATE_CONTRACT_V1 | typeof CURSOR_STATE_CONTRACT_V2;',
          )
          replace_once(
              'frontend/src/video/renderContractCursor.ts',
              ' * Omitted visible means visible. Linear interpolation, endpoint hold, and the\n * strict <300ms click window intentionally match the current editor preview.\n * Smoothing has no defined editor algorithm yet and therefore fails closed.',
              ' * Omitted visible means visible. Linear interpolation remains cursor-state-v1.\n * smoothing=true emits cursor-state-v2 and applies deterministic cubic\n * smoothstep timing (3t²−2t³) between the same authored event coordinates.\n * Endpoint hold and the strict <300ms click window are identical in both.',
          )
          replace_once(
              'frontend/src/video/renderContractCursor.ts',
              '  if (cursor.smoothing === true) {\n    throw new Error(`canonical cursor smoothing is not defined for ${CURSOR_STATE_CONTRACT_V1}`);\n  }\n',
              '',
          )
          replace_once(
              'frontend/src/video/renderContractCursor.ts',
              '  const position = sampleCursorPosition(cursor.events, time);\n  return {\n    contract_version: CURSOR_STATE_CONTRACT_V1,',
              '  const smoothing = cursor.smoothing === true;\n  const position = sampleCursorPosition(cursor.events, time, smoothing);\n  return {\n    contract_version: smoothing ? CURSOR_STATE_CONTRACT_V2 : CURSOR_STATE_CONTRACT_V1,',
          )
          replace_once(
              'frontend/src/video/renderContractCursor.ts',
              'function sampleCursorPosition(events: TimelineV2CursorEvent[], time: CanonicalRationalMilliseconds): { x: number; y: number } {',
              'function sampleCursorPosition(events: TimelineV2CursorEvent[], time: CanonicalRationalMilliseconds, smoothing: boolean): { x: number; y: number } {',
          )
          replace_once(
              'frontend/src/video/renderContractCursor.ts',
              '      const progress = (time.numerator - at(previous.time_ms)) / (span * time.denominator);\n      return {\n        x: previous.x + (next.x - previous.x) * progress,\n        y: previous.y + (next.y - previous.y) * progress,\n      };',
              '      const linearProgress = (time.numerator - at(previous.time_ms)) / (span * time.denominator);\n      const progress = smoothing ? smoothCursorProgress(linearProgress) : linearProgress;\n      return {\n        x: previous.x + (next.x - previous.x) * progress,\n        y: previous.y + (next.y - previous.y) * progress,\n      };',
          )
          replace_once(
              'frontend/src/video/renderContractCursor.ts',
              '}\n\nfunction cursorClickNearTime',
              '}\n\nfunction smoothCursorProgress(progress: number): number {\n  if (progress <= 0) return 0;\n  if (progress >= 1) return 1;\n  return progress * progress * (3 - 2 * progress);\n}\n\nfunction cursorClickNearTime',
          )

          replace_once(
              'frontend/test/renderContractCursor.test.ts',
              '  CURSOR_STATE_CONTRACT_V1,\n  evaluateCursorState,',
              '  CURSOR_STATE_CONTRACT_V1,\n  CURSOR_STATE_CONTRACT_V2,\n  evaluateCursorState,',
          )
          frontend_smoothing_test = r'''
  it('defines deterministic cursor-state-v2 smoothstep timing', () => {
    const cursor: TimelineV2Cursor = {
      smoothing: true,
      events: [
        { time_ms: 0, x: 0, y: 0 },
        { time_ms: 1000, x: 100, y: 200, click: true },
      ],
    };
    expect(evaluateCursorState(cursor, { numerator: 250, denominator: 1 })).toMatchObject({
      contract_version: CURSOR_STATE_CONTRACT_V2,
      x: 15.625,
      y: 31.25,
      click: false,
    });
    expect(evaluateCursorState(cursor, { numerator: 500, denominator: 1 })).toMatchObject({ x: 50, y: 100 });
    expect(evaluateCursorState(cursor, { numerator: 750, denominator: 1 })).toMatchObject({ x: 84.375, y: 168.75 });
    expect(evaluateCursorState(cursor, { numerator: 700, denominator: 1 })?.click).toBe(false);
    expect(evaluateCursorState(cursor, { numerator: 701, denominator: 1 })?.click).toBe(true);
  });

'''
          replace_once(
              'frontend/test/renderContractCursor.test.ts',
              "  it('defaults omitted visibility and scale but respects explicit hidden state', () => {",
              frontend_smoothing_test + "  it('defaults omitted visibility and scale but respects explicit hidden state', () => {",
          )
          replace_once(
              'frontend/test/renderContractCursor.test.ts',
              "  it('fails closed for undefined smoothing and malformed authorable state', () => {",
              "  it('fails closed for malformed authorable state', () => {",
