name: Cursor Smoothing Contract Integration

on:
  push:
    branches:
      - feat/video-wysiwyg-phase3-cursor-smoothing-parity

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply cursor smoothing contract patch
        run: |
          set -euo pipefail
          python scripts/tmp-cursor-smoothing-contract-patch.py
          gofmt -w \
            backend/internal/video/rendercontract/cursor_state.go \
            backend/internal/video/rendercontract/cursor_state_test.go \
            backend/internal/video/rendercontract/frame_state_cursor_test.go \
            backend/internal/video/renderer_cursor.go \
            backend/internal/video/renderer_cursor_test.go
          git diff --check
      - name: Validate backend cursor contract and renderer
        run: |
          set -euo pipefail
          cd backend
          go test ./internal/video/rendercontract -run 'Cursor'
          go test ./internal/video -run 'Cursor'
      - name: Validate frontend cursor contract and playback admission
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          npx vitest run \
            test/renderContractCursor.test.ts \
            test/renderContractFrameStateCursor.test.ts \
            src/components/video/previewCursorPlayback.test.ts \
            src/components/video/previewPlaybackCursorCanonicalization.test.ts
          npm run build
      - name: Commit validated smoothing contract
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-cursor-smoothing-contract.yml
          rm scripts/tmp-cursor-smoothing-contract-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Define canonical cursor smoothing contract"
          git push origin HEAD:feat/video-wysiwyg-phase3-cursor-smoothing-parity
