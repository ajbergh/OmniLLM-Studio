name: Temporary PR302 media host stabilization

on:
  push:
    branches:
      - feat/video-wysiwyg-phase3-weighted-playback

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/video-wysiwyg-phase3-weighted-playback
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Stabilize preview media host across canonical promotion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          legacy = Path('frontend/src/components/video/VideoPreviewCanvasLegacy.tsx')
          text = legacy.read_text()
          replacements = [
              (
                  "    pairPaint?: PreviewTransitionPairLayerPaint,\n    inPairSurface = false,\n  ) => {",
                  "    pairPaint?: PreviewTransitionPairLayerPaint,\n  ) => {",
              ),
              (
                  "      filter: effectPaint.filter,\n      pointerEvents: inPairSurface || perspectiveDistance !== null ? 'auto' : undefined,\n    };",
                  "      filter: effectPaint.filter,\n      // The stable perspective host below is pointer-events:none so it never\n      // intercepts empty-stage gestures. Keep the actual clip host explicitly\n      // targetable in both legacy and canonical projection modes.\n      pointerEvents: 'auto',\n    };",
              ),
              (
                  "    if (perspectiveDistance === null) return layer;\n    return (\n      <div\n        key={clip.id}\n        className=\"pointer-events-none absolute inset-0\"\n        style={{\n          perspective: `${canonicalPreviewPerspectiveCSSPixels(perspectiveDistance, stageScale)}px`,\n          perspectiveOrigin: '50% 50%',\n          transformStyle: 'preserve-3d',\n        }}\n      >\n        {layer}\n      </div>\n    );",
                  "    // Keep one stable outer host for the lifetime of the clip. Canonical\n    // admission can toggle per-layer perspective frame-by-frame; changing the\n    // root shape here would make React repurpose the legacy clip host as the\n    // perspective wrapper and recreate its <video>, resetting decoder state.\n    return (\n      <div\n        key={clip.id}\n        data-preview-layer-perspective-host={clip.id}\n        className=\"pointer-events-none absolute inset-0\"\n        style={{\n          perspective: perspectiveDistance === null\n            ? undefined\n            : `${canonicalPreviewPerspectiveCSSPixels(perspectiveDistance, stageScale)}px`,\n          perspectiveOrigin: '50% 50%',\n          transformStyle: 'preserve-3d',\n        }}\n      >\n        {layer}\n      </div>\n    );",
              ),
              (
                  "        {renderLayer(slot.lower, posterClipIds.has(slot.lower.clip.id), lowerPaint, true)}\n        {renderLayer(slot.upper, posterClipIds.has(slot.upper.clip.id), upperPaint, true)}",
                  "        {renderLayer(slot.lower, posterClipIds.has(slot.lower.clip.id), lowerPaint)}\n        {renderLayer(slot.upper, posterClipIds.has(slot.upper.clip.id), upperPaint)}",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'VideoPreviewCanvasLegacy patch target missing: {old[:120]!r}')
              text = text.replace(old, new, 1)
          legacy.write_text(text)

          canvas = Path('frontend/src/components/video/PreviewWeightedPairCanvas.tsx')
          text = canvas.read_text()
          old = '      data-preview-transition-pair-error={error ?? pendingReason ?? undefined}\n'
          new = (
              '      data-preview-transition-pair-error={error ?? undefined}\n'
              '      data-preview-transition-pair-pending-reason={pendingReason ?? undefined}\n'
          )
          if old not in text:
              raise SystemExit('PreviewWeightedPairCanvas diagnostic attribute target missing')
          canvas.write_text(text.replace(old, new, 1))

          capture = Path('scripts/video-playback-parity-capture.mjs')
          text = capture.read_text()
          old = "          weighted_surface_errors: weightedSurfaces\n            .map((surface) => surface.dataset.previewTransitionPairError || '')\n            .filter(Boolean),\n"
          new = old + "          weighted_surface_pending_reasons: weightedSurfaces\n            .map((surface) => surface.dataset.previewTransitionPairPendingReason || '')\n            .filter(Boolean),\n"
          if old not in text:
              raise SystemExit('playback capture surface diagnostic target missing')
          text = text.replace(old, new, 1)
          old_gate = "      if (row.weighted_surface_errors.length > 0) {\n        errors.push(`weighted Canvas errors: ${row.weighted_surface_errors.join(',')}`);\n        break;\n      }\n"
          new_gate = old_gate + "      if (row.weighted_surface_pending_reasons.length > 0) {\n        errors.push(`weighted Canvas pending: ${row.weighted_surface_pending_reasons.join(',')}`);\n        break;\n      }\n"
          if old_gate not in text:
              raise SystemExit('playback capture gate diagnostic target missing')
          capture.write_text(text.replace(old_gate, new_gate, 1))
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Validate focused playback and projection contracts
        working-directory: frontend
        run: |
          npm run lint
          npx vitest run \
            src/components/video/previewPlaybackCanonicalization.test.ts \
            src/components/video/previewWeightedPlaybackRuntime.test.ts \
            src/components/video/previewFramePerspectiveProjection.test.ts \
            src/components/video/previewFrameTransitionPairs.test.ts \
            src/components/video/previewFrameWeightedPairCanvas.test.ts \
            src/components/video/previewFrameWeightedPairRaster.test.ts \
            src/components/video/sourceTiming.test.ts
          npm run build
      - name: Validate retained capture syntax
        run: node --check scripts/video-playback-parity-capture.mjs
      - name: Commit stabilization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/video/VideoPreviewCanvasLegacy.tsx frontend/src/components/video/PreviewWeightedPairCanvas.tsx scripts/video-playback-parity-capture.mjs
          git diff --cached --check
          git commit -m "fix(video): preserve media decoder across canonical promotion"
          git push origin HEAD:feat/video-wysiwyg-phase3-weighted-playback
