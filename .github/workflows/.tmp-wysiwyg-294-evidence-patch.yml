name: Temporary WYSIWYG 294 Evidence Patch

on:
  push:
    branches:
      - fix/video-wysiwyg-phase3-pixelate-alpha-composition
    paths:
      - '.github/workflows/.tmp-wysiwyg-294-evidence-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/video-wysiwyg-phase3-pixelate-alpha-composition
          fetch-depth: 0
      - name: Apply retained evidence patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/.tmp_wysiwyg_294_evidence_patch.py
          rm scripts/.tmp_wysiwyg_294_evidence_patch.py
          node --check scripts/video-pixelate-parity-assert.mjs
          git diff --check -- . ':!docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md'
      - name: Commit evidence and tracker update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check -- . ':!docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md'
          git commit -m 'Record alpha composition evidence'
          git push origin HEAD:fix/video-wysiwyg-phase3-pixelate-alpha-composition
