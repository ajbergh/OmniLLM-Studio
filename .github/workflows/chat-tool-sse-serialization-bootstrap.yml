name: Chat tool SSE serialization bootstrap

on:
  push:
    branches:
      - fix/chat-tool-handler-parallel-callsite-20260802
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  patch-and-test:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' || github.event.pull_request.head.ref == 'fix/chat-tool-handler-parallel-callsite-20260802')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-tool-handler-parallel-callsite-20260802
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Serialize generic parallel lifecycle events
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/internal/api/message_handler.go')
          source = path.read_text(encoding='utf-8')
          old = '''\t\t\t\ttoolCtx = tools.ContextWithEventSink(toolCtx, func(event tools.ToolEvent) {
          \t\t\t\t\tsendToolEventSSE(w, flusher, event)
          \t\t\t\t})'''
          new = '''\t\t\t\ttoolCtx = tools.ContextWithEventSink(
          \t\t\t\t\ttoolCtx,
          \t\t\t\t\tserializedToolEventSink(w, flusher),
          \t\t\t\t)'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one generic event sink, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

          gofmt -w \
            backend/internal/api/message_handler.go \
            backend/internal/api/chat_tool_sse.go \
            backend/internal/api/chat_tool_sse_test.go

      - name: Run focused backend tests
        run: cd backend && go test ./internal/tools ./internal/api

      - name: Run full backend tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backend/cmd/desktop/frontend_dist
          printf '<!doctype html><title>test fixture</title>' > backend/cmd/desktop/frontend_dist/index.html
          cd backend
          go test ./...

      - name: Commit validated SSE serialization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/internal/api/message_handler.go \
            backend/internal/api/chat_tool_sse.go \
            backend/internal/api/chat_tool_sse_test.go
          git commit -m 'fix(chat): serialize parallel tool lifecycle SSE'
          git push origin HEAD:fix/chat-tool-handler-parallel-callsite-20260802
