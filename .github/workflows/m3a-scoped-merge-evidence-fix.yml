name: M3A scoped merge evidence fix once

on:
  push:
    branches:
      - feat/github-merge-eligibility-evidence-m3a-20260812
    paths:
      - scripts/m3a_scoped_merge_evidence_patch.py
      - .github/workflows/m3a-scoped-merge-evidence-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/github-merge-eligibility-evidence-m3a-20260812
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
      - name: Apply scoped credential fix
        run: python3 scripts/m3a_scoped_merge_evidence_patch.py
      - name: Format and remove temporary helpers
        run: |
          cd backend && gofmt -w internal/gitrepo/github_credentials.go internal/tools/registry_github_credentials.go && cd ..
          rm scripts/m3a_scoped_merge_evidence_patch.py .github/workflows/m3a-scoped-merge-evidence-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend scripts .github/workflows
          git commit -m "fix(github): scope M2 and M3A to invocation credential"
          git push
