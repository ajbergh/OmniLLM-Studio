name: Temporary WYSIWYG 294 Alpha Patch

on:
  push:
    branches:
      - fix/video-wysiwyg-phase3-pixelate-alpha-composition
    paths:
      - '.github/workflows/.tmp-wysiwyg-294-alpha-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/video-wysiwyg-phase3-pixelate-alpha-composition
          fetch-depth: 0
      - name: Apply exact alpha patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/.tmp_wysiwyg_294_alpha_patch.py
          rm scripts/.tmp_wysiwyg_294_alpha_patch.py
          node --check scripts/video-parity-capture.mjs
          git diff --check
          cd backend
          gofmt -w cmd/video-parity-fixture/main.go cmd/video-pixelate-parity-fixture/main.go internal/video/parity_fixture_pixelate.go internal/video/parity_fixture_pixelate_test.go
          go test ./internal/video/... ./cmd/video-parity-fixture ./cmd/video-pixelate-parity-fixture
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add transparent pixelate composition fixture'
          git push origin HEAD:fix/video-wysiwyg-phase3-pixelate-alpha-composition
