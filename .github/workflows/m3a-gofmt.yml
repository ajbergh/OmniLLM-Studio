name: M3A gofmt once

on:
  push:
    branches:
      - feat/github-merge-eligibility-evidence-m3a-20260812
    paths:
      - .github/workflows/m3a-gofmt.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/github-merge-eligibility-evidence-m3a-20260812
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
      - name: Format M3A reader and remove helper
        shell: bash
        run: |
          gofmt -w backend/internal/gitrepo/github_pull_request_merge_eligibility.go
          rm .github/workflows/m3a-gofmt.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/gitrepo/github_pull_request_merge_eligibility.go .github/workflows/m3a-gofmt.yml
          git commit -m "style(github): gofmt M3A merge eligibility" || exit 0
          git push origin HEAD:feat/github-merge-eligibility-evidence-m3a-20260812
