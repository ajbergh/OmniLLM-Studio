name: Temporary text readiness diagnostic patch

on:
  push:
    branches:
      - feat/video-wysiwyg-phase3-text-playback-readiness
    paths:
      - '.github/workflows/temporary-text-readiness-diagnostic-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/video-wysiwyg-phase3-text-playback-readiness
          fetch-depth: 0
      - name: Apply strict readiness diagnostics
        run: |
          python3 scripts/temporary-text-readiness-diagnostic-patch.py
          git diff --check
          node --check scripts/video-playback-parity-capture.mjs
      - name: Commit capture diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/video-playback-parity-capture.mjs
          git commit -m 'test(video): report text playback readiness timeout state'
          git push origin HEAD:feat/video-wysiwyg-phase3-text-playback-readiness
