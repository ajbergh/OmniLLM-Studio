name: Replay validated chat tool controls

on:
  push:
    branches:
      - feat/chat-turn-tool-controls-main-20260809

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Replay Phase 4 delta
        run: |
          git fetch origin feat/chat-unified-capability-gateway-20260809 feat/chat-turn-tool-controls-20260809
          git diff --binary origin/feat/chat-unified-capability-gateway-20260809..origin/feat/chat-turn-tool-controls-20260809 -- \
            backend/internal/api/chat_tool_runtime.go \
            backend/internal/api/chat_turn_tools.go \
            backend/internal/api/chat_turn_tools_test.go \
            backend/internal/api/chat_capability_policy_test.go \
            backend/internal/api/message_handler.go \
            frontend/src/components/ChatView.tsx \
            frontend/src/components/SettingsPanel.tsx \
            frontend/src/components/ToolPicker.tsx \
            frontend/src/stores/index.ts \
            frontend/src/types.ts > /tmp/phase4.patch
          git apply --index /tmp/phase4.patch
          gofmt -w backend/internal/api/chat_tool_runtime.go backend/internal/api/chat_turn_tools.go backend/internal/api/chat_turn_tools_test.go backend/internal/api/chat_capability_policy_test.go backend/internal/api/message_handler.go
          git add -A
      - name: Validate backend
        working-directory: backend
        run: |
          go test ./internal/api ./internal/tools
          go vet ./internal/api ./internal/tools
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test:unit
          npm run build
      - name: Commit clean Phase 4
        run: |
          rm .github/workflows/replay-chat-turn-tool-controls.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(chat): add per-turn tool controls and picker"
          git push origin HEAD
