name: Harden assistant profile resume scope

on:
  push:
    branches:
      - feat/assistant-profiles-skills-main-20260809

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - name: Persist assistant profile scope on agent runs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def rep(path, old, new, count=1):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n < count: raise SystemExit(f'{path}: expected {count} of {old!r}, found {n}')
              p.write_text(s.replace(old,new,count)); print(path, 'replaced', count, old[:70])

          rep('backend/internal/models/models.go',
              '\tResultSummary  string     `json:"result_summary"`\n',
              '\tResultSummary      string     `json:"result_summary"`\n\tAssistantProfileID string     `json:"assistant_profile_id,omitempty"`\n')
          rep('backend/internal/db/db.go',
              'CREATE INDEX IF NOT EXISTS idx_assistant_profiles_workspace ON assistant_profiles(workspace_id, name);\n',
              'CREATE INDEX IF NOT EXISTS idx_assistant_profiles_workspace ON assistant_profiles(workspace_id, name);\nALTER TABLE agent_runs ADD COLUMN assistant_profile_id TEXT NOT NULL DEFAULT \'\';\n')

          p=Path('backend/internal/repository/agent_run.go'); s=p.read_text()
          s=s.replace('func (r *AgentRunRepo) Create(conversationID, goal string) (*models.AgentRun, error) {', 'func (r *AgentRunRepo) Create(conversationID, goal string, assistantProfileIDs ...string) (*models.AgentRun, error) {',1)
          s=s.replace('\tid := uuid.New().String()\n\tnow := time.Now().UTC()\n', '\tid := uuid.New().String()\n\tnow := time.Now().UTC()\n\tassistantProfileID := ""\n\tif len(assistantProfileIDs) > 0 { assistantProfileID = assistantProfileIDs[0] }\n',1)
          s=s.replace('INSERT INTO agent_runs (id, conversation_id, status, goal, plan_json, result_summary, created_at, updated_at)\n\t\tVALUES (?, ?, \'planning\', ?, \'[]\', \'\', ?, ?)', 'INSERT INTO agent_runs (id, conversation_id, status, goal, plan_json, result_summary, assistant_profile_id, created_at, updated_at)\n\t\tVALUES (?, ?, \'planning\', ?, \'[]\', \'\', ?, ?, ?)',1)
          s=s.replace('`, id, conversationID, goal, now, now)', '`, id, conversationID, goal, assistantProfileID, now, now)',1)
          s=s.replace('SELECT id, conversation_id, status, goal, plan_json, result_summary, created_at, updated_at, completed_at', 'SELECT id, conversation_id, status, goal, plan_json, result_summary, assistant_profile_id, created_at, updated_at, completed_at')
          s=s.replace('&run.ResultSummary, &run.CreatedAt, &run.UpdatedAt, &run.CompletedAt,', '&run.ResultSummary, &run.AssistantProfileID, &run.CreatedAt, &run.UpdatedAt, &run.CompletedAt,')
          p.write_text(s)

          rep('backend/internal/agent/runner.go',
              'type RunOptions struct {\n\tProfile RunProfile\n\tBudgets *RunBudgets\n}',
              'type RunOptions struct {\n\tProfile            RunProfile\n\tBudgets            *RunBudgets\n\tAssistantProfileID string\n}')
          rep('backend/internal/agent/runner.go',
              '\trun, err := r.runRepo.Create(conversationID, goal)\n',
              '\trun, err := r.runRepo.Create(conversationID, goal, options.AssistantProfileID)\n')
          rep('backend/internal/api/agent_handler.go',
              'agent.RunOptions{Profile: req.Profile, Budgets: req.Budgets}',
              'agent.RunOptions{Profile: req.Profile, Budgets: req.Budgets, AssistantProfileID: req.AssistantProfileID}')

          # Reapply saved profile provider, instructions, skills, and tool scope on resume.
          marker='\tflusher, onEvent, ok := prepareAgentSSE(w)\n'
          resume_block='''\tif run.AssistantProfileID != "" && h.assistantRepo != nil {
\t\tuserID := auth.ScopeUserIDFromContext(r.Context())
\t\tsavedProfile, profileErr := h.assistantRepo.Get(userID, run.AssistantProfileID)
\t\tif profileErr != nil { respondInternalError(w, profileErr); return }
\t\tif savedProfile == nil { respondError(w, http.StatusConflict, "saved assistant profile is no longer available"); return }
\t\tif req.Provider == "" && savedProfile.Provider != "" { provider = savedProfile.Provider }
\t\tif req.Model == "" && savedProfile.Model != "" { model = savedProfile.Model }
\t\tif strings.TrimSpace(savedProfile.SystemPrompt) != "" {
\t\t\thistory = append([]llm.ChatMessage{{Role: "system", Content: "ASSISTANT PROFILE INSTRUCTIONS:\\n" + savedProfile.SystemPrompt}}, history...)
\t\t}
\t\tif h.skillRepo != nil {
\t\t\tfor _, skillID := range savedProfile.SkillIDs {
\t\t\t\tskill, skillErr := h.skillRepo.Get(userID, skillID)
\t\t\t\tif skillErr == nil && skill != nil && skill.Enabled {
\t\t\t\t\thistory = append([]llm.ChatMessage{{Role: "system", Content: "ATTACHED SKILL " + skill.Name + ":\\n" + skill.BodyMarkdown}}, history...)
\t\t\t\t}
\t\t\t}
\t\t}
\t\tr = r.WithContext(agent.ContextWithAllowedTools(r.Context(), savedProfile.ToolNames))
\t}
'''
          p=Path('backend/internal/api/agent_handler.go'); s=p.read_text()
          # target only ResumeRun's flusher by inserting after request-body handling and before the second prepareAgentSSE occurrence.
          first=s.find(marker); second=s.find(marker, first+1)
          if second < 0: raise SystemExit('second prepareAgentSSE marker not found')
          s=s[:second]+resume_block+s[second:]
          p.write_text(s)
          PY
          gofmt -w backend/internal/models/models.go backend/internal/repository/agent_run.go backend/internal/agent/runner.go backend/internal/api/agent_handler.go backend/internal/db/db.go
      - name: Validate resume persistence
        working-directory: backend
        run: |
          go test ./internal/repository ./internal/agent ./internal/api ./internal/db
          go vet ./internal/repository ./internal/agent ./internal/api ./internal/db
      - name: Commit hardening
        run: |
          rm .github/workflows/harden-assistant-profile-resume.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(agent): preserve assistant profile scope across resume"
          git push origin HEAD
