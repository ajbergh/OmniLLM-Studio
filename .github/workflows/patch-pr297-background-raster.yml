name: Patch project-background pixelate evidence

on:
  push:
    branches:
      - feat/video-wysiwyg-phase3-project-background-raster
    paths:
      - .github/workflows/patch-pr297-background-raster.yml

permissions:
  contents: write

env:
  GO_VERSION: '1.25.13'
  NODE_VERSION: '24'

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/video-wysiwyg-phase3-project-background-raster
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply guarded fixture and evidence patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def patch(path_s, replacements):
              path = Path(path_s)
              text = path.read_text()
              for label, old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path_s} {label}: expected one match, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text)

          patch('backend/internal/video/parity_fixture_pixelate.go', [
              ('fixture constant',
               '\tParityPixelateAlphaVideoFixtureName   = "parity-pixelate-alpha-video-v1"\n',
               '\tParityPixelateAlphaVideoFixtureName   = "parity-pixelate-alpha-video-v1"\n\tParityPixelateBackgroundFixtureName   = "parity-pixelate-background-v1"\n'),
              ('fixture function',
               'func ParityPixelateAlphaVideoFixture() (TimelineDocument, []ParityFixtureAsset) {\n\tdoc, assets := parityPixelateFixture(\n\t\tParityPixelateAlphaVideoFixtureName,\n',
               '// ParityPixelateBackgroundFixture proves that the canonical project canvas\n// itself is a deterministic pixelate raster source. There is intentionally no\n// lower visual clip: FFmpeg starts from the same opaque canvas color and the\n// browser Canvas samples that background directly before pixelation.\nfunc ParityPixelateBackgroundFixture() (TimelineDocument, []ParityFixtureAsset) {\n\tdoc, assets := parityPixelateFixture(\n\t\tParityPixelateBackgroundFixtureName,\n\t\tparityPixelateOpaqueCanvasWidth,\n\t\tparityPixelateOpaqueCanvasHeight,\n\t\t"#19324A",\n\t\t"asset-unused-background-source",\n\t\tParityFixtureAsset{ID: "asset-unused-background-source", Kind: "image", Width: 512, Height: 512, DurationMS: parityPixelateDurationMS, Description: "removed placeholder used only to share fixture construction"},\n\t\t"Removed background placeholder",\n\t)\n\t// parityPixelateFixture creates source, pixelate, and audio tracks in that\n\t// order. Remove the source track and its asset so the retained fixture has\n\t// exactly one visual layer: the pixelate region over project background.\n\tdoc.Tracks = doc.Tracks[1:]\n\tassets = assets[1:]\n\treturn doc, assets\n}\n\nfunc ParityPixelateAlphaVideoFixture() (TimelineDocument, []ParityFixtureAsset) {\n\tdoc, assets := parityPixelateFixture(\n\t\tParityPixelateAlphaVideoFixtureName,\n'),
              ('sample function',
               '// ParityPixelateAlphaVideoFrameSamples uses the same canonical output-frame\n// identities while requiring the changing transparent decoder to present each\n// requested source frame.\nfunc ParityPixelateAlphaVideoFrameSamples() []ParityFrameSample {\n\treturn parityPixelateFrameSamples("pixelate-alpha-video")\n}\n',
               '// ParityPixelateAlphaVideoFrameSamples uses the same canonical output-frame\n// identities while requiring the changing transparent decoder to present each\n// requested source frame.\nfunc ParityPixelateAlphaVideoFrameSamples() []ParityFrameSample {\n\treturn parityPixelateFrameSamples("pixelate-alpha-video")\n}\n\n// ParityPixelateBackgroundFrameSamples retains the same structural frame\n// identities while changing the backdrop source class to project background.\nfunc ParityPixelateBackgroundFrameSamples() []ParityFrameSample {\n\treturn parityPixelateFrameSamples("pixelate-background")\n}\n'),
              ('bounds function',
               '// ParityPixelateAlphaVideoRegionBounds shares the transparent-PNG rectangle so\n// the retained video evidence changes only source codec/presentation semantics.\nfunc ParityPixelateAlphaVideoRegionBounds() ParityBounds {\n\treturn parityPixelateRegionBounds(parityPixelateOpaqueCanvasWidth, parityPixelateOpaqueCanvasHeight)\n}\n',
               '// ParityPixelateAlphaVideoRegionBounds shares the transparent-PNG rectangle so\n// the retained video evidence changes only source codec/presentation semantics.\nfunc ParityPixelateAlphaVideoRegionBounds() ParityBounds {\n\treturn parityPixelateRegionBounds(parityPixelateOpaqueCanvasWidth, parityPixelateOpaqueCanvasHeight)\n}\n\n// ParityPixelateBackgroundRegionBounds uses the same non-divisible rectangle\n// so evidence changes only the raster source class.\nfunc ParityPixelateBackgroundRegionBounds() ParityBounds {\n\treturn parityPixelateRegionBounds(parityPixelateOpaqueCanvasWidth, parityPixelateOpaqueCanvasHeight)\n}\n'),
              ('regions function',
               '// ParityPixelateAlphaVideoRegionFrames binds changing transparent-video output\n// to exact canonical frame identities and the established pixelate rectangle.\nfunc ParityPixelateAlphaVideoRegionFrames(samples []ParityFrameSample) []ParityFixtureRegionFrame {\n\treturn parityPixelateRegionFrames(samples, ParityPixelateAlphaVideoRegionBounds())\n}\n',
               '// ParityPixelateAlphaVideoRegionFrames binds changing transparent-video output\n// to exact canonical frame identities and the established pixelate rectangle.\nfunc ParityPixelateAlphaVideoRegionFrames(samples []ParityFrameSample) []ParityFixtureRegionFrame {\n\treturn parityPixelateRegionFrames(samples, ParityPixelateAlphaVideoRegionBounds())\n}\n\n// ParityPixelateBackgroundRegionFrames binds background-only raster evidence to\n// exact canonical frame identities and the established pixelate rectangle.\nfunc ParityPixelateBackgroundRegionFrames(samples []ParityFrameSample) []ParityFixtureRegionFrame {\n\treturn parityPixelateRegionFrames(samples, ParityPixelateBackgroundRegionBounds())\n}\n'),
          ])

          patch('backend/cmd/video-pixelate-parity-fixture/main.go', [
              ('variant help',
               '\tvariant := flag.String("variant", "opaque-png", "fixture variant: opaque-png, decoded-video, alpha-png, or alpha-video")\n',
               '\tvariant := flag.String("variant", "opaque-png", "fixture variant: opaque-png, decoded-video, alpha-png, alpha-video, or background")\n'),
              ('switch variant',
               '\tcase "alpha-video":\n\t\tname = video.ParityPixelateAlphaVideoFixtureName\n\t\tdoc, assets = video.ParityPixelateAlphaVideoFixture()\n\t\tsamples = video.ParityPixelateAlphaVideoFrameSamples()\n\t\tframes = video.ParityPixelateAlphaVideoRegionFrames(samples)\n\tdefault:\n\t\texitf("unknown --variant %q (want opaque-png, decoded-video, alpha-png, or alpha-video)", *variant)\n',
               '\tcase "alpha-video":\n\t\tname = video.ParityPixelateAlphaVideoFixtureName\n\t\tdoc, assets = video.ParityPixelateAlphaVideoFixture()\n\t\tsamples = video.ParityPixelateAlphaVideoFrameSamples()\n\t\tframes = video.ParityPixelateAlphaVideoRegionFrames(samples)\n\tcase "background":\n\t\tname = video.ParityPixelateBackgroundFixtureName\n\t\tdoc, assets = video.ParityPixelateBackgroundFixture()\n\t\tsamples = video.ParityPixelateBackgroundFrameSamples()\n\t\tframes = video.ParityPixelateBackgroundRegionFrames(samples)\n\tdefault:\n\t\texitf("unknown --variant %q (want opaque-png, decoded-video, alpha-png, alpha-video, or background)", *variant)\n'),
          ])

          patch('backend/internal/video/parity_fixture_pixelate_test.go', [
              ('background fixture test',
               'func TestParityPixelateAlphaVideoFixtureIsValidAndUsesChangingVideoSource(t *testing.T) {\n',
               'func TestParityPixelateBackgroundFixtureIsValidAndHasNoLowerVisualSource(t *testing.T) {\n\tdoc, assets := ParityPixelateBackgroundFixture()\n\tvalidated, err := ValidateTimelineDocument(doc)\n\tif err != nil {\n\t\tt.Fatalf("ValidateTimelineDocument() error = %v", err)\n\t}\n\tif validated.Canvas.Width != 512 || validated.Canvas.Height != 512 || validated.Canvas.FPS != 30 {\n\t\tt.Fatalf("canvas = %dx%d@%d, want 512x512@30", validated.Canvas.Width, validated.Canvas.Height, validated.Canvas.FPS)\n\t}\n\tif validated.Canvas.Background != "#19324A" {\n\t\tt.Fatalf("background = %q, want #19324A", validated.Canvas.Background)\n\t}\n\tif len(assets) != 1 || assets[0].ID != "asset-audio" {\n\t\tt.Fatalf("assets = %#v, want audio harness only", assets)\n\t}\n\tvisualClips := 0\n\tpixelateClips := 0\n\tfor _, track := range validated.Tracks {\n\t\tif !track.Visible || track.Type == TrackTypeAudio {\n\t\t\tcontinue\n\t\t}\n\t\tfor _, clip := range track.Clips {\n\t\t\tvisualClips++\n\t\t\tif clip.Shape != nil && clip.Shape.Kind == ShapeKindPixelate {\n\t\t\t\tpixelateClips++\n\t\t\t}\n\t\t}\n\t}\n\tif visualClips != 1 || pixelateClips != 1 {\n\t\tt.Fatalf("visual clips = %d pixelate clips = %d, want pixelate-only visual fixture", visualClips, pixelateClips)\n\t}\n}\n\nfunc TestParityPixelateAlphaVideoFixtureIsValidAndUsesChangingVideoSource(t *testing.T) {\n'),
              ('background samples',
               'func TestParityPixelateAlphaVideoSamplesAndRegionsStayFrameBound(t *testing.T) {\n',
               'func TestParityPixelateBackgroundSamplesAndRegionsStayFrameBound(t *testing.T) {\n\tsamples := ParityPixelateBackgroundFrameSamples()\n\twantFrames := []int64{0, 15, 30, 59}\n\tassertPixelateFrames(t, samples, wantFrames)\n\n\tbounds := ParityPixelateBackgroundRegionBounds()\n\twantBounds := (ParityBounds{MinX: 71, MinY: 94, MaxX: 474, MaxY: 401})\n\tif bounds != wantBounds {\n\t\tt.Fatalf("bounds = %#v, want %#v", bounds, wantBounds)\n\t}\n\tassertPixelateRegionFrames(t, samples, bounds, ParityPixelateBackgroundRegionFrames(samples))\n}\n\nfunc TestParityPixelateAlphaVideoSamplesAndRegionsStayFrameBound(t *testing.T) {\n'),
          ])

          patch('scripts/video-pixelate-parity-assert.mjs', [
              ('backdrop evidence',
               "      surface_background: surface?.getAttribute('data-preview-pixelate-background') ?? null,\n",
               "      surface_background: surface?.getAttribute('data-preview-pixelate-background') ?? null,\n      surface_backdrop_clip: surface?.getAttribute('data-preview-pixelate-backdrop-clip') ?? null,\n"),
          ])
          PY
          gofmt -w backend/internal/video/parity_fixture_pixelate.go \
            backend/internal/video/parity_fixture_pixelate_test.go \
            backend/cmd/video-pixelate-parity-fixture/main.go
          cd backend
          go test ./internal/video -run 'TestParityPixelate(Background|Opaque|Decoded|Alpha)'
          go run ./cmd/video-pixelate-parity-fixture --output-dir ../output/background-fixture-check --variant background
          cd ../frontend
          npm ci
          npx vitest run src/components/video/previewPixelateBackdrop.test.ts
          node --check ../scripts/video-pixelate-parity-assert.mjs
      - name: Commit evidence plumbing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/video/parity_fixture_pixelate.go \
            backend/internal/video/parity_fixture_pixelate_test.go \
            backend/cmd/video-pixelate-parity-fixture/main.go \
            scripts/video-pixelate-parity-assert.mjs
          git diff --cached --check
          git commit -m "test(video): add background pixelate parity fixture"
          git push origin HEAD:feat/video-wysiwyg-phase3-project-background-raster
