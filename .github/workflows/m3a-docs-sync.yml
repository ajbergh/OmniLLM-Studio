name: M3A docs sync once

on:
  push:
    branches:
      - feat/github-merge-eligibility-evidence-m3a-20260812
    paths:
      - scripts/m3a_docs_patch.py
      - .github/workflows/m3a-docs-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/github-merge-eligibility-evidence-m3a-20260812
      - name: Apply M3A documentation sync
        run: python3 scripts/m3a_docs_patch.py
      - name: Remove temporary helpers and commit
        run: |
          rm scripts/m3a_docs_patch.py .github/workflows/m3a-docs-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts .github/workflows
          git commit -m "docs(github): record M3A merge eligibility evidence"
          git push
