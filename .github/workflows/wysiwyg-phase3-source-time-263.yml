name: Apply WYSIWYG Phase 3 source time 263

on:
  push:
    branches:
      - feat/video-wysiwyg-phase3-canonical-source-time
    paths:
      - scripts/apply-wysiwyg-phase3-source-time-263.py
      - .github/workflows/wysiwyg-phase3-source-time-263.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/video-wysiwyg-phase3-canonical-source-time
          fetch-depth: 0
      - name: Apply fail-closed source-time consumer patch
        run: python3 scripts/apply-wysiwyg-phase3-source-time-263.py
      - name: Validate patch shape
        run: |
          git diff --check
          git diff -- frontend/src/components/video/VideoPreviewCanvas.tsx docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md
      - name: Commit production changes and remove temporary patch scaffolding
        run: |
          rm -f .github/workflows/wysiwyg-phase3-source-time-263.yml scripts/apply-wysiwyg-phase3-source-time-263.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(video): consume canonical preview source time"
          git push origin HEAD:feat/video-wysiwyg-phase3-canonical-source-time
