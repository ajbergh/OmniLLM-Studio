name: Validate MCP OAuth Phase B1

on:
  push:
    branches:
      - feat/mcp-oauth-phase-b1-spec-compliance-20260809

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply Phase B1 integration
        run: python3 .github/scripts/apply_mcp_oauth_b1.py
      - name: Format and validate backend
        working-directory: backend
        run: |
          gofmt -w \
            internal/db/db.go \
            internal/db/agent_runtime_migration_test.go \
            internal/db/mcp_oauth_registration_migration_test.go \
            internal/models/mcp_oauth.go \
            internal/repository/mcp_oauth.go \
            internal/repository/mcp_oauth_test.go \
            internal/mcpclient/oauth.go \
            internal/mcpclient/oauth_test.go \
            internal/api/mcp_oauth_handler.go
          mkdir -p cmd/desktop/frontend_dist
          test -f cmd/desktop/frontend_dist/index.html || printf '<!doctype html><html><body>test</body></html>' > cmd/desktop/frontend_dist/index.html
          go test ./internal/repository ./internal/mcpclient ./internal/api ./internal/db ./internal/config ./cmd/desktop
          go vet ./internal/repository ./internal/mcpclient ./internal/api ./internal/db ./internal/config ./cmd/desktop
          rm -f cmd/desktop/frontend_dist/index.html
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test:unit
          npm run build
      - name: Commit validated Phase B1
        run: |
          rm .github/workflows/validate-mcp-oauth-b1.yml
          rm .github/scripts/apply_mcp_oauth_b1.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(mcp): align OAuth registration with 2026 spec"
          git push origin HEAD
