name: Integrate Rounded Rectangle Playback

on:
  push:
    branches:
      - feat/video-wysiwyg-phase3-rounded-rectangle-playback-parity

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply guarded playback integration
        run: |
          set -euo pipefail
          python scripts/tmp-integrate-rounded-rectangle-playback.py
          git diff --check
      - name: Validate focused playback contracts
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npx vitest run \
            src/components/video/previewShapePlayback.test.ts \
            src/components/video/previewPlaybackCanonicalization.test.ts \
            src/components/video/PreviewCanonicalPainters.test.ts \
            src/components/video/previewCursorPlayback.test.ts \
            test/renderContractFrameStateShape.test.ts
          npm run build
      - name: Commit validated playback integration
        run: |
          set -euo pipefail
          git rm scripts/tmp-integrate-rounded-rectangle-playback.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate rounded rectangle normal playback'
          git push origin HEAD:feat/video-wysiwyg-phase3-rounded-rectangle-playback-parity
