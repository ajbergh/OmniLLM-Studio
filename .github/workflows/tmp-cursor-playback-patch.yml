name: Cursor Playback Branch Patch

on:
  push:
    branches:
      - feat/video-wysiwyg-phase3-cursor-playback-parity

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply exact cursor playback integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/components/video/VideoPreviewCanvasLegacy.tsx')
          text = path.read_text()

          replacements = [
              (
                  '''    playbackFrameVisualCandidates,\n    playbackTransitionPlan,\n  );''',
                  '''    playbackFrameVisualCandidates,\n    playbackTransitionPlan,\n    {\n      fps,\n      canvasWidth,\n      canvasHeight,\n      scenes: timeline?.scenes ?? [],\n    },\n  );''',
                  'playback context',
              ),
              (
                  'const sample = sampleCursor(clip.cursor, clipTimeMs);',
                  'const canonicalCursor = canonicalVisualFrame !== null ? entry.canonicalState?.cursor : undefined;\n          const sample = canonicalCursor ?? sampleCursor(clip.cursor, clipTimeMs);',
                  'canonical cursor sample',
              ),
              (
                  'const size = 16 * (clip.cursor.scale || 1) * stageScale * 4;',
                  'const size = 16 * (canonicalCursor?.scale ?? clip.cursor.scale ?? 1) * stageScale * 4;',
                  'canonical cursor scale',
              ),
              (
                  'const top = sample.y * stageScale;\n          return (',
                  'const top = sample.y * stageScale;\n          const highlight = canonicalCursor?.highlight ?? clip.cursor.highlight ?? false;\n          const clickRings = canonicalCursor?.click_rings ?? clip.cursor.click_rings ?? false;\n          return (',
                  'canonical cursor flags',
              ),
              (
                  '<div className="pointer-events-none absolute" style={{ left, top }} aria-hidden="true">',
                  '''<div\n              className="pointer-events-none absolute"\n              data-preview-cursor-state-mode={canonicalCursor ? 'canonical-frame' : 'legacy-time'}\n              data-preview-cursor-playback-consumer={isPlaying ? (canonicalCursor ? 'canonical-inline' : 'legacy-time-fallback') : undefined}\n              data-preview-cursor-playback-clip-id={clip.id}\n              style={{ left, top }}\n              aria-hidden="true"\n            >''',
                  'cursor playback evidence attributes',
              ),
              ('{clip.cursor.highlight && (', '{highlight && (', 'canonical highlight'),
              ('{sample.click && clip.cursor.click_rings && (', '{sample.click && clickRings && (', 'canonical click rings'),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor count={count}, want 1')
              text = text.replace(old, new)

          path.write_text(text)
          PY
      - name: Validate focused frontend contracts
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test:unit -- src/components/video/previewCursorPlayback.test.ts src/components/video/previewPlaybackCursorCanonicalization.test.ts src/components/video/previewPlaybackCanonicalization.test.ts
          npm run build
      - name: Commit surgical integration and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-cursor-playback-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/video/VideoPreviewCanvasLegacy.tsx .github/workflows/tmp-cursor-playback-patch.yml
          git diff --cached --check
          git commit -m "Wire canonical cursor normal playback"
          git push origin HEAD:feat/video-wysiwyg-phase3-cursor-playback-parity
