name: Temporary Alpha Video Fixture Patch

on:
  push:
    branches:
      - fix/video-wysiwyg-phase3-transparent-video-presentation
    paths:
      - '.github/workflows/tmp-alpha-video-fixture-patch.yml'

permissions:
  contents: write

env:
  GO_VERSION: '1.25.13'
  NODE_VERSION: '24'

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/video-wysiwyg-phase3-transparent-video-presentation
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install FFmpeg
        run: bash scripts/ci-apt-install.sh ffmpeg
      - name: Apply guarded fixture patch
        run: python3 scripts/.tmp-alpha-video-fixture-patch.py
      - name: Format backend
        run: |
          gofmt -w \
            backend/internal/video/parity_fixture_pixelate.go \
            backend/internal/video/parity_fixture_pixelate_test.go \
            backend/cmd/video-pixelate-parity-fixture/main.go \
            backend/cmd/video-parity-fixture/main.go
      - name: Backend fixture tests
        working-directory: backend
        run: go test ./internal/video ./cmd/video-pixelate-parity-fixture ./cmd/video-parity-fixture
      - name: Generate and probe transparent VP9 source
        run: |
          set -euo pipefail
          (
            cd backend
            go run ./cmd/video-parity-fixture \
              --output-dir ../output/tmp-alpha-video-fixture \
              --random-samples 0 \
              --generate-media
            go run ./cmd/video-pixelate-parity-fixture \
              --output-dir ../output/tmp-alpha-video-fixture \
              --variant alpha-video
          )
          media=output/tmp-alpha-video-fixture/media/asset-alpha-video.webm
          ffprobe -v error -print_format json -show_streams "$media" > output/tmp-alpha-video-fixture/alpha-video-probe.json
          node - <<'NODE'
          const fs = require('fs');
          const probe = JSON.parse(fs.readFileSync('output/tmp-alpha-video-fixture/alpha-video-probe.json', 'utf8'));
          const stream = probe.streams?.find((entry) => entry.codec_type === 'video');
          if (!stream) throw new Error('transparent fixture has no video stream');
          if (stream.codec_name !== 'vp9') throw new Error(`transparent fixture codec ${stream.codec_name}, want vp9`);
          const alphaMode = stream.tags?.alpha_mode ?? stream.tags?.ALPHA_MODE;
          if (String(alphaMode) !== '1') throw new Error(`transparent fixture alpha_mode ${alphaMode}, want 1`);
          console.log(JSON.stringify({ codec: stream.codec_name, pix_fmt: stream.pix_fmt, alpha_mode: alphaMode }));
          NODE
          ffmpeg -hide_banner -loglevel error -y -ss 1.0 -i "$media" -frames:v 1 -f rawvideo -pix_fmt rgba output/tmp-alpha-video-fixture/native.rgba
          ffmpeg -hide_banner -loglevel error -y -c:v libvpx-vp9 -ss 1.0 -i "$media" -frames:v 1 -f rawvideo -pix_fmt rgba output/tmp-alpha-video-fixture/libvpx.rgba
          node - <<'NODE'
          const fs = require('fs');
          const analyze = (path) => {
            const bytes = fs.readFileSync(path);
            let min = 255, max = 0, partial = 0, transparent = 0, opaque = 0;
            for (let offset = 3; offset < bytes.length; offset += 4) {
              const alpha = bytes[offset];
              min = Math.min(min, alpha); max = Math.max(max, alpha);
              if (alpha === 0) transparent += 1;
              else if (alpha === 255) opaque += 1;
              else partial += 1;
            }
            return { min, max, transparent, partial, opaque };
          };
          const native = analyze('output/tmp-alpha-video-fixture/native.rgba');
          const libvpx = analyze('output/tmp-alpha-video-fixture/libvpx.rgba');
          console.log(JSON.stringify({ native, libvpx }));
          if (native.min !== 255 || native.max !== 255) throw new Error('native VP9 control unexpectedly preserved alpha; fixture no longer isolates decoder selection');
          if (libvpx.transparent === 0 || libvpx.partial === 0) throw new Error('libvpx-vp9 did not preserve transparent and partial-alpha pixels');
          NODE
      - name: Validate browser harness syntax
        run: |
          node --check scripts/video-parity-capture.mjs
          node --check scripts/video-pixelate-parity-assert.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Commit validated fixture patch and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/.tmp-alpha-video-fixture-patch.py .github/workflows/tmp-alpha-video-fixture-patch.yml
          git add \
            backend/internal/video/parity_fixture_pixelate.go \
            backend/internal/video/parity_fixture_pixelate_test.go \
            backend/cmd/video-pixelate-parity-fixture/main.go \
            backend/cmd/video-parity-fixture/main.go \
            scripts/video-parity-capture.mjs \
            scripts/video-pixelate-parity-assert.mjs
          git commit -m 'Add transparent VP9 pixelate parity fixture'
          git push origin HEAD:fix/video-wysiwyg-phase3-transparent-video-presentation
