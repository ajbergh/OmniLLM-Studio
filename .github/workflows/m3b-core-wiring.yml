name: M3B core wiring once

on:
  push:
    branches:
      - feat/github-guarded-direct-merge-m3b-20260812
    paths:
      - scripts/m3b_core_patch.py
      - .github/workflows/m3b-core-wiring.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/github-guarded-direct-merge-m3b-20260812
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
      - name: Apply M3B core wiring
        run: python3 scripts/m3b_core_patch.py
      - name: Format and remove temporary helpers
        run: |
          cd backend
          gofmt -w internal/gitrepo/remote_config.go internal/gitrepo/remote.go internal/gitrepo/github_pull_request_merge_eligibility.go internal/gitrepo/github_pull_request_read.go internal/gitrepo/github_credentials.go internal/gitrepo/github_pull_request_merge.go
          cd ..
          rm scripts/m3b_core_patch.py .github/workflows/m3b-core-wiring.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend scripts .github/workflows
          git commit -m "feat(github): wire independent M3B merge gates"
          git push
