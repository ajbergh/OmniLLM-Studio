name: Replay MCP 2026 dual-era HTTP transport

on:
  push:
    branches:
      - agent/mcp-2026-dual-era-http-main-20260810

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum

      - name: Replay validated transport files
        shell: bash
        run: |
          git fetch origin agent/mcp-2026-dual-era-http-20260810
          git checkout origin/agent/mcp-2026-dual-era-http-20260810 -- \
            backend/internal/mcpclient/http_client.go \
            backend/internal/mcpclient/http_modern.go \
            backend/internal/mcpclient/http_modern_test.go \
            backend/internal/mcpclient/protocol.go \
            docs/MCP_HOW_TO_FAQ.md
          gofmt -w \
            backend/internal/mcpclient/http_client.go \
            backend/internal/mcpclient/http_modern.go \
            backend/internal/mcpclient/http_modern_test.go \
            backend/internal/mcpclient/protocol.go

      - name: Validate clean replay
        working-directory: backend
        run: |
          go test ./internal/mcpclient ./internal/repository ./internal/api ./internal/db
          go vet ./internal/mcpclient ./internal/repository ./internal/api ./internal/db

      - name: Commit clean replay
        shell: bash
        run: |
          rm .github/workflows/replay-mcp-2026-dual-era-http.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(mcp): add 2026 dual-era HTTP transport"
          git push origin HEAD
