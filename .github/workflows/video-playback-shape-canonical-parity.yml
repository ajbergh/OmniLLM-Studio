name: Video Playback Shape Canonical Parity Evidence

on:
  pull_request:
    paths:
      - '.github/workflows/video-playback-shape-canonical-parity.yml'
      - 'backend/cmd/video-playback-parity-fixture-v7/**'
      - 'backend/cmd/video-parity-fixture/**'
      - 'backend/internal/video/parity_fixture_playback.go'
      - 'backend/internal/video/parity_fixture_playback_v7.go'
      - 'backend/internal/video/parity_fixture_playback_test.go'
      - 'backend/internal/video/parity_fixture_playback_v7_test.go'
      - 'frontend/src/components/video/VideoPreviewCanvas.tsx'
      - 'frontend/src/components/video/VideoPreviewCanvasLegacy.tsx'
      - 'frontend/src/components/video/PreviewCanonicalPainters.tsx'
      - 'frontend/src/components/video/ShapePreview.tsx'
      - 'frontend/src/components/video/previewPlaybackCanonicalization.ts'
      - 'frontend/src/components/video/previewPlaybackCanonicalization.test.ts'
      - 'frontend/src/components/video/previewPlaybackShapeCanonicalization.test.ts'
      - 'frontend/src/components/video/previewShapePlayback.ts'
      - 'frontend/src/components/video/previewShapePlayback.test.ts'
      - 'frontend/src/components/video/previewCursorPlayback.ts'
      - 'frontend/src/components/video/previewTextPlaybackRuntime.ts'
      - 'frontend/src/components/video/previewWeightedPlaybackRuntime.ts'
      - 'frontend/src/components/video/previewFrameTransitionPairs.ts'
      - 'frontend/src/components/video/sourceTiming.ts'
      - 'scripts/video-playback-parity-capture.mjs'
      - 'scripts/video-playback-shape-parity-capture.mjs'
      - 'docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/video-playback-shape-canonical-parity.yml'
      - 'backend/cmd/video-playback-parity-fixture-v7/**'
      - 'backend/cmd/video-parity-fixture/**'
      - 'backend/internal/video/parity_fixture_playback.go'
      - 'backend/internal/video/parity_fixture_playback_v7.go'
      - 'backend/internal/video/parity_fixture_playback_test.go'
      - 'backend/internal/video/parity_fixture_playback_v7_test.go'
      - 'frontend/src/components/video/VideoPreviewCanvas.tsx'
      - 'frontend/src/components/video/VideoPreviewCanvasLegacy.tsx'
      - 'frontend/src/components/video/PreviewCanonicalPainters.tsx'
      - 'frontend/src/components/video/ShapePreview.tsx'
      - 'frontend/src/components/video/previewPlaybackCanonicalization.ts'
      - 'frontend/src/components/video/previewPlaybackCanonicalization.test.ts'
      - 'frontend/src/components/video/previewPlaybackShapeCanonicalization.test.ts'
      - 'frontend/src/components/video/previewShapePlayback.ts'
      - 'frontend/src/components/video/previewShapePlayback.test.ts'
      - 'frontend/src/components/video/previewCursorPlayback.ts'
      - 'frontend/src/components/video/previewTextPlaybackRuntime.ts'
      - 'frontend/src/components/video/previewWeightedPlaybackRuntime.ts'
      - 'frontend/src/components/video/previewFrameTransitionPairs.ts'
      - 'frontend/src/components/video/sourceTiming.ts'
      - 'scripts/video-playback-parity-capture.mjs'
      - 'scripts/video-playback-shape-parity-capture.mjs'
      - 'docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-playback-shape-canonical-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.13'
  NODE_VERSION: '24'

jobs:
  shape-playback-evidence:
    name: Rounded rectangle playback consumer evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - working-directory: frontend
        run: npm ci
      - name: Install shape playback evidence dependencies
        run: |
          bash scripts/ci-apt-install.sh ffmpeg fonts-dejavu-core
          bash scripts/ci-playwright-install.sh
          command -v ffmpeg
          command -v ffprobe
      - name: Validate v7 fixture and shape playback gates
        run: |
          set -euo pipefail
          (
            cd backend
            go test ./internal/video -run 'TestPlaybackCanonicalParityFixture(V7)?Valid'
          )
          (
            cd frontend
            npx vitest run \
              src/components/video/previewPlaybackCanonicalization.test.ts \
              src/components/video/previewPlaybackShapeCanonicalization.test.ts \
              src/components/video/previewShapePlayback.test.ts \
              src/components/video/previewCursorPlayback.test.ts \
              src/components/video/previewTextPlaybackRuntime.test.ts \
              src/components/video/previewWeightedPlaybackRuntime.test.ts \
              src/components/video/previewFrameTransitionPairs.test.ts \
              src/components/video/sourceTiming.test.ts
          )
          node --check scripts/video-playback-parity-capture.mjs
          node --check scripts/video-playback-shape-parity-capture.mjs
      - name: Generate v7 fixture and deterministic media
        run: |
          set -euo pipefail
          mkdir -p output/video-playback-shape-canonical/bin
          (
            cd backend
            go run ./cmd/video-parity-fixture \
              --output-dir ../output/video-playback-shape-canonical/fixture \
              --random-samples 0 \
              --generate-media
            go run ./cmd/video-playback-parity-fixture-v7 \
              --output-dir ../output/video-playback-shape-canonical/fixture
            go build -o ../output/video-playback-shape-canonical/bin/server ./cmd/server
          )
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf \
            output/video-playback-shape-canonical/fixture/media/asset-font.ttf
          dd if=/dev/zero \
            of=output/video-playback-shape-canonical/fixture/media/asset-font-invalid.ttf \
            bs=1024 count=1 status=none
      - name: Capture and gate live v7 playback evidence
        shell: bash
        run: |
          set -euo pipefail
          runtime="$GITHUB_WORKSPACE/output/video-playback-shape-canonical/runtime"
          capture="$GITHUB_WORKSPACE/output/video-playback-shape-canonical/capture"
          fixture="$GITHUB_WORKSPACE/output/video-playback-shape-canonical/fixture/parity-playback-canonical-v7.json"
          mkdir -p "$runtime/attachments" "$capture"
          export OMNILLM_PORT=18097
          export OMNILLM_DB_PATH="$runtime/parity.db"
          export OMNILLM_ATTACHMENTS_DIR="$runtime/attachments"
          "$GITHUB_WORKSPACE/output/video-playback-shape-canonical/bin/server" >"$runtime/backend.log" 2>"$runtime/backend.err.log" &
          backend_pid=$!
          (
            cd frontend
            OMNILLM_API_PROXY_TARGET=http://127.0.0.1:18097 npm run dev -- --host 127.0.0.1 --port 14180 >"$runtime/frontend.log" 2>"$runtime/frontend.err.log"
          ) &
          frontend_pid=$!
          cleanup() {
            kill "$frontend_pid" "$backend_pid" 2>/dev/null || true
            wait "$frontend_pid" "$backend_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18097/v1/health >/dev/null && curl --fail --silent http://127.0.0.1:14180/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "shape playback parity servers did not become ready" >&2
              cat "$runtime/backend.err.log" >&2 || true
              cat "$runtime/backend.log" >&2 || true
              exit 1
            fi
            sleep 1
          done

          count_only_failure() {
            local evidence_file="$1"
            node - "$evidence_file" <<'NODE'
          const fs = require('node:fs');
          const evidencePath = process.argv[2];
          if (!evidencePath || !fs.existsSync(evidencePath)) process.exit(1);
          const evidence = JSON.parse(fs.readFileSync(evidencePath, 'utf8'));
          if (!Array.isArray(evidence.cases) || evidence.cases.length === 0) process.exit(1);
          const countOnly = evidence.cases.every((testCase) => {
            if (testCase.pass === true) return true;
            return Array.isArray(testCase.errors)
              && testCase.errors.length > 0
              && testCase.errors.every((error) => /^captured \d+ observations, want at least 5$/.test(error));
          });
          process.exit(countOnly ? 0 : 1);
          NODE
          }

          retryable_generic_scheduler_failure() {
            local evidence_file="$1"
            local fixture_file="$2"
            node - "$evidence_file" "$fixture_file" <<'NODE'
          const fs = require('node:fs');
          const evidencePath = process.argv[2];
          const fixturePath = process.argv[3];
          if (!evidencePath || !fixturePath || !fs.existsSync(evidencePath) || !fs.existsSync(fixturePath)) process.exit(1);
          const evidence = JSON.parse(fs.readFileSync(evidencePath, 'utf8'));
          const fixture = JSON.parse(fs.readFileSync(fixturePath, 'utf8'));
          if (!Array.isArray(evidence.cases) || !Array.isArray(fixture.cases)) process.exit(1);
          const failed = evidence.cases.filter((testCase) => testCase.pass !== true);
          if (failed.length === 0) process.exit(1);

          const authoredCases = new Map(fixture.cases.map((testCase) => [testCase.name, testCase]));
          const clips = new Map();
          for (const track of fixture.timeline?.tracks || []) {
            for (const clip of track.clips || []) clips.set(clip.id, clip);
          }

          const countOnly = (testCase) => Array.isArray(testCase.errors)
            && testCase.errors.length > 0
            && testCase.errors.every((error) => /^captured \d+ observations, want at least 5$/.test(error));

          const boundaryOnly = (testCase) => {
            const authored = authoredCases.get(testCase.name);
            if (!authored || !Array.isArray(testCase.errors) || testCase.errors.length === 0) return false;
            const participantIDs = [authored.expected_text_clip_id, authored.expected_cursor_clip_id].filter(Boolean);
            if (participantIDs.length === 0) return false;
            const ends = participantIDs.map((clipID) => clips.get(clipID))
              .filter(Boolean)
              .map((clip) => Number(clip.start_ms) + Number(clip.duration_ms))
              .filter(Number.isFinite);
            if (ends.length === 0) return false;
            const boundary = Math.min(...ends);
            const observations = Array.isArray(testCase.observations) ? testCase.observations : [];
            const before = observations.filter((row) => Number.isFinite(row.timeline_ms) && row.timeline_ms < boundary);
            const crossed = observations.some((row) => Number.isFinite(row.timeline_ms) && row.timeline_ms >= boundary);
            if (!crossed || before.length < 4) return false;

            const allowedErrors = [
              /^transition mode canonical-none, want canonical-weighted-deferred$/,
              /^cursor surface observed \d+\/\d+ frames$/,
            ];
            if (!testCase.errors.every((error) => allowedErrors.some((pattern) => pattern.test(error)))) return false;

            return before.every((row) => {
              if (authored.expected_mode && row.visual_frame_mode !== authored.expected_mode) return false;
              if (authored.expected_transition_mode && row.transition_plan_mode !== authored.expected_transition_mode) return false;
              if (authored.expected_weighted_runtime && row.weighted_playback_runtime !== authored.expected_weighted_runtime) return false;
              if (authored.expected_weighted_consumer && row.weighted_playback_consumer !== authored.expected_weighted_consumer) return false;
              if (authored.expected_weighted_pair_id
                && !(row.weighted_playback_plan_key || '').includes(`${authored.expected_weighted_pair_id}:`)) return false;
              if (authored.expected_text_runtime && row.text_playback_runtime !== authored.expected_text_runtime) return false;
              if (authored.expected_text_consumer && row.text_playback_consumer !== authored.expected_text_consumer) return false;
              if (authored.expected_text_clip_id
                && !(row.text_playback_plan_key || '').includes(`\"clip_id\":\"${authored.expected_text_clip_id}\"`)) return false;
              if (authored.expected_cursor_clip_id) {
                const cursor = (row.cursor_surfaces || []).find((surface) => surface.clip_id === authored.expected_cursor_clip_id);
                if (!cursor || (authored.expected_cursor_consumer && cursor.consumer !== authored.expected_cursor_consumer)) return false;
              }
              return true;
            });
          };

          process.exit(failed.every((testCase) => countOnly(testCase) || boundaryOnly(testCase)) ? 0 : 1);
          NODE
          }

          generic_passed=false
          for attempt in 1 2 3; do
            if node scripts/video-playback-parity-capture.mjs \
              --url http://127.0.0.1:14180 \
              --fixture output/video-playback-shape-canonical/fixture/parity-playback-canonical-v7.json \
              --media-dir output/video-playback-shape-canonical/fixture/media \
              --output output/video-playback-shape-canonical/capture; then
              generic_passed=true
              break
            fi
            evidence="$capture/playback-evidence.json"
            cp "$evidence" "$capture/playback-evidence-attempt-${attempt}.json" 2>/dev/null || true
            if ! retryable_generic_scheduler_failure "$evidence" "$fixture"; then
              echo "v7 playback evidence failed semantically; refusing scheduler retry" >&2
              exit 1
            fi
            echo "v7 playback evidence attempt ${attempt} failed only due verified scheduler sampling/prewarm drift; retrying unchanged gate" >&2
          done
          if [ "$generic_passed" != true ]; then
            echo "v7 playback evidence did not satisfy the unchanged gate after 3 attempts" >&2
            exit 1
          fi

          shape_passed=false
          for attempt in 1 2 3; do
            if node scripts/video-playback-shape-parity-capture.mjs \
              --url http://127.0.0.1:14180 \
              --fixture output/video-playback-shape-canonical/fixture/parity-playback-canonical-v7.json \
              --seed-result output/video-playback-shape-canonical/capture/seed-result.json \
              --output output/video-playback-shape-canonical/capture/shape; then
              shape_passed=true
              break
            fi
            evidence="$capture/shape/shape-playback-evidence.json"
            cp "$evidence" "$capture/shape/shape-playback-evidence-attempt-${attempt}.json" 2>/dev/null || true
            if ! count_only_failure "$evidence"; then
              echo "shape playback evidence failed semantically; refusing retry" >&2
              exit 1
            fi
            echo "shape playback evidence attempt ${attempt} had only observation-count underflow; retrying exact gate" >&2
          done
          if [ "$shape_passed" != true ]; then
            echo "shape playback evidence did not satisfy the unchanged five-observation gate after 3 attempts" >&2
            exit 1
          fi
      - name: Record toolchain
        if: always()
        run: |
          mkdir -p output/video-playback-shape-canonical
          {
            go version
            node --version
            npm --version
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1
            node -e "console.log('playwright ' + require('playwright/package.json').version)"
          } > output/video-playback-shape-canonical/toolchain.txt
      - name: Upload rounded rectangle playback evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-playback-shape-canonical-parity-evidence
          path: output/video-playback-shape-canonical
          if-no-files-found: error
          retention-days: 14
