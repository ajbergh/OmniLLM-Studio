name: Replay OpenAPI tool servers

on:
  push:
    branches:
      - feat/openapi-tool-servers-main-20260809

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Replay Phase 6 delta
        run: |
          git fetch origin feat/assistant-profiles-skills-20260809 feat/openapi-tool-servers-20260809
          git diff --binary origin/feat/assistant-profiles-skills-20260809..origin/feat/openapi-tool-servers-20260809 -- \
            backend/internal/api/openapi_handler.go \
            backend/internal/api/router.go \
            backend/internal/db/agent_runtime_migration_test.go \
            backend/internal/db/db.go \
            backend/internal/models/openapi_server.go \
            backend/internal/openapi/manager.go \
            backend/internal/openapi/manager_test.go \
            backend/internal/repository/openapi_server.go \
            frontend/src/components/OpenAPIServersPanel.tsx \
            frontend/src/components/SettingsPanel.tsx \
            frontend/src/openApiServersApi.ts > /tmp/phase6.patch
          git apply --3way --index /tmp/phase6.patch
          gofmt -w backend/internal/api/openapi_handler.go backend/internal/api/router.go backend/internal/db/agent_runtime_migration_test.go backend/internal/db/db.go backend/internal/models/openapi_server.go backend/internal/openapi backend/internal/repository/openapi_server.go
          git add -A
      - name: Validate backend
        working-directory: backend
        run: |
          go test ./internal/openapi ./internal/repository ./internal/api ./internal/db ./internal/tools
          go vet ./internal/openapi ./internal/repository ./internal/api ./internal/db ./internal/tools
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test:unit
          npm run build
      - name: Commit clean Phase 6
        run: |
          rm .github/workflows/replay-openapi-tool-servers.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(openapi): add governed OpenAPI tool servers"
          git push origin HEAD
