name: Apply PR 296 renderer timing patch

on:
  push:
    branches:
      - fix/video-wysiwyg-phase3-transparent-video-presentation
    paths:
      - .github/workflows/patch-pr296-renderer-timing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/video-wysiwyg-phase3-transparent-video-presentation
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.13
          cache-dependency-path: backend/go.sum
      - name: Apply visual presentation-boundary patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          renderer = Path('backend/internal/video/renderer.go')
          text = renderer.read_text()

          type_marker = '''type FFmpegRenderer struct {
          \tbinary string
          }
          '''
          type_replacement = '''const (
          \tdeterministicVideoPresentationTimebaseHz  = 1_000_000
          \tdeterministicVideoPresentationBiasMicros = 490
          )

          // deterministicVideoPresentationTimingFilters mirrors deterministic browser
          // video seeking at exact source-frame boundaries. Some containers quantize
          // PTS to milliseconds, so a canonical rational time can fall just below the
          // next decoded frame. The visual stream first receives a microsecond timebase
          // so the 490 microsecond source-time bias is representable, then advances only
          // presentation timestamps. Canonical source time, audio timing, and
          // free-running preview semantics remain unchanged.
          func deterministicVideoPresentationTimingFilters(playbackRate float64) []string {
          \tif playbackRate <= 0 || math.IsNaN(playbackRate) || math.IsInf(playbackRate, 0) {
          \t\tplaybackRate = 1
          \t}
          \tsetTimebase := fmt.Sprintf("settb=expr=1/%d", deterministicVideoPresentationTimebaseHz)
          \tif math.Abs(playbackRate-1) <= 1e-9 {
          \t\treturn []string{
          \t\t\tsetTimebase,
          \t\t\tfmt.Sprintf("setpts=PTS-STARTPTS-%d", deterministicVideoPresentationBiasMicros),
          \t\t}
          \t}
          \treturn []string{
          \t\tsetTimebase,
          \t\tfmt.Sprintf("setpts=(PTS-STARTPTS-%d)/%.6f", deterministicVideoPresentationBiasMicros, playbackRate),
          \t}
          }

          type FFmpegRenderer struct {
          \tbinary string
          }
          '''
          if 'deterministicVideoPresentationTimingFilters' not in text:
              if text.count(type_marker) != 1:
                  raise SystemExit('renderer type insertion marker mismatch')
              text = text.replace(type_marker, type_replacement, 1)

          timing_marker = '''\t\t} else {
          \t\t\tchain = append(chain, fmt.Sprintf("trim=start=%.3f:duration=%.3f", trimInS, sourceDurS))
          \t\t\tif playbackRate == 1 {
          \t\t\t\tchain = append(chain, "setpts=PTS-STARTPTS")
          \t\t\t} else {
          \t\t\t\tchain = append(chain, fmt.Sprintf("setpts=(PTS-STARTPTS)/%.6f", playbackRate))
          \t\t\t}
          \t\t}
          '''
          timing_replacement = '''\t\t} else {
          \t\t\tchain = append(chain, fmt.Sprintf("trim=start=%.3f:duration=%.3f", trimInS, sourceDurS))
          \t\t\tchain = append(chain, deterministicVideoPresentationTimingFilters(playbackRate)...)
          \t\t}
          '''
          if timing_marker in text:
              if text.count(timing_marker) != 1:
                  raise SystemExit('renderer timing replacement marker count mismatch')
              text = text.replace(timing_marker, timing_replacement, 1)
          elif 'chain = append(chain, deterministicVideoPresentationTimingFilters(playbackRate)...)' not in text:
              raise SystemExit('renderer timing replacement marker missing')

          renderer.write_text(text)

          test_path = Path('backend/internal/video/renderer_pixelate_sampling_test.go')
          tests = test_path.read_text()
          marker = 'TestDeterministicVideoPresentationTimingFiltersUseFineTimebase'
          if marker not in tests:
              tests += '''

          func TestDeterministicVideoPresentationTimingFiltersUseFineTimebase(t *testing.T) {
          \tif got, want := strings.Join(deterministicVideoPresentationTimingFilters(1), ","), "settb=expr=1/1000000,setpts=PTS-STARTPTS-490"; got != want {
          \t\tt.Fatalf("deterministic video presentation filters mismatch: got %q want %q", got, want)
          \t}
          \tif got, want := strings.Join(deterministicVideoPresentationTimingFilters(2), ","), "settb=expr=1/1000000,setpts=(PTS-STARTPTS-490)/2.000000"; got != want {
          \t\tt.Fatalf("playback-rate presentation filters mismatch: got %q want %q", got, want)
          \t}
          }

          func TestBuildFilterComplexAppliesDeterministicVideoPresentationBias(t *testing.T) {
          \tclip := TimelineClip{ID: "video", StartMS: 0, DurationMS: 2000}
          \tgraph, _, _ := buildFilterComplexWithAudio(
          \t\tTimelineDocument{},
          \t\t[]resolvedClip{{inputIdx: 1, trackIndex: 0, clip: clip, isVideo: true}},
          \t\t512,
          \t\t512,
          \t\tfalse,
          \t)
          \tif !strings.Contains(graph, "trim=start=0.000:duration=2.000,settb=expr=1/1000000,setpts=PTS-STARTPTS-490") {
          \t\tt.Fatalf("video visual chain must apply the bounded presentation bias: %s", graph)
          \t}
          }
          '''
              test_path.write_text(tests)

          fidelity_path = Path('backend/internal/video/renderer_fidelity_test.go')
          fidelity = fidelity_path.read_text()
          old = '"trim=start=0.500:duration=8.000,setpts=(PTS-STARTPTS)/2.000000",'
          new = '"trim=start=0.500:duration=8.000,settb=expr=1/1000000,setpts=(PTS-STARTPTS-490)/2.000000",'
          if old in fidelity:
              if fidelity.count(old) != 1:
                  raise SystemExit('renderer fidelity expectation count mismatch')
              fidelity = fidelity.replace(old, new, 1)
          elif new not in fidelity:
              raise SystemExit('renderer fidelity expectation marker missing')
          fidelity_path.write_text(fidelity)
          PY
          gofmt -w \
            backend/internal/video/renderer.go \
            backend/internal/video/renderer_pixelate_sampling_test.go \
            backend/internal/video/renderer_fidelity_test.go
          cd backend
          go test ./internal/video
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            backend/internal/video/renderer.go \
            backend/internal/video/renderer_pixelate_sampling_test.go \
            backend/internal/video/renderer_fidelity_test.go; then
            echo 'Patch already present; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/internal/video/renderer.go \
            backend/internal/video/renderer_pixelate_sampling_test.go \
            backend/internal/video/renderer_fidelity_test.go
          git commit -m 'fix(video): align FFmpeg boundary frame presentation'
          git push origin HEAD:fix/video-wysiwyg-phase3-transparent-video-presentation
