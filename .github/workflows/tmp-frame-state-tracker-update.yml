name: Temporary FrameState tracker update

on:
  push:
    branches: [feat/video-wysiwyg-phase2-frame-state-diagnostics]

permissions:
  contents: write

jobs:
  update-tracker:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/video-wysiwyg-phase2-frame-state-diagnostics
          fetch-depth: 0
      - name: Update durable WYSIWYG tracker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md')
          text = path.read_text()

          merged_205 = '- PR #205 — canonical numeric property/keyframe evaluation across Go/TypeScript and preview/fidelity callers — `8a93f9ff90eeda92c944085715856907747584f1`.\n'
          merged_206 = '- PR #206 — exact-frame visual FrameState foundation — `c37ba2ed8132133cc913531946d462c3b7b38911`.\n'
          if merged_206 not in text:
              if text.count(merged_205) != 1:
                  raise SystemExit('could not locate merged #205 handoff line')
              text = text.replace(merged_205, merged_205 + merged_206, 1)

          current = re.compile(r'Current PR: \*\*#206 — Add exact-frame visual FrameState foundation\*\*\.\nCurrent branch: `feat/video-wysiwyg-phase2-transform-frame-state`\.\n\nCurrent slice:.*?temporary workflow scaffolding is removed before final PR validation\.\n', re.S)
          replacement = '''Current PR: **#208 — Bridge canonical FrameState into parity diagnostics**.\nCurrent branch: `feat/video-wysiwyg-phase2-frame-state-diagnostics`.\n\nCurrent slice: make canonical visual FrameState drift observable in the permanent parity baseline without changing preview or export composition. Browser/TypeScript and Go evaluate the same saved Timeline v1/frame samples through a shared diagnostic envelope; unsupported v1 semantics remain structured unavailable results rather than being guessed.\n\nFocused implementation validation for #208:\n\n- `visual-frame-state-diagnostic-v1` preserves adapter/runtime code, path, message, and remediation while containing generic evaluator failures behind `FRAME_STATE_EVALUATION_FAILED`.\n- `backend/cmd/video-frame-state-diagnostic` compares available states recursively with a `1e-9` numeric tolerance, emits quantized SHA-256 fingerprints, and compares unavailable results by semantic code/path so wording differences do not create false drift.\n- Hosted run `32200543950` passed focused Go tests/vet, frontend lint with zero errors, all 106 unit tests, and production build. Its live parity project then produced 103/103 matching fail-closed diagnostics for the real saved timeline and 103/103 matching available FrameState values for a transition-free diagnostic control, with zero mismatches.\n- Permanent Quality Gate wiring runs both checks inside the existing immutable Video renderer parity baseline and retains the diagnostic JSON/reports in the existing parity artifact.\n'''
          text, count = current.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'current handoff replacement count={count}, want 1')

          phase2 = re.compile(r'^\| Phase 2 — Canonical contract \|.*$', re.M)
          phase2_row = '| Phase 2 — Canonical contract | In progress | Schemas, projections, timing/easing/curves, v1 adapter, frame activity/range/source/order, runtime normalization, indexed preview ordering, deterministic frame/source addressing, backend frame callers, property/keyframe evaluation, and exact-frame visual FrameState are merged. PR #208 adds permanent cross-runtime FrameState diagnostics. Full media fit/mask/perspective semantics, transitions/effects, text/shape/cursor state, and AudioGraph remain. |'
          text, count = phase2.subn(phase2_row, text, count=1)
          if count != 1:
              raise SystemExit(f'phase 2 tracker replacement count={count}, want 1')

          heading = '### Current PR #206 — exact-frame transform/camera FrameState foundation'
          if text.count(heading) != 1:
              raise SystemExit('could not locate #206 Phase 2 heading')
          text = text.replace(heading, '### Merged PR #206 — exact-frame transform/camera FrameState foundation', 1)

          remaining_marker = '### Remaining Phase 2 work\n'
          if text.count(remaining_marker) != 1:
              raise SystemExit('could not locate Remaining Phase 2 work')
          current_208 = '''### Current PR #208 — canonical FrameState parity diagnostics\n\nImplemented:\n\n- `frontend/src/video/renderContractFrameStateDiagnostics.ts` and `backend/internal/video/frame_state_diagnostic.go` expose the same serializable availability/error/state envelope around the existing fail-closed v1→v2 adapter and visual FrameState evaluator.\n- `scripts/video-frame-state-diagnostics.mjs` captures browser/TypeScript diagnostics from the saved normalized Timeline v1 used by the parity project. A clearly labeled transition-free control removes only transition records from a copy so CI also exercises actual representable FrameState values without changing production adapter semantics.\n- `backend/cmd/video-frame-state-diagnostic` evaluates the same timeline/frame samples in Go, compares structured unavailable results by semantic code/path, compares available state recursively at `1e-9` numeric tolerance, records fingerprints, and exits nonzero on drift.\n- `.github/workflows/ci.yml` makes these checks part of the existing Video renderer parity baseline before the legacy pixel/audio report. The existing `video-parity-baseline` artifact retains the browser diagnostics, saved/control timelines, Go reports, and ordinary parity evidence together.\n- Focused live run `32200543950` proved both sides of the contract: real saved timeline = 0 available / 103 matched unavailable / 0 mismatches; transition-free control = 103 available compared / 0 unavailable / 0 mismatches.\n\nScope boundary: #208 is diagnostic-only. It does not change preview composition, FFmpeg composition, v1 transition semantics, canonical geometry semantics, or AudioGraph behavior.\n\n'''
          text = text.replace(remaining_marker, current_208 + remaining_marker, 1)

          remaining = re.compile(r'### Remaining Phase 2 work\n\n.*?\n### Phase 2 exit gate', re.S)
          remaining_text = '''### Remaining Phase 2 work\n\n1. Validate and merge PR #208 canonical FrameState parity diagnostics.\n2. Canonicalize remaining media geometry: `cover`/`fill`/`none`, mask-source crop, clip perspective, and content-bounds provenance/anchor edge cases.\n3. Define transition placement/peer state and effect-stack ordering/animation.\n4. Define text/shape/cursor evaluated state.\n5. Define/compile serializable `AudioGraph` for timing/rate/channel/gain/fade/mute/solo/processing decisions.\n6. Fail closed whenever an authorable field lacks canonical semantics.\n\n### Phase 2 exit gate'''
          text, count = remaining.subn(remaining_text, text, count=1)
          if count != 1:
              raise SystemExit(f'remaining Phase 2 replacement count={count}, want 1')

          risk_anchor = '| FrameState claims authority before paint semantics are canonical | `visual-frame-state-v1` carries explicit layer/global unresolved sets; any unresolved feature makes the state non-authoritative until its dedicated evaluator lands. |\n'
          risk_line = '| Cross-runtime FrameState drift hides behind v1 adapter unavailability | Permanent parity CI checks the real saved timeline for identical fail-closed code/path and a transition-free control for 103 actual browser/Go state comparisons at `1e-9` numeric tolerance. |\n'
          if risk_line not in text:
              if text.count(risk_anchor) != 1:
                  raise SystemExit('could not locate FrameState authority risk row')
              text = text.replace(risk_anchor, risk_anchor + risk_line, 1)

          old206 = '- PR #206 adds exact-frame clip/camera property sampling and the first visual FrameState foundation. Initial run `32194804878` exposed the stale normalizer symbol; repair/validation run `32194929252` then passed focused Go test/vet plus frontend lint, 106/106 unit tests, and production build, landing validated code as `3bee778881a6d936000da8f7b1ad7a5bdb311e8f`.\n'
          new206 = '- PR #206 added exact-frame clip/camera property sampling and the first visual FrameState foundation. Initial run `32194804878` exposed the stale normalizer symbol; repair/validation run `32194929252` passed focused Go test/vet plus frontend lint, 106/106 unit tests, and production build. Final clean head `724e673ab41f956b44184ae871d2f1093b44e770` passed full Quality Gate, Playwright, renderer parity, both CodeQL languages, and vulnerability audits; #206 merged as `c37ba2ed8132133cc913531946d462c3b7b38911`.\n- PR #208 bridges visual FrameState into parity diagnostics without changing compositor behavior. Hosted run `32200543950` passed focused Go test/vet plus frontend lint, 106/106 unit tests, and production build; its live project produced 103 matched fail-closed saved-timeline diagnostics and 103 matched available transition-free control states with zero mismatches.\n'
          if text.count(old206) != 1:
              raise SystemExit('could not locate #206 implementation log entry')
          text = text.replace(old206, new206, 1)

          marker = '## Next recommended slice\n'
          if text.count(marker) != 1:
              raise SystemExit('could not locate next recommended slice')
          prefix = text.split(marker, 1)[0]
          text = prefix + '''## Next recommended slice\n\nAfter PR #208 is green and merged:\n\n1. Implement canonical media-geometry evaluation for `contain`/`cover`/`fill`/`none`, mask-source crop, clip perspective, and content-bounds provenance/anchor edge cases in Go and TypeScript with a shared fixture.\n2. Fold those geometry results into visual FrameState so the permanent browser/Go diagnostic control begins checking the newly canonicalized values automatically.\n3. Keep preview/export compositor behavior unchanged until the geometry state is validated; migrate callers in a following reviewable slice.\n4. Continue Phase 0 production visual-threshold policy, unsupported-audio boundary, and second-platform evidence in parallel.\n'''
          path.write_text(text)
          PY
          grep -q 'Current PR: \*\*#208' docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md
          grep -q 'Current PR #208 — canonical FrameState parity diagnostics' docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md
          git rm .github/workflows/tmp-frame-state-tracker-update.yml
          git diff --cached --check
          git commit -m "docs(video): advance WYSIWYG tracker through FrameState diagnostics"
          git push origin HEAD:feat/video-wysiwyg-phase2-frame-state-diagnostics
