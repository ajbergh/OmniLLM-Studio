name: Cursor Playback V5 Isolated Evidence

on:
  push:
    branches:
      - feat/video-wysiwyg-phase3-cursor-playback-parity-v5-work

permissions:
  contents: write

jobs:
  validate-v5:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Apply isolated guarded v5 patch
        run: |
          python scripts/tmp-cursor-playback-v5-patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/internal/video/parity_fixture_playback.go')
          text = path.read_text()
          replacements = [
              (
                  'Name: "cursor-canonical-playback", FrameIndex: 216, ObserveMS: 380',
                  'Name: "cursor-canonical-playback", FrameIndex: 216, ObserveMS: 600',
                  'standalone cursor observation window',
              ),
              (
                  'Name: "weighted-text-canonical-playback", FrameIndex: 852, ObserveMS: 350',
                  'Name: "weighted-text-canonical-playback", FrameIndex: 822, ObserveMS: 250',
                  'weighted cursor composition window',
              ),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor count={count}, want 1')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          gofmt -w backend/internal/video/parity_fixture_playback.go backend/internal/video/parity_fixture_playback_test.go
          git diff --check
      - name: Install dependencies
        run: |
          npm ci
          (cd frontend && npm ci)
          bash scripts/ci-apt-install.sh ffmpeg fonts-dejavu-core
          bash scripts/ci-playwright-install.sh
      - name: Validate contracts and build
        run: |
          set -euo pipefail
          (cd backend && go test ./internal/video -run 'TestPlaybackCanonicalParityFixtureValid')
          (cd frontend && npm run lint)
          (cd frontend && npx vitest run \
            src/components/video/previewPlaybackCanonicalization.test.ts \
            src/components/video/previewCursorPlayback.test.ts \
            src/components/video/previewPlaybackCursorCanonicalization.test.ts \
            src/components/video/previewTextPlaybackRuntime.test.ts \
            src/components/video/previewWeightedPlaybackRuntime.test.ts \
            src/components/video/previewFrameTransitionPairs.test.ts \
            src/components/video/previewFrameWeightedPairCanvas.test.ts \
            src/components/video/previewFrameWeightedPairRaster.test.ts \
            src/components/video/sourceTiming.test.ts)
          (cd frontend && npm run build)
          node --check scripts/video-playback-parity-capture.mjs
      - name: Generate v5 playback fixture and media
        run: |
          set -euo pipefail
          (cd backend && go run ./cmd/video-parity-fixture \
            --output-dir ../output/video-playback-canonical/fixture \
            --random-samples 0 \
            --generate-media)
          (cd backend && go run ./cmd/video-playback-parity-fixture \
            --output-dir ../output/video-playback-canonical/fixture)
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf \
            output/video-playback-canonical/fixture/media/asset-font.ttf
          dd if=/dev/zero \
            of=output/video-playback-canonical/fixture/media/asset-font-invalid.ttf \
            bs=1024 count=1 status=none
      - name: Capture and gate live v5 playback evidence
        shell: bash
        run: |
          set -euo pipefail
          runtime="$GITHUB_WORKSPACE/output/video-playback-canonical/runtime"
          mkdir -p "$runtime/attachments"
          export OMNILLM_PORT=18096
          export OMNILLM_DB_PATH="$runtime/parity.db"
          export OMNILLM_ATTACHMENTS_DIR="$runtime/attachments"
          (cd backend && go run ./cmd/server >"$runtime/backend.log" 2>"$runtime/backend.err.log") &
          backend_pid=$!
          (cd frontend && OMNILLM_API_PROXY_TARGET=http://127.0.0.1:18096 npm run dev -- --host 127.0.0.1 --port 14179 >"$runtime/frontend.log" 2>"$runtime/frontend.err.log") &
          frontend_pid=$!
          cleanup() {
            kill "$frontend_pid" "$backend_pid" 2>/dev/null || true
            wait "$frontend_pid" "$backend_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18096/v1/health >/dev/null && curl --fail --silent http://127.0.0.1:14179/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "playback parity servers did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          node scripts/video-playback-parity-capture.mjs \
            --url http://127.0.0.1:14179 \
            --fixture output/video-playback-canonical/fixture/parity-playback-canonical-v5.json \
            --media-dir output/video-playback-canonical/fixture/media \
            --output output/video-playback-canonical/capture
      - name: Upload isolated v5 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: isolated-cursor-playback-v5-evidence
          path: output/video-playback-canonical
          if-no-files-found: warn
          retention-days: 14
      - name: Commit validated v5 changes
        if: success()
        run: |
          rm .github/workflows/tmp-cursor-playback-v5.yml
          rm .github/workflows/tmp-cursor-playback-v5b.yml
          rm scripts/tmp-cursor-playback-v5-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Prove canonical cursor normal playback"
          git push origin HEAD:feat/video-wysiwyg-phase3-cursor-playback-parity-v5-work
