name: Temporary WYSIWYG 292 Docs Patch

on:
  push:
    branches:
      - fix/video-wysiwyg-phase3-decoded-frame-identity
    paths:
      - '.github/workflows/.tmp-wysiwyg-292-docs-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/video-wysiwyg-phase3-decoded-frame-identity
          fetch-depth: 0
      - name: Update durable tracker
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/.tmp_wysiwyg_292_docs_patch.py
          rm scripts/.tmp_wysiwyg_292_docs_patch.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Record decoded frame identity evidence'
          git push origin HEAD:fix/video-wysiwyg-phase3-decoded-frame-identity
