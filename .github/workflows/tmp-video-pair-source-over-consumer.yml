name: Temporary video pair source-over consumer patch

on:
  push:
    branches:
      - feat/video-wysiwyg-phase3-transition-pair-source-over-consumer

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/video-wysiwyg-phase3-transition-pair-source-over-consumer
          fetch-depth: 0

      - name: Apply reviewed source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          canvas_path = Path('frontend/src/components/video/VideoPreviewCanvas.tsx')
          canvas = canvas_path.read_text()
          canvas = replace_once(
              canvas,
              "import { resolvePreviewFrameOwnerTransitionPaint } from './previewFrameTransitionPaint';\n",
              "import { resolvePreviewFrameOwnerTransitionPaint } from './previewFrameTransitionPaint';\n"
              "import {\n"
              "  planPreviewFrameTransitionPairs,\n"
              "  shouldConsumePreviewFrameSourceOverPairs,\n"
              "  type PreviewTransitionPairLayerPaint,\n"
              "} from './previewFrameTransitionPairs';\n",
              'canvas pair import',
          )
          canvas = replace_once(
              canvas,
              "  const previewLayers = [...layers, ...posterLayers]\n    .sort(compareIndexedTimelineClipOrder);\n"
              "  const useCanonicalPerspective = shouldUseCanonicalPreviewPerspective(\n",
              "  const previewLayers = [...layers, ...posterLayers]\n    .sort(compareIndexedTimelineClipOrder);\n"
              "  const transitionPairPlan = planPreviewFrameTransitionPairs(\n"
              "    deterministicFrame !== null && !liveTransform && !cropMode && !editingTextClipId\n"
              "      ? deterministicFrame\n"
              "      : null,\n"
              "    previewLayers,\n"
              "  );\n"
              "  const consumeSourceOverTransitionPairs = shouldConsumePreviewFrameSourceOverPairs(transitionPairPlan);\n"
              "  const useCanonicalPerspective = shouldUseCanonicalPreviewPerspective(\n",
              'canvas pair plan',
          )
          canvas = replace_once(
              canvas,
              "  const renderLayer = (entry: LayerEntry, poster = false) => {\n",
              "  const renderLayer = (\n"
              "    entry: LayerEntry,\n"
              "    poster = false,\n"
              "    pairPaint?: PreviewTransitionPairLayerPaint,\n"
              "    inPairSurface = false,\n"
              "  ) => {\n",
              'canvas renderLayer signature',
          )
          if canvas.count('transitionPaint.offsetXFraction * canvasWidth') != 1:
              raise SystemExit('canvas pair x offset: unexpected match count')
          canvas = canvas.replace(
              'transitionPaint.offsetXFraction * canvasWidth',
              '(transitionPaint.offsetXFraction + (pairPaint?.offsetXFraction ?? 0)) * canvasWidth',
          )
          if canvas.count('transitionPaint.offsetYFraction * canvasHeight') != 1:
              raise SystemExit('canvas pair y offset: unexpected match count')
          canvas = canvas.replace(
              'transitionPaint.offsetYFraction * canvasHeight',
              '(transitionPaint.offsetYFraction + (pairPaint?.offsetYFraction ?? 0)) * canvasHeight',
          )
          if canvas.count('* transitionPaint.scaleMultiplier}') != 2:
              raise SystemExit('canvas pair scale: expected two axis matches')
          canvas = canvas.replace(
              '* transitionPaint.scaleMultiplier}',
              '* transitionPaint.scaleMultiplier * (pairPaint?.scaleMultiplier ?? 1)}',
          )
          canvas = replace_once(
              canvas,
              "      clipPath: transitionPaint.clipPath,\n",
              "      clipPath: pairPaint?.clipPath ?? transitionPaint.clipPath,\n",
              'canvas pair clip',
          )
          canvas = replace_once(
              canvas,
              "      pointerEvents: perspectiveDistance !== null ? 'auto' : undefined,\n",
              "      pointerEvents: inPairSurface || perspectiveDistance !== null ? 'auto' : undefined,\n",
              'canvas pair pointer events',
          )
          canvas = replace_once(
              canvas,
              "        data-preview-transition-paint-deferred={transitionPaint.deferredComposition}\n",
              "        data-preview-transition-paint-deferred={transitionPaint.deferredComposition}\n"
              "        data-preview-transition-pair-paint-mode={pairPaint ? 'canonical-source-over' : undefined}\n",
              'canvas pair diagnostic attr',
          )
          canvas = replace_once(
              canvas,
              "    );\n  };\n\n  return (\n    <div ref={rootRef} className=\"flex h-full min-h-[320px] flex-col rounded-lg border border-border bg-black\">\n",
              "    );\n  };\n\n"
              "  const renderTransitionSlot = (slot: (typeof transitionPairPlan.slots)[number]) => {\n"
              "    if (slot.kind === 'single') {\n"
              "      return renderLayer(slot.layer, posterClipIds.has(slot.layer.clip.id));\n"
              "    }\n"
              "    if (slot.execution !== 'source-over-dom') {\n"
              "      throw new Error(`preview transition pair ${JSON.stringify(slot.surface.transition_id)} reached source-over consumer with ${slot.execution}`);\n"
              "    }\n"
              "    const lowerPaint = slot.layerPaintByClipId.get(slot.lower.clip.id);\n"
              "    const upperPaint = slot.layerPaintByClipId.get(slot.upper.clip.id);\n"
              "    if (!lowerPaint || !upperPaint) {\n"
              "      throw new Error(`preview transition pair ${JSON.stringify(slot.surface.transition_id)} is missing resolved layer paint`);\n"
              "    }\n"
              "    return (\n"
              "      <div\n"
              "        key={`transition-pair-${slot.surface.transition_id}`}\n"
              "        data-preview-transition-pair-id={slot.surface.transition_id}\n"
              "        data-preview-transition-pair-execution={slot.execution}\n"
              "        data-preview-transition-pair-lower-clip={slot.surface.lower_clip_id}\n"
              "        data-preview-transition-pair-upper-clip={slot.surface.upper_clip_id}\n"
              "        className=\"absolute inset-0\"\n"
              "        style={{ isolation: 'isolate', pointerEvents: 'none', transformStyle: 'preserve-3d' }}\n"
              "      >\n"
              "        {renderLayer(slot.lower, posterClipIds.has(slot.lower.clip.id), lowerPaint, true)}\n"
              "        {renderLayer(slot.upper, posterClipIds.has(slot.upper.clip.id), upperPaint, true)}\n"
              "      </div>\n"
              "    );\n"
              "  };\n\n"
              "  return (\n    <div ref={rootRef} className=\"flex h-full min-h-[320px] flex-col rounded-lg border border-border bg-black\">\n",
              'canvas pair slot renderer',
          )
          canvas = replace_once(
              canvas,
              "          data-preview-perspective-mode={useCanonicalPerspective ? 'canonical-per-layer' : 'legacy-shared'}\n",
              "          data-preview-perspective-mode={useCanonicalPerspective ? 'canonical-per-layer' : 'legacy-shared'}\n"
              "          data-preview-transition-pair-plan-mode={transitionPairPlan.mode}\n"
              "          data-preview-transition-pair-consumer={consumeSourceOverTransitionPairs ? 'canonical-source-over' : 'legacy-independent-layers'}\n"
              "          data-preview-transition-pair-deferred={transitionPairPlan.deferredReasons.length > 0 ? transitionPairPlan.deferredReasons.join(',') : undefined}\n",
              'canvas pair stage diagnostics',
          )
          canvas = replace_once(
              canvas,
              "          {previewLayers.map((entry) => renderLayer(entry, posterClipIds.has(entry.clip.id)))}\n",
              "          {consumeSourceOverTransitionPairs\n"
              "            ? transitionPairPlan.slots.map((slot) => renderTransitionSlot(slot))\n"
              "            : previewLayers.map((entry) => renderLayer(entry, posterClipIds.has(entry.clip.id)))}\n",
              'canvas pair slot consumption',
          )
          canvas_path.write_text(canvas)

          planner_path = Path('frontend/src/components/video/previewFrameTransitionPairs.ts')
          planner = planner_path.read_text()
          planner = replace_once(
              planner,
              "}\n\nfunction resolvePairLayerPaint(\n",
              "}\n\n"
              "/**\n"
              " * Admit DOM pair execution only when the complete frame has one clean\n"
              " * source-over interpretation. Pair inputs must not carry another active\n"
              " * paint because ordering multiple transition paints is still explicit debt.\n"
              " */\n"
              "export function shouldConsumePreviewFrameSourceOverPairs<T extends PairablePreviewLayer>(\n"
              "  plan: PreviewTransitionPairPlan<T>,\n"
              "): boolean {\n"
              "  if (plan.mode !== 'canonical-source-over' || plan.deferredReasons.length > 0) return false;\n"
              "  for (const slot of plan.slots) {\n"
              "    if (slot.kind !== 'pair') continue;\n"
              "    if (slot.execution !== 'source-over-dom') return false;\n"
              "    const owner = slot.surface.owner_clip_id === slot.lower.clip.id ? slot.lower : slot.upper;\n"
              "    const peer = slot.surface.peer_clip_id === slot.lower.clip.id ? slot.lower : slot.upper;\n"
              "    const ownerPaints = owner.canonicalState?.transition_paint ?? [];\n"
              "    const peerPaints = peer.canonicalState?.transition_paint ?? [];\n"
              "    if (ownerPaints.length !== 1 || ownerPaints[0].transition_id !== slot.surface.transition_id) return false;\n"
              "    if (peerPaints.length !== 0) return false;\n"
              "  }\n"
              "  return true;\n"
              "}\n\n"
              "function resolvePairLayerPaint(\n",
              'planner source-over admission helper',
          )
          planner_path.write_text(planner)

          test_path = Path('frontend/src/components/video/previewFrameTransitionPairs.test.ts')
          test = test_path.read_text()
          test = replace_once(
              test,
              "  TRANSITION_PAINT_CROSSFADE,\n",
              "  TRANSITION_PAINT_CROSSFADE,\n  TRANSITION_PAINT_OWNER_ALPHA,\n",
              'test owner alpha import',
          )
          test = replace_once(
              test,
              "import { planPreviewFrameTransitionPairs } from './previewFrameTransitionPairs';\n",
              "import { planPreviewFrameTransitionPairs, shouldConsumePreviewFrameSourceOverPairs } from './previewFrameTransitionPairs';\n",
              'test helper import',
          )
          test = replace_once(
              test,
              "    expect(result.mode).toBe('canonical-source-over');\n    expect(result.slots.map((slot) => slot.kind)).toEqual(['single', 'pair', 'single']);\n",
              "    expect(result.mode).toBe('canonical-source-over');\n    expect(shouldConsumePreviewFrameSourceOverPairs(result)).toBe(true);\n    expect(result.slots.map((slot) => slot.kind)).toEqual(['single', 'pair', 'single']);\n",
              'test source-over admission',
          )
          test = replace_once(
              test,
              "    expect(result.mode).toBe('canonical-weighted-deferred');\n    expect(pair.kind).toBe('pair');\n",
              "    expect(result.mode).toBe('canonical-weighted-deferred');\n    expect(shouldConsumePreviewFrameSourceOverPairs(result)).toBe(false);\n    expect(pair.kind).toBe('pair');\n",
              'test weighted rejection',
          )
          test = replace_once(
              test,
              "    expect(result.deferredReasons).toContain('transition-1:pair-inputs-not-adjacent');\n  });\n});\n",
              "    expect(result.deferredReasons).toContain('transition-1:pair-inputs-not-adjacent');\n"
              "    expect(shouldConsumePreviewFrameSourceOverPairs(result)).toBe(false);\n"
              "  });\n\n"
              "  it('keeps a pair frame on fallback when either pair input owns another active paint', () => {\n"
              "    const result = planPreviewFrameTransitionPairs(50, [\n"
              "      layer('clip-a', [\n"
              "        paint({\n"
              "          translation_space: TRANSITION_PAINT_TRANSLATION_CANVAS_FRACTION,\n"
              "          outgoing_offset_x: -0.5,\n"
              "          outgoing_offset_y: 0,\n"
              "          incoming_offset_x: 0.5,\n"
              "          incoming_offset_y: 0,\n"
              "        }),\n"
              "        paint({\n"
              "          transition_id: 'fade-1',\n"
              "          type: 'fade',\n"
              "          placement: 'in',\n"
              "          composition: TRANSITION_PAINT_OWNER_ALPHA,\n"
              "          peer_clip_id: undefined,\n"
              "          outgoing_clip_id: undefined,\n"
              "          incoming_clip_id: undefined,\n"
              "          owner_opacity: 0.5,\n"
              "        }),\n"
              "      ]),\n"
              "      layer('clip-b'),\n"
              "    ]);\n"
              "    expect(result.mode).toBe('canonical-source-over');\n"
              "    expect(shouldConsumePreviewFrameSourceOverPairs(result)).toBe(false);\n"
              "  });\n"
              "});\n",
              'test deferred and multiple-paint guard',
          )
          test_path.write_text(test)
          PY

      - name: Check patch
        run: git diff --check

      - name: Commit source patch and remove temporary workflow
        shell: bash
        run: |
          git rm -- .github/workflows/tmp-video-pair-source-over-consumer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/video/VideoPreviewCanvas.tsx \
            frontend/src/components/video/previewFrameTransitionPairs.ts \
            frontend/src/components/video/previewFrameTransitionPairs.test.ts
          git commit -m "feat(video): consume canonical source-over transition pairs"
          git push origin HEAD:feat/video-wysiwyg-phase3-transition-pair-source-over-consumer
