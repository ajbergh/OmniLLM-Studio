name: Integrate Rounded Rectangle Raster

on:
  push:
    branches:
      - feat/video-wysiwyg-phase3-rounded-rectangle-parity

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'
          cache-dependency-path: backend/go.sum
      - name: Apply guarded integration
        run: |
          set -euo pipefail
          python scripts/tmp-integrate-rounded-rectangle-raster.py
          gofmt -w \
            backend/internal/video/renderer_shape_raster.go \
            backend/internal/video/renderer_shape_raster_test.go \
            backend/internal/video/renderer_fidelity.go
          git diff --check
      - name: Validate video renderer package
        working-directory: backend
        run: |
          set -euo pipefail
          go test ./internal/video/rendercontract
          go test ./internal/video
      - name: Commit validated integration
        run: |
          set -euo pipefail
          git rm scripts/tmp-integrate-rounded-rectangle-raster.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate rounded rectangle raster export'
          git push origin HEAD:feat/video-wysiwyg-phase3-rounded-rectangle-parity
