name: Temporary PR302 lockfile refresh

on:
  push:
    branches:
      - feat/video-wysiwyg-phase3-weighted-playback

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/video-wysiwyg-phase3-weighted-playback
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Refresh vulnerable frontend lockfile entries
        working-directory: frontend
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Verify frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "npm produced no lockfile change" >&2
            exit 1
          fi
          if ! git diff --quiet -- frontend/package.json; then
            echo "npm unexpectedly modified frontend/package.json" >&2
            git diff -- frontend/package.json
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore(frontend): remediate browserslist audit"
          git push origin HEAD:feat/video-wysiwyg-phase3-weighted-playback
