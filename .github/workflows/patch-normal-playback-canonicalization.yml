name: Apply normal playback canonicalization

on:
  push:
    branches:
      - feat/video-wysiwyg-phase3-normal-playback-canonicalization
    paths:
      - '.github/workflows/patch-normal-playback-canonicalization.yml'

permissions:
  contents: write

env:
  NODE_VERSION: '24'

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/video-wysiwyg-phase3-normal-playback-canonicalization
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Align playback contract naming and comments
        run: |
          set -euo pipefail
          python3 scripts/patch-normal-playback-comments-v2.py
          git diff --check
          ! grep -q "until normal-playback canonicalization" frontend/src/components/video/previewFrameTransitionPaint.ts
          ! grep -q "Free-running playback and direct manipulation" frontend/src/components/video/previewFrameMediaGeometry.ts
          ! grep -q "free-running playback or fail-closed" frontend/src/components/video/previewFrameEffects.ts
      - name: Validate frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npx vitest run src/components/video/previewPlaybackCanonicalization.test.ts src/components/video/sourceTiming.test.ts src/components/video/pro/timelineIndex.test.ts src/components/video/previewFrameMediaGeometry.test.ts src/components/video/previewFrameTransform.test.ts src/components/video/previewFrameViewTransform.test.ts src/components/video/previewFramePerspectiveProjection.test.ts src/components/video/previewFrameTransitionPaint.test.ts src/components/video/previewFrameEffects.test.ts
          npm run lint
          npm run build
      - name: Commit validated contract cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/src/components/video/previewFrameTransform.ts \
            frontend/src/components/video/previewFrameViewTransform.ts \
            frontend/src/components/video/previewFrameMediaGeometry.ts \
            frontend/src/components/video/previewFrameMediaGeometry.test.ts \
            frontend/src/components/video/previewFramePerspectiveProjection.ts \
            frontend/src/components/video/previewFrameTransitionPaint.ts \
            frontend/src/components/video/previewFrameEffects.ts
          git diff --cached --check
          git commit -m "docs(video): align canonical playback contracts"
          git push origin HEAD:feat/video-wysiwyg-phase3-normal-playback-canonicalization
