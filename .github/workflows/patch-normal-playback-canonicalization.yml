name: Apply normal playback canonicalization

on:
  push:
    branches:
      - feat/video-wysiwyg-phase3-normal-playback-canonicalization
    paths:
      - '.github/workflows/patch-normal-playback-canonicalization.yml'

permissions:
  contents: write

env:
  NODE_VERSION: '24'

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/video-wysiwyg-phase3-normal-playback-canonicalization
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply exact media-only playback gate
        run: |
          set -euo pipefail
          python3 scripts/patch-normal-playback-media-gate.py
          git diff --check
          grep -q "resolvePreviewPlaybackCanonicalization" frontend/src/components/video/VideoPreviewCanvasLegacy.tsx
          grep -q "data-preview-playback-canonical-deferred" frontend/src/components/video/VideoPreviewCanvasLegacy.tsx
      - name: Validate frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npx vitest run src/components/video/previewPlaybackCanonicalization.test.ts src/components/video/sourceTiming.test.ts src/components/video/pro/timelineIndex.test.ts src/components/video/previewFrameMediaGeometry.test.ts src/components/video/previewFrameTransform.test.ts src/components/video/previewFrameViewTransform.test.ts src/components/video/previewFramePerspectiveProjection.test.ts src/components/video/previewFrameTransitionPaint.test.ts src/components/video/previewFrameEffects.test.ts
          npm run lint
          npm run build
      - name: Commit validated media-only gate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/video/VideoPreviewCanvasLegacy.tsx
          git diff --cached --check
          git commit -m "fix(video): fail closed unsupported playback painters"
          git push origin HEAD:feat/video-wysiwyg-phase3-normal-playback-canonicalization
