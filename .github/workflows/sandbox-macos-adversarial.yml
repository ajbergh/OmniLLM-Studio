name: macOS Sandbox Adversarial Assurance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-macos-adversarial-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.13'

jobs:
  sandbox-macos-adversarial:
    name: Darwin adversarial confinement
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Prove adversarial runtime and extension boundaries
        working-directory: backend
        run: |
          set -o pipefail
          test -x /usr/bin/sandbox-exec
          go test ./internal/sandbox -run '^TestDarwinAdversarial' -count=1 -v 2>&1 | tee ../sandbox-macos-adversarial.log
      - name: Upload macOS adversarial diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-macos-adversarial-diagnostics
          path: sandbox-macos-adversarial.log
          if-no-files-found: ignore
          retention-days: 14
