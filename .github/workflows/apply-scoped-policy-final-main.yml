name: Apply scoped policy and ToolSearch repair

on:
  push:
    branches:
      - fix/phase8-source-repair-20260809

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Import validated Phase 8 core and integration script
        run: |
          git fetch origin feat/scoped-tool-policy-toolsearch-core-20260809 feat/scoped-tool-policy-toolsearch-on-sandbox-20260809
          mkdir -p .github/scripts
          git show origin/feat/scoped-tool-policy-toolsearch-on-sandbox-20260809:.github/scripts/apply_scoped_policy_final.py > .github/scripts/apply_scoped_policy_final.py
          git checkout origin/feat/scoped-tool-policy-toolsearch-core-20260809 -- \
            backend/internal/models/tool_scope.go \
            backend/internal/repository/scoped_tool_permission.go \
            backend/internal/repository/scoped_tool_permission_test.go \
            backend/internal/tools/executor.go \
            backend/internal/tools/executor_approved.go \
            backend/internal/tools/executor_scoped.go \
            backend/internal/tools/registry.go \
            backend/internal/tools/execution_plan.go \
            backend/internal/tools/execution_run.go \
            backend/internal/tools/tool_search.go \
            backend/internal/tools/scoped_policy_test.go \
            backend/internal/api/scoped_tool_permission_handler.go \
            frontend/src/scopedToolPermissionsApi.ts \
            frontend/src/components/ScopedToolPermissionsPanel.tsx
          python3 .github/scripts/apply_scoped_policy_final.py
      - name: Format Go
        run: |
          gofmt -w \
            backend/internal/models/tool_scope.go \
            backend/internal/repository/scoped_tool_permission.go \
            backend/internal/repository/scoped_tool_permission_test.go \
            backend/internal/tools/executor.go \
            backend/internal/tools/executor_approved.go \
            backend/internal/tools/executor_scoped.go \
            backend/internal/tools/registry.go \
            backend/internal/tools/execution_plan.go \
            backend/internal/tools/execution_run.go \
            backend/internal/tools/tool_search.go \
            backend/internal/tools/scoped_policy_test.go \
            backend/internal/api/scoped_tool_permission_handler.go \
            backend/internal/api/chat_tool_runtime.go \
            backend/internal/api/chat_tool_execution.go \
            backend/internal/api/message_handler.go \
            backend/internal/api/router.go \
            backend/internal/agent/planner.go \
            backend/internal/db/db.go \
            backend/internal/db/agent_runtime_migration_test.go
      - name: Validate backend
        working-directory: backend
        run: |
          go test ./internal/repository ./internal/tools ./internal/agent ./internal/api ./internal/db
          go vet ./internal/repository ./internal/tools ./internal/agent ./internal/api ./internal/db
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test:unit
          npm run build
      - name: Commit repaired Phase 8 source
        run: |
          rm .github/workflows/apply-scoped-policy-final-main.yml
          rm .github/scripts/apply_scoped_policy_final.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(tools): land scoped permissions and deferred ToolSearch source"
          git push origin HEAD
