name: Replay assistant profiles and skills

on:
  push:
    branches:
      - feat/assistant-profiles-skills-main-20260809

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Replay Phase 5 delta
        run: |
          git fetch origin feat/chat-turn-tool-controls-main-20260809 feat/assistant-profiles-skills-20260809
          git diff --binary origin/feat/chat-turn-tool-controls-main-20260809..origin/feat/assistant-profiles-skills-20260809 -- \
            backend/internal/agent/planner.go \
            backend/internal/agent/runner.go \
            backend/internal/agent/tool_scope.go \
            backend/internal/agent/tool_scope_test.go \
            backend/internal/agent/types.go \
            backend/internal/api/agent_handler.go \
            backend/internal/api/assistant_profile_handler.go \
            backend/internal/api/router.go \
            backend/internal/db/agent_runtime_migration_test.go \
            backend/internal/db/db.go \
            backend/internal/models/assistant_profile.go \
            backend/internal/repository/assistant_profile.go \
            backend/internal/tools/skill_tools.go \
            frontend/src/agentRuntimeApi.ts \
            frontend/src/assistantProfilesApi.ts \
            frontend/src/components/AgentRunView.tsx \
            frontend/src/components/AssistantProfilesPanel.tsx \
            frontend/src/components/SettingsPanel.tsx > /tmp/phase5.patch
          git apply --index /tmp/phase5.patch
          gofmt -w backend/internal/agent backend/internal/api backend/internal/db backend/internal/models/assistant_profile.go backend/internal/repository/assistant_profile.go backend/internal/tools/skill_tools.go
          git add -A
      - name: Validate backend
        working-directory: backend
        run: |
          go test ./internal/repository ./internal/tools ./internal/agent ./internal/api ./internal/db
          go vet ./internal/repository ./internal/tools ./internal/agent ./internal/api ./internal/db
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test:unit
          npm run build
      - name: Commit clean Phase 5
        run: |
          rm .github/workflows/replay-assistant-profiles-skills.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(agent): add reusable assistant profiles and skills"
          git push origin HEAD
