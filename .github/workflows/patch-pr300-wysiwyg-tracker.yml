name: Update PR 300 WYSIWYG tracker

on:
  push:
    branches:
      - feat/video-wysiwyg-phase3-normal-playback-canonicalization
    paths:
      - '.github/workflows/patch-pr300-wysiwyg-tracker.yml'

permissions:
  contents: write

env:
  NODE_VERSION: '24'

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/video-wysiwyg-phase3-normal-playback-canonicalization
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Update durable WYSIWYG tracker
        run: |
          set -euo pipefail
          python3 scripts/patch-pr300-wysiwyg-tracker.py
          git diff --check
          grep -q 'Latest merged WYSIWYG program PR: \*\*#299' docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md
          grep -q 'Current implementation PR: \*\*#300' docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md
          grep -q 'artifact `9744301414`' docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md
          grep -q 'retained browser playback evidence fixture' docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md
      - name: Recheck focused playback contracts
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npx vitest run src/components/video/previewPlaybackCanonicalization.test.ts src/components/video/sourceTiming.test.ts
      - name: Commit tracker update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md
          git diff --cached --check
          git commit -m "docs(video): record normal playback canonicalization"
          git push origin HEAD:feat/video-wysiwyg-phase3-normal-playback-canonicalization
