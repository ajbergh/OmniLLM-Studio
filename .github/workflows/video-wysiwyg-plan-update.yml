name: Patch WYSIWYG tracker

on:
  push:
    branches: [feat/video-wysiwyg-phase3-font-glyph-parity]
    paths:
      - '.github/workflows/video-wysiwyg-plan-update.yml'
      - 'scripts/update-wysiwyg-resource-text-plan.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/video-wysiwyg-phase3-font-glyph-parity
      - run: python3 scripts/update-wysiwyg-resource-text-plan.py
      - name: Commit tracker update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md
          git diff --cached --check
          git commit -m 'Update WYSIWYG tracker for resource text parity'
          git push origin HEAD:feat/video-wysiwyg-phase3-font-glyph-parity
