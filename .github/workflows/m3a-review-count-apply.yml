name: M3A review count apply once

on:
  push:
    branches:
      - feat/github-merge-eligibility-evidence-m3a-20260812
    paths:
      - .github/workflows/m3a-review-count-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/github-merge-eligibility-evidence-m3a-20260812
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
      - name: Apply review-count hardening
        run: python3 scripts/m3a_review_count_patch.py
      - name: Format and remove temporary helpers
        run: |
          gofmt -w backend/internal/gitrepo/github_pull_request_merge_eligibility.go
          rm scripts/m3a_review_count_patch.py .github/workflows/m3a-review-count-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/gitrepo/github_pull_request_merge_eligibility.go scripts/m3a_review_count_patch.py .github/workflows/m3a-review-count-apply.yml
          git commit -m "fix(github): count bounded effective approvals" || exit 0
          git push origin HEAD:feat/github-merge-eligibility-evidence-m3a-20260812
