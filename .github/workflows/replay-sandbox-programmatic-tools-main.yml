name: Replay sandbox tools onto main

on:
  push:
    branches:
      - feat/sandbox-programmatic-tools-main-20260809

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - name: Replay Phase 7 only
        run: |
          git fetch origin feat/openapi-tool-servers-main-20260809 feat/sandbox-programmatic-tools-on-openapi-20260809
          git diff --binary origin/feat/openapi-tool-servers-main-20260809..origin/feat/sandbox-programmatic-tools-on-openapi-20260809 -- \
            backend/internal/agent/tool_scope.go \
            backend/internal/api/chat_tool_runtime.go \
            backend/internal/api/chat_turn_tools.go \
            backend/internal/api/router.go \
            backend/internal/codesandbox \
            backend/internal/tools/code_sandbox_tool.go \
            backend/internal/tools/execution_restriction.go \
            backend/internal/tools/executor.go \
            backend/internal/tools/executor_approved.go \
            backend/internal/tools/tool_batch.go \
            backend/internal/tools/tool_batch_test.go \
            docs/CHAT_TOOL_PARITY_PROGRAM_2026-08.md > /tmp/phase7.patch
          git apply --3way --index /tmp/phase7.patch
          gofmt -w backend/internal/agent/tool_scope.go backend/internal/api/chat_tool_runtime.go backend/internal/api/chat_turn_tools.go backend/internal/api/router.go backend/internal/codesandbox backend/internal/tools/code_sandbox_tool.go backend/internal/tools/execution_restriction.go backend/internal/tools/executor.go backend/internal/tools/executor_approved.go backend/internal/tools/tool_batch.go backend/internal/tools/tool_batch_test.go
          git add -A
      - name: Validate backend
        working-directory: backend
        run: |
          go test ./internal/codesandbox ./internal/tools ./internal/agent ./internal/api
          go vet ./internal/codesandbox ./internal/tools ./internal/agent ./internal/api
      - name: Commit clean Phase 7
        run: |
          rm .github/workflows/replay-sandbox-programmatic-tools-main.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(tools): add external sandbox and governed batch orchestration"
          git push origin HEAD
