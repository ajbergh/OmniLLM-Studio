name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.13'
  NODE_VERSION: '24'

jobs:
  backend:
    name: Backend tests and race detector
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Install desktop build dependencies
        run: bash scripts/ci-apt-install.sh gcc pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Prepare desktop embed placeholder
        working-directory: backend
        run: |
          mkdir -p cmd/desktop/frontend_dist
          printf '<!doctype html><title>test</title>' > cmd/desktop/frontend_dist/index.html
      - name: Verify formatting
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted" | tee ../backend-gofmt.log
            exit 1
          fi
      - name: Vet
        working-directory: backend
        env:
          GOFLAGS: -tags=webkit2_41
        run: |
          set -o pipefail
          go vet ./... 2>&1 | tee ../backend-vet.log
      - name: Unit and integration tests
        working-directory: backend
        env:
          GOFLAGS: -tags=webkit2_41
        run: |
          set -o pipefail
          export OMNILLM_MASTER_KEY="$(printf '0%.0s' {1..64})"
          go test ./... 2>&1 | tee ../backend-test.log
      - name: Race detector
        working-directory: backend
        env:
          GOFLAGS: -tags=webkit2_41
        run: |
          set -o pipefail
          export OMNILLM_MASTER_KEY="$(printf '0%.0s' {1..64})"
          go test -race ./... 2>&1 | tee ../backend-race.log
      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-diagnostics
          path: backend-*.log
          if-no-files-found: ignore
          retention-days: 14

  plugins-windows:
    name: Plugin lifecycle (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Verify plugin lifecycle and containment
        working-directory: backend
        run: go test ./internal/plugins -count=1

  sandbox-windows:
    name: Sandbox confinement primitives (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Prove Windows sandbox runtime and confinement
        working-directory: backend
        shell: pwsh
        run: |
          go test ./internal/sandbox -run '^TestWindows' -count=1 -v 2>&1 | Tee-Object ../sandbox-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./cmd/sandboxd -count=1 2>&1 | Tee-Object -Append ../sandbox-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows sandbox diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-windows-diagnostics
          path: sandbox-windows.log
          if-no-files-found: ignore
          retention-days: 14

  sandbox-macos:
    name: Sandbox confinement primitive (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Prove native macOS Seatbelt primitive
        working-directory: backend
        run: |
          set -o pipefail
          test -x /usr/bin/sandbox-exec
          go test ./internal/sandbox -run '^TestDarwinSeatbelt' -count=1 -v 2>&1 | tee ../sandbox-macos.log
      - name: Upload macOS sandbox diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-macos-diagnostics
          path: sandbox-macos.log
          if-no-files-found: ignore
          retention-days: 14

  desktop-windows:
    name: Desktop capture contract (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Prepare desktop embed placeholder
        working-directory: backend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path cmd/desktop/frontend_dist | Out-Null
          Set-Content -Path cmd/desktop/frontend_dist/index.html -Value '<!doctype html><title>test</title>'
      - name: Compile and test Windows desktop bindings
        working-directory: backend
        shell: pwsh
        run: |
          go test ./cmd/desktop -count=1 2>&1 | Tee-Object ../desktop-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows desktop diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-diagnostics
          path: desktop-windows.log
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend lint unit and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Frontend lint
        working-directory: frontend
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee ../frontend-lint.log
      - name: Frontend unit tests
        working-directory: frontend
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee ../frontend-unit.log
      - name: Video Studio performance evidence
        working-directory: frontend
        run: |
          set -o pipefail
          npm run test:video-performance 2>&1 | tee ../video-performance.log
      - name: Frontend production build
        working-directory: frontend
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../frontend-build.log
      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-diagnostics
          path: |
            frontend-*.log
            video-performance.log
          if-no-files-found: ignore
          retention-days: 14

  smoke:
    name: Playwright smoke suite
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install system dependencies
        run: bash scripts/ci-apt-install.sh gcc pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Prepare desktop embed placeholder
        working-directory: backend
        run: |
          mkdir -p cmd/desktop/frontend_dist
          printf '<!doctype html><title>test</title>' > cmd/desktop/frontend_dist/index.html
      - run: npm ci
      - working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        run: bash scripts/ci-playwright-install.sh
      - name: Run all browser specifications
        env:
          GOFLAGS: -tags=webkit2_41
        run: |
          export OMNILLM_MASTER_KEY="$(printf '0%.0s' {1..64})"
          npx playwright test --project=chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

  video-parity-baseline:
    name: Video renderer parity baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - working-directory: frontend
        run: npm ci
      - name: Install parity media dependencies
        run: |
          bash scripts/ci-apt-install.sh ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - name: Install Playwright Chromium
        run: bash scripts/ci-playwright-install.sh
      - name: Generate deterministic fixture and media
        working-directory: backend
        run: go run ./cmd/video-parity-fixture --output-dir ../output/video-parity-ci/fixture --generate-media
      - name: Capture immutable snapshot baseline
        shell: bash
        run: |
          set -euo pipefail
          runtime="$GITHUB_WORKSPACE/output/video-parity-ci/runtime"
          mkdir -p "$runtime/attachments"
          export OMNILLM_PORT=18090
          export OMNILLM_DB_PATH="$runtime/parity.db"
          export OMNILLM_ATTACHMENTS_DIR="$runtime/attachments"
          (
            cd backend
            go run ./cmd/server >"$runtime/backend.log" 2>"$runtime/backend.err.log"
          ) &
          backend_pid=$!
          (
            cd frontend
            OMNILLM_API_PROXY_TARGET=http://127.0.0.1:18090 npm run dev -- --host 127.0.0.1 --port 14173 >"$runtime/frontend.log" 2>"$runtime/frontend.err.log"
          ) &
          frontend_pid=$!
          cleanup() {
            kill "$frontend_pid" "$backend_pid" 2>/dev/null || true
            wait "$frontend_pid" "$backend_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18090/v1/health >/dev/null && curl --fail --silent http://127.0.0.1:14173/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "parity servers did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          node scripts/video-parity-capture.mjs \
            --url http://127.0.0.1:14173 \
            --fixture output/video-parity-ci/fixture/parity-torture-v1.json \
            --media-dir output/video-parity-ci/fixture/media \
            --output output/video-parity-ci/capture \
            --capture-delivery true

          # Canonical FrameState diagnostic parity bridge. The real saved v1
          # timeline must fail closed identically while transition placement is
          # ambiguous; the transition-free control proves actual state values
          # remain numerically/structurally identical across browser and Go.
          node scripts/video-frame-state-diagnostics.mjs \
            --url http://127.0.0.1:14173 \
            --fixture output/video-parity-ci/fixture/parity-torture-v1.json \
            --seed-result output/video-parity-ci/capture/seed-result.json \
            --output output/video-parity-ci/capture/frame-state-preview.json
          (
            cd backend
            go run ./cmd/video-frame-state-diagnostic \
              --timeline ../output/video-parity-ci/capture/timeline-v1.json \
              --fixture ../output/video-parity-ci/fixture/parity-torture-v1.json \
              --preview ../output/video-parity-ci/capture/frame-state-preview.json \
              --output ../output/video-parity-ci/capture/frame-state-report.json
          )
          node scripts/video-frame-state-diagnostics.mjs \
            --url http://127.0.0.1:14173 \
            --fixture output/video-parity-ci/fixture/parity-torture-v1.json \
            --seed-result output/video-parity-ci/capture/seed-result.json \
            --transition-free-control true \
            --output output/video-parity-ci/capture/frame-state-preview-control.json
          (
            cd backend
            go run ./cmd/video-frame-state-diagnostic \
              --timeline ../output/video-parity-ci/capture/timeline-v1-transition-free-control.json \
              --fixture ../output/video-parity-ci/fixture/parity-torture-v1.json \
              --preview ../output/video-parity-ci/capture/frame-state-preview-control.json \
              --output ../output/video-parity-ci/capture/frame-state-report-control.json
          )
          node - <<'NODE'
          const fs = require('fs');
          const strict = JSON.parse(fs.readFileSync('output/video-parity-ci/capture/frame-state-report.json', 'utf8'));
          const control = JSON.parse(fs.readFileSync('output/video-parity-ci/capture/frame-state-report-control.json', 'utf8'));
          if (!strict.all_diagnostics_matched || strict.mismatched !== 0) throw new Error('strict FrameState diagnostics did not match');
          if (strict.matched_unavailable < 1) throw new Error('expected transition ambiguity to remain fail-closed');
          if (!control.all_diagnostics_matched || control.mismatched !== 0) throw new Error('control FrameState diagnostics did not match');
          if (control.available_compared < 1) throw new Error('expected transition-free control to compare actual FrameState values');
          console.log(JSON.stringify({
            strict_available_compared: strict.available_compared,
            strict_matched_unavailable: strict.matched_unavailable,
            control_available_compared: control.available_compared,
            control_matched_unavailable: control.matched_unavailable,
            mismatched: strict.mismatched + control.mismatched,
          }));
          NODE

          timeline_hash="$(node -p "require('./output/video-parity-ci/capture/seed-result.json').timeline_sha256")"
          (
            cd backend
            go run ./cmd/video-parity-report \
              --preview-dir ../output/video-parity-ci/capture/preview \
              --rendered-dir ../output/video-parity-ci/capture/rendered \
              --output-dir ../output/video-parity-ci/capture/report \
              --fps 30 \
              --fixture parity-torture-v1 \
              --timeline-sha256 "$timeline_hash" \
              --preview-audio ../output/video-parity-ci/capture/preview-audio-s16le-48k-stereo.pcm \
              --rendered-audio ../output/video-parity-ci/capture/rendered-audio-s16le-48k-stereo.pcm \
              --delivery-media ../output/video-parity-ci/capture/delivery.mp4 \
              --expected-duration-ms 20000 \
              --allow-fail
          )
      - name: Record parity toolchain
        if: always()
        shell: bash
        run: |
          {
            go version
            node --version
            npm --version
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1
            fc-match Inter || true
            node -e "console.log('playwright ' + require('playwright/package.json').version)"
          } > output/video-parity-ci/toolchain.txt
      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-parity-baseline
          path: output/video-parity-ci
          if-no-files-found: error
          retention-days: 14

  helm:
    name: Helm lint and render
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2
      - run: helm lint deploy/helm/omnillm-studio --set secrets.encryptionKey=$(printf '0%.0s' {1..64})
      - run: |
          helm template test deploy/helm/omnillm-studio \
            --set secrets.encryptionKey=$(printf '0%.0s' {1..64}) \
            > /tmp/rendered.yaml
      - name: Enforce single-writer topology
        run: |
          if helm template test deploy/helm/omnillm-studio \
            --set secrets.encryptionKey=$(printf '0%.0s' {1..64}) \
            --set replicaCount=2 >/dev/null 2>&1; then
            echo "replicaCount=2 must be rejected" >&2
            exit 1
          fi
