name: One-time security dependency remediation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  remediate:
    if: github.head_ref == 'fix/security-scan-dependencies-20260804' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v7
        with:
          ref: fix/security-scan-dependencies-20260804

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Remove unused vulnerable router and refresh patched transitive dependencies
        working-directory: frontend
        run: |
          npm ci
          npm uninstall react-router-dom
          npm audit fix
          npm audit --audit-level=high

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run test:unit
          npm run build

      - name: Commit regenerated dependency manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes were required."
            exit 0
          fi
          git commit -m "fix(security): remediate frontend dependency advisories"
          git push origin HEAD:fix/security-scan-dependencies-20260804
