name: WYSIWYG Font Resource Patch

on:
  push:
    branches: [feat/video-wysiwyg-phase3-font-resource-rendering]
    paths:
      - '.github/workflows/video-wysiwyg-font-resource-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/video-wysiwyg-phase3-font-resource-rendering
      - name: Apply focused renderer wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence, found {text.count(old)} for {old!r}')
              p.write_text(text.replace(old, new, 1))

          renderer = 'backend/internal/video/renderer.go'
          replace_once(renderer,
              '''\treq.Timeline, err = ValidateTimelineDocument(req.Timeline)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n''',
              '''\treq.Timeline, err = ValidateTimelineDocument(req.Timeline)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tif err := validateRenderFontResources(req); err != nil {\n\t\treturn nil, err\n\t}\n''')
          replace_once(renderer,
              'buildFilterComplexWithAudio(req.Timeline, resolved, width, height, req.Settings.IncludeAudio)',
              'buildFilterComplexWithAudio(req.Timeline, resolved, width, height, req.Settings.IncludeAudio, renderFontResources{attachmentsDir: req.AttachmentsDir, assets: req.Assets})')
          replace_once(renderer,
              'ffmpegVideoFilters(req.Timeline, width, height)',
              'ffmpegVideoFilters(req.Timeline, width, height, renderFontResources{attachmentsDir: req.AttachmentsDir, assets: req.Assets})')
          replace_once(renderer,
              'func buildFilterComplexWithAudio(doc TimelineDocument, clips []resolvedClip, width, height int, includeAudio bool) (filterStr, videoLabel, audioLabel string) {',
              'func buildFilterComplexWithAudio(doc TimelineDocument, clips []resolvedClip, width, height int, includeAudio bool, fontResources ...renderFontResources) (filterStr, videoLabel, audioLabel string) {')
          replace_once(renderer,
              'if filter := drawTextFilter(item.clip, *item.clip.Text, width, height); filter != "" {',
              'if filter := drawTextFilterWithFontResources(item.clip, *item.clip.Text, width, height, fontResources...); filter != "" {')
          replace_once(renderer,
              'func ffmpegVideoFilters(doc TimelineDocument, width, height int) string {',
              'func ffmpegVideoFilters(doc TimelineDocument, width, height int, fontResources ...renderFontResources) string {')
          replace_once(renderer,
              'filter := drawTextFilter(clip, *clip.Text, width, height)',
              'filter := drawTextFilterWithFontResources(clip, *clip.Text, width, height, fontResources...)')

          snapshot = 'backend/internal/video/render_snapshot.go'
          replace_once(snapshot,
              '''\tif err := s.verifyFontsFromRenderSnapshot(snapshot); err != nil {\n\t\treturn nil, err\n\t}\n\treturn assets, nil\n''',
              '''\tif err := s.verifyFontsFromRenderSnapshot(snapshot); err != nil {\n\t\treturn nil, err\n\t}\n\tif strings.TrimSpace(snapshot.FontManifestJSON) != "" {\n\t\tvar fontEntries []RenderFontManifestEntry\n\t\tif err := json.Unmarshal([]byte(snapshot.FontManifestJSON), &fontEntries); err != nil {\n\t\t\treturn nil, fmt.Errorf("parse render font manifest: %w", err)\n\t\t}\n\t\tfor _, entry := range fontEntries {\n\t\t\tresourceID := strings.TrimSpace(fontResourceIDFromMetadata(entry.Asset))\n\t\t\tif resourceID == "" {\n\t\t\t\treturn nil, fmt.Errorf("snapshot font asset %q is missing font_resource_id metadata", entry.Asset.ID)\n\t\t\t}\n\t\t\tif _, exists := assets[entry.Asset.ID]; exists {\n\t\t\t\treturn nil, fmt.Errorf("snapshot font asset %q collides with a media asset id", entry.Asset.ID)\n\t\t\t}\n\t\t\tassets[entry.Asset.ID] = entry.Asset\n\t\t}\n\t}\n\treturn assets, nil\n''')

          plan = Path('docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md')
          text = plan.read_text()
          text = text.replace('**Last updated:** 2026-09-02', '**Last updated:** 2026-09-03', 1)
          handoff = re.compile(r'Latest merged WYSIWYG program PR: \*\*#304.*?\n\nCurrent implementation PR: \*\*#305.*?\n\n(?=\*\*Phase 2)', re.S)
          replacement = '''Latest merged WYSIWYG program PR: **#305 — Prove mixed canonical playback composition** — squash merge `9ed56ddaa3a142b2a3747bf850233597a2e43f18`. The merged v4 browser fixture retains supported media+resource-text and weighted-pair+resource-text frame-atomic canonical playback evidence; it remains structural/runtime evidence rather than browser↔export glyph-pixel proof.\n\nCurrent implementation branch: **`feat/video-wysiwyg-phase3-font-resource-rendering`**, created directly from #305's actual squash result. This slice closes the prerequisite export bug exposed by the next recommended glyph-pixel work: render snapshots already stage and hash exact font bytes, but the FFmpeg renderer currently verifies those bytes without selecting them. The branch threads staged font entries into renderer inputs, fails closed when a declared resource is absent, and emits `drawtext fontfile=` against the immutable staged face while preserving family-name fallback only for non-resource text. Focused browser↔FFmpeg glyph measurement follows only after this invariant is merged and validated.\n\n'''
          text2, count = handoff.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'plan: current handoff replacement count {count}')
          plan.write_text(text2)
          PY
          gofmt -w backend/internal/video/renderer.go backend/internal/video/render_snapshot.go backend/internal/video/renderer_font_resources.go backend/internal/video/renderer_font_resources_test.go
      - name: Validate focused backend changes
        working-directory: backend
        run: |
          go test ./internal/video -run 'Test(ValidateRenderFontResourcesRequiresImmutableFace|DrawTextFilterUsesExactResourceFile|BuildRenderFontManifest|StartRenderPersistsAndVerifiesFontManifest|VerifyFontsFromRenderSnapshot)'
          go test ./internal/video
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/internal/video/renderer.go backend/internal/video/render_snapshot.go backend/internal/video/renderer_font_resources.go backend/internal/video/renderer_font_resources_test.go docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md
          if git diff --cached --quiet; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git commit -m 'Use immutable font files in FFmpeg text rendering'
          git push origin HEAD:feat/video-wysiwyg-phase3-font-resource-rendering
