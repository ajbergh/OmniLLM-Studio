name: Update PR 299 WYSIWYG tracker

on:
  push:
    branches:
      - feat/video-wysiwyg-phase3-project-background-raster
    paths:
      - .github/workflows/patch-pr299-tracker.yml

permissions:
  contents: write

env:
  GO_VERSION: '1.25.13'
  NODE_VERSION: '24'

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/video-wysiwyg-phase3-project-background-raster
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Update durable WYSIWYG tracker
        run: |
          set -euo pipefail
          # The connector already tightened the permanent workflow to ±1. Recreate
          # the pre-tightening text only in the runner worktree so the exact-match
          # tracker script can validate its complete transformation, then restore
          # the permanent workflow to the checked-in ±1 contents before commit.
          sed -i 's/const backgroundChannelTolerance = 1;/const backgroundChannelTolerance = 2;/' .github/workflows/video-pixelate-background-parity.yml
          sed -i 's/project-background pixelate ±1 RGB gate failed/project-background pixelate ±2 RGB gate failed/' .github/workflows/video-pixelate-background-parity.yml
          python3 scripts/patch-pr299-tracker.py
          git diff --exit-code -- .github/workflows/video-pixelate-background-parity.yml
          grep -q 'Current implementation PR: \*\*#299' docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md
          grep -q 'artifact `9744150134`' docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md
          cd backend
          go test ./internal/video -run 'TestParityPixelateBackground'
          cd ../frontend
          npm ci
          npx vitest run src/components/video/previewPixelateBackdrop.test.ts
      - name: Commit tracker update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md
          git diff --cached --check
          git commit -m "docs(video): record project-background raster evidence"
          git push origin HEAD:feat/video-wysiwyg-phase3-project-background-raster
