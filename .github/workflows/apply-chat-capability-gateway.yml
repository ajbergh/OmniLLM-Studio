name: Apply chat capability gateway

on:
  push:
    branches: [feat/chat-unified-capability-gateway-20260809]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - name: Apply focused source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/internal/api/message_handler.go')
          src = path.read_text()

          def replace_all(old, new):
              global src
              count = src.count(old)
              if count == 0:
                  raise SystemExit(f'expected occurrence of {old!r}')
              src = src.replace(old, new)
              print(f'replaced {count}: {old[:80]!r}')

          replace_all('\tparts = append(parts, sportsLookupSystemDirective)\n', '')
          replace_all('\tsystemPrompt := composeSystemPrompt(userSystemPrompt)\n', '\tsystemPrompt := composeSystemPrompt(userSystemPrompt)\n\tif h.chatCapabilityDiscoverable("sports_lookup") {\n\t\tsystemPrompt += "\\n\\n" + sportsLookupSystemDirective\n\t}\n')
          replace_all('if h.urlContextSvc != nil && h.urlContextSvc.IsEnabled() {', 'if h.urlContextSvc != nil && h.urlContextSvc.IsEnabled() && h.chatPreflightAllowed("fetch_url_context") {')
          replace_all('if h.fileLibrarySvc != nil && fileIntent.RequiresFileSearch {', 'if h.fileLibrarySvc != nil && fileIntent.RequiresFileSearch && h.chatPreflightAllowed("file_search") {')
          replace_all('webSearchEnabled := (req.WebSearch == nil || *req.WebSearch) && !urlCtxWebSearchBypass', 'webSearchEnabled := (req.WebSearch == nil || *req.WebSearch) && !urlCtxWebSearchBypass && h.chatPreflightAllowed("web_search")')
          replace_all('h.wordGenEnabled() && detectWordDocIntent(req.Content)', 'h.wordGenEnabled() && h.chatPreflightAllowed("generate_word_doc") && detectWordDocIntent(req.Content)')
          replace_all('if h.artifactGen != nil {\n\t\tif f, ok := artifacts.DetectFormat(req.Content); ok {', 'if h.artifactGen != nil && h.chatPreflightAllowed("artifact_generate") {\n\t\tif f, ok := artifacts.DetectFormat(req.Content); ok {')
          replace_all('if h.artifactGen != nil && artifactFormat != "" {', 'if h.artifactGen != nil && artifactFormat != "" && h.chatPreflightAllowed("artifact_generate") {')
          replace_all('if urlCtxResult == nil || !urlCtxResult.Handled {\n\t\timgIntent := detectImageIntent(req.Content)', 'if h.chatPreflightAllowed("image_generate") && (urlCtxResult == nil || !urlCtxResult.Handled) {\n\t\timgIntent := detectImageIntent(req.Content)')
          replace_all('func (h *MessageHandler) tryRouterSportsLookup(ctx context.Context, conversationID, messageID, query string) (*models.Message, bool, *intentrouter.RouterTelemetry) {\n\tif h.routerSvc == nil || !h.sportsLookupEnabled() {', 'func (h *MessageHandler) tryRouterSportsLookup(ctx context.Context, conversationID, messageID, query string) (*models.Message, bool, *intentrouter.RouterTelemetry) {\n\tif !h.chatPreflightAllowed("sports_lookup") || h.routerSvc == nil || !h.sportsLookupEnabled() {')
          replace_all('func (h *MessageHandler) handleSportsLookupMessageWithTelemetry(ctx context.Context, conversationID, messageID, query string, routerTelemetry *intentrouter.RouterTelemetry) (*models.Message, bool) {\n\tif !h.sportsLookupEnabled() {', 'func (h *MessageHandler) handleSportsLookupMessageWithTelemetry(ctx context.Context, conversationID, messageID, query string, routerTelemetry *intentrouter.RouterTelemetry) (*models.Message, bool) {\n\tif !h.chatPreflightAllowed("sports_lookup") || !h.sportsLookupEnabled() {')
          path.write_text(src)
          PY
          gofmt -w backend/internal/api/message_handler.go backend/internal/api/chat_capability_policy.go backend/internal/api/chat_capability_policy_test.go
      - name: Focused backend validation
        working-directory: backend
        run: |
          go test ./internal/api ./internal/tools
          go vet ./internal/api ./internal/tools
      - name: Commit applied change
        shell: bash
        run: |
          rm .github/workflows/apply-chat-capability-gateway.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(chat): unify deterministic capability policy gates"
          git push origin HEAD
