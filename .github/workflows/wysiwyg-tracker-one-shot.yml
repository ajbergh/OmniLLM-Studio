name: WYSIWYG tracker one-shot

on:
  push:
    branches:
      - feat/video-wysiwyg-phase3-playback-evidence
    paths:
      - .github/workflows/wysiwyg-tracker-one-shot.yml

permissions:
  contents: write

jobs:
  patch-tracker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/video-wysiwyg-phase3-playback-evidence
          fetch-depth: 0
      - name: Patch durable tracker
        run: python .github/wysiwyg-tracker-patch.py
      - name: Commit tracker
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md
          git diff --cached --check
          git commit -m "docs(video): record retained playback evidence"
          git push origin HEAD:feat/video-wysiwyg-phase3-playback-evidence
