name: Replay MCP HTTP hardening onto current main

on:
  push:
    branches:
      - fix/mcp-http-transport-hardening-main-20260809

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Replay validated MCP hardening delta
        run: |
          git fetch origin fix/mcp-http-transport-hardening-20260809
          git diff d50ac0c6801e3e0b969e585f1f409ce75527d3cf..origin/fix/mcp-http-transport-hardening-20260809 -- \
            backend/internal/api/mcp_handler.go \
            backend/internal/api/mcp_http_validation_test.go \
            backend/internal/db/agent_runtime_migration_test.go \
            backend/internal/db/db.go \
            backend/internal/db/mcp_http_security_migration_test.go \
            backend/internal/mcpclient/http_client.go \
            backend/internal/mcpclient/http_client_test.go \
            backend/internal/mcpclient/http_security.go \
            backend/internal/mcpclient/http_security_test.go \
            backend/internal/models/models.go \
            backend/internal/repository/mcp.go \
            docs/MCP_HOW_TO_FAQ.md \
            frontend/src/components/SettingsPanel.tsx \
            frontend/src/types.ts | git apply --index
      - name: Validate backend
        working-directory: backend
        run: |
          gofmt -w internal/models/models.go internal/db/db.go internal/db/agent_runtime_migration_test.go internal/db/mcp_http_security_migration_test.go internal/repository/mcp.go internal/api/mcp_handler.go internal/api/mcp_http_validation_test.go internal/mcpclient/http_client.go internal/mcpclient/http_client_test.go internal/mcpclient/http_security.go internal/mcpclient/http_security_test.go
          go test ./internal/mcpclient ./internal/repository ./internal/api ./internal/db
          go vet ./internal/mcpclient ./internal/repository ./internal/api ./internal/db
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test:unit
          npm run build
      - name: Commit clean MCP hardening replay
        run: |
          rm .github/workflows/replay-mcp-http-hardening-main.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(mcp): harden remote HTTP transport"
          git push origin HEAD
