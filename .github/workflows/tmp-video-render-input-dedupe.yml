name: Temporary video render input dedupe patch

on:
  push:
    branches:
      - test/video-wysiwyg-phase3-pixelate-opaque-parity-evidence
    paths:
      - .github/workflows/tmp-video-render-input-dedupe.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test/video-wysiwyg-phase3-pixelate-opaque-parity-evidence
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'
          cache-dependency-path: backend/go.sum
      - name: Apply renderer source fanout patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/internal/video/renderer.go')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one replacement, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
          '''type resolvedClip struct {
          \tinputIdx      int
          \ttrackIndex    int
          ''',
          '''type resolvedClip struct {
          \t// inputIdx is a clip-local filter label ordinal. sourceInputIdx is
          \t// the actual FFmpeg input index and may be shared by many fidelity
          \t// segments that reference the same immutable media file.
          \tinputIdx         int
          \tsourceInputIdx   int
          \tvideoInputLabel  string
          \taudioInputLabel  string
          \ttrackIndex       int
          ''')

          replace_once(
          '''\t\tnextIdx := 1
          \t\tfor i := range resolved {
          \t\t\tresolved[i].inputIdx = nextIdx
          \t\t\targs = append(args, "-i", resolved[i].filePath)
          \t\t\tnextIdx++
          \t\t}
          ''',
          '''\t\tnextIdx := 1
          \t\targs, nextIdx = appendResolvedClipInputs(args, resolved, nextIdx)
          ''')

          marker = '''func clipZIndex(clip TimelineClip) int {
          '''
          helper = r'''// appendResolvedClipInputs adds each immutable media file to FFmpeg once, then
          // assigns clip-local fanout labels for every logical consumer. Fidelity expansion
          // can create hundreds of short segments from one authored clip; opening the same
          // file once per segment multiplies decoder memory without changing semantics.
          func appendResolvedClipInputs(args []string, clips []resolvedClip, nextIdx int) ([]string, int) {
          \tif nextIdx < 1 {
          \t\tnextIdx = 1
          \t}
          \tsourceByPath := map[string]int{}
          \tvisualBySource := map[int][]int{}
          \taudioBySource := map[int][]int{}
          \tfor i := range clips {
          \t\tclips[i].inputIdx = i + 1
          \t\tsourceIdx, ok := sourceByPath[clips[i].filePath]
          \t\tif !ok {
          \t\t\tsourceIdx = nextIdx
          \t\t\tnextIdx++
          \t\t\tsourceByPath[clips[i].filePath] = sourceIdx
          \t\t\targs = append(args, "-i", clips[i].filePath)
          \t\t}
          \t\tclips[i].sourceInputIdx = sourceIdx
          \t\tif clips[i].isVideo || clips[i].isImage {
          \t\t\tvisualBySource[sourceIdx] = append(visualBySource[sourceIdx], i)
          \t\t}
          \t\tif clips[i].hasAudio {
          \t\t\taudioBySource[sourceIdx] = append(audioBySource[sourceIdx], i)
          \t\t}
          \t}
          \tassignResolvedInputLabels(clips, visualBySource, "v")
          \tassignResolvedInputLabels(clips, audioBySource, "a")
          \treturn args, nextIdx
          }

          func assignResolvedInputLabels(clips []resolvedClip, consumers map[int][]int, streamKind string) {
          \tfor sourceIdx, clipIndices := range consumers {
          \t\tfor ordinal, clipIndex := range clipIndices {
          \t\t\tlabel := fmt.Sprintf("[%d:%s]", sourceIdx, streamKind)
          \t\t\tif len(clipIndices) > 1 {
          \t\t\t\tlabel = fmt.Sprintf("[input%d_%s%d]", sourceIdx, streamKind, ordinal)
          \t\t\t}
          \t\t\tif streamKind == "v" {
          \t\t\t\tclips[clipIndex].videoInputLabel = label
          \t\t\t} else {
          \t\t\t\tclips[clipIndex].audioInputLabel = label
          \t\t\t}
          \t\t}
          \t}
          }

          // resolvedInputFanoutParts emits split/asplit only when a source stream has
          // multiple logical consumers. AVFrame references are fanned out after one decode;
          // each branch still applies its own trim, rate, transform, fades, and timing.
          func resolvedInputFanoutParts(clips []resolvedClip, includeVideo, includeAudio bool) []string {
          \tvisualBySource := map[int][]string{}
          \taudioBySource := map[int][]string{}
          \tfor _, clip := range clips {
          \t\tif clip.sourceInputIdx <= 0 {
          \t\t\tcontinue
          \t\t}
          \t\tif includeVideo && (clip.isVideo || clip.isImage) && clip.videoInputLabel != "" {
          \t\t\tvisualBySource[clip.sourceInputIdx] = append(visualBySource[clip.sourceInputIdx], clip.videoInputLabel)
          \t\t}
          \t\tif includeAudio && clip.hasAudio && clip.audioInputLabel != "" {
          \t\t\taudioBySource[clip.sourceInputIdx] = append(audioBySource[clip.sourceInputIdx], clip.audioInputLabel)
          \t\t}
          \t}
          \tindices := make([]int, 0, len(visualBySource)+len(audioBySource))
          \tseen := map[int]bool{}
          \tfor sourceIdx := range visualBySource {
          \t\tseen[sourceIdx] = true
          \t\tindices = append(indices, sourceIdx)
          \t}
          \tfor sourceIdx := range audioBySource {
          \t\tif !seen[sourceIdx] {
          \t\t\tindices = append(indices, sourceIdx)
          \t\t}
          \t}
          \tsort.Ints(indices)
          \tparts := make([]string, 0, len(indices)*2)
          \tfor _, sourceIdx := range indices {
          \t\tif labels := visualBySource[sourceIdx]; len(labels) > 1 {
          \t\t\tparts = append(parts, fmt.Sprintf("[%d:v]split=%d%s", sourceIdx, len(labels), strings.Join(labels, "")))
          \t\t}
          \t\tif labels := audioBySource[sourceIdx]; len(labels) > 1 {
          \t\t\tparts = append(parts, fmt.Sprintf("[%d:a]asplit=%d%s", sourceIdx, len(labels), strings.Join(labels, "")))
          \t\t}
          \t}
          \treturn parts
          }

          func resolvedVideoInputLabel(clip resolvedClip) string {
          \tif clip.videoInputLabel != "" {
          \t\treturn clip.videoInputLabel
          \t}
          \treturn fmt.Sprintf("[%d:v]", clip.inputIdx)
          }

          func resolvedAudioInputLabel(clip resolvedClip) string {
          \tif clip.audioInputLabel != "" {
          \t\treturn clip.audioInputLabel
          \t}
          \treturn fmt.Sprintf("[%d:a]", clip.inputIdx)
          }

          '''
          if text.count(marker) != 1:
              raise SystemExit('clipZIndex insertion marker not unique')
          text = text.replace(marker, helper + marker, 1)

          replace_once(
          '''func buildFilterComplexWithAudio(doc TimelineDocument, clips []resolvedClip, width, height int, includeAudio bool) (filterStr, videoLabel, audioLabel string) {
          \tvar parts []string
          ''',
          '''func buildFilterComplexWithAudio(doc TimelineDocument, clips []resolvedClip, width, height int, includeAudio bool) (filterStr, videoLabel, audioLabel string) {
          \tparts := resolvedInputFanoutParts(clips, true, includeAudio)
          ''')

          replace_once(
          '''\t\tsrcFilter := fmt.Sprintf("[%d:v]%s%s", rc.inputIdx, strings.Join(chain, ","), cLabel)
          ''',
          '''\t\tsrcFilter := fmt.Sprintf("%s%s%s", resolvedVideoInputLabel(rc), strings.Join(chain, ","), cLabel)
          ''')

          replace_once(
          '''func buildAudioFilterComplex(doc TimelineDocument, clips []resolvedClip) (string, string) {
          \tparts, label := audioFilterParts(doc, clips)
          ''',
          '''func buildAudioFilterComplex(doc TimelineDocument, clips []resolvedClip) (string, string) {
          \tparts := resolvedInputFanoutParts(clips, false, true)
          \taudioParts, label := audioFilterParts(doc, clips)
          \tparts = append(parts, audioParts...)
          ''')

          replace_once(
          '''\t\tparts = append(parts, fmt.Sprintf("[%d:a]%s%s", rc.inputIdx, strings.Join(chain, ","), label))
          ''',
          '''\t\tparts = append(parts, fmt.Sprintf("%s%s%s", resolvedAudioInputLabel(rc), strings.Join(chain, ","), label))
          ''')

          path.write_text(text)
          PY

          cat > backend/internal/video/renderer_input_fanout_test.go <<'EOF'
          package video

          import (
          	"strings"
          	"testing"
          )

          func TestAppendResolvedClipInputsDeduplicatesSourcesAndFansOutStreams(t *testing.T) {
          	clips := []resolvedClip{
          		{filePath: "input-000.mp4", isVideo: true, hasAudio: true},
          		{filePath: "input-000.mp4", isVideo: true},
          		{filePath: "input-000.mp4", isVideo: true, hasAudio: true},
          		{filePath: "input-001.png", isImage: true},
          	}

          	args, nextIdx := appendResolvedClipInputs([]string{"-hide_banner"}, clips, 1)
          	joinedArgs := strings.Join(args, " ")
          	if got := strings.Count(joinedArgs, "-i "); got != 2 {
          		t.Fatalf("expected two unique FFmpeg media inputs, got %d: %s", got, joinedArgs)
          	}
          	if nextIdx != 3 {
          		t.Fatalf("expected next input index 3, got %d", nextIdx)
          	}
          	for i := 0; i < 3; i++ {
          		if clips[i].sourceInputIdx != 1 {
          			t.Fatalf("clip %d should share source input 1, got %d", i, clips[i].sourceInputIdx)
          		}
          		if clips[i].inputIdx != i+1 {
          			t.Fatalf("clip %d logical filter index = %d, want %d", i, clips[i].inputIdx, i+1)
          		}
          	}
          	if clips[3].sourceInputIdx != 2 || clips[3].videoInputLabel != "[2:v]" {
          		t.Fatalf("single image source should remain direct: %+v", clips[3])
          	}

          	graph := strings.Join(resolvedInputFanoutParts(clips, true, true), ";")
          	if !strings.Contains(graph, "[1:v]split=3[input1_v0][input1_v1][input1_v2]") {
          		t.Fatalf("missing deterministic video fanout: %s", graph)
          	}
          	if !strings.Contains(graph, "[1:a]asplit=2[input1_a0][input1_a1]") {
          		t.Fatalf("missing deterministic audio fanout: %s", graph)
          	}
          }

          func TestResolvedInputLabelsPreserveLegacyDirectGraphTests(t *testing.T) {
          	clip := resolvedClip{inputIdx: 7, isVideo: true, hasAudio: true}
          	if got := resolvedVideoInputLabel(clip); got != "[7:v]" {
          		t.Fatalf("legacy video label = %q", got)
          	}
          	if got := resolvedAudioInputLabel(clip); got != "[7:a]" {
          		t.Fatalf("legacy audio label = %q", got)
          	}
          }
          EOF

          gofmt -w backend/internal/video/renderer.go backend/internal/video/renderer_input_fanout_test.go
          (
            cd backend
            go test ./internal/video -run 'TestAppendResolvedClipInputs|TestResolvedInputLabels|TestBlurRegionPartsPixelate|TestBuildFilterComplexKeepsVisualCompositionInRGB' -count=1
          )
          git diff --check
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-video-render-input-dedupe.yml
          git config user.name "Adam Bergh"
          git config user.email "53879585+ajbergh@users.noreply.github.com"
          git add backend/internal/video/renderer.go backend/internal/video/renderer_input_fanout_test.go .github/workflows/tmp-video-render-input-dedupe.yml
          git commit -m "fix(video): deduplicate fidelity render inputs"
          git push origin HEAD:test/video-wysiwyg-phase3-pixelate-opaque-parity-evidence
