name: M3A docs cleanup once

on:
  push:
    branches:
      - feat/github-merge-eligibility-evidence-m3a-20260812
    paths:
      - scripts/m3a_docs_cleanup.py
      - .github/workflows/m3a-docs-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/github-merge-eligibility-evidence-m3a-20260812
      - name: Apply terminology cleanup
        run: python3 scripts/m3a_docs_cleanup.py
      - name: Remove temporary helpers and commit
        run: |
          rm scripts/m3a_docs_cleanup.py .github/workflows/m3a-docs-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts .github/workflows
          git commit -m "docs(github): normalize M3B terminology"
          git push
