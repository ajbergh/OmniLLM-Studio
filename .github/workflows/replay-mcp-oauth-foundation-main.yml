name: Replay MCP OAuth foundation onto current main

on:
  push:
    branches:
      - feat/mcp-oauth-foundation-main-20260809

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Replay validated OAuth-only delta
        run: |
          git fetch origin feat/mcp-oauth-foundation-20260809
          git diff e1be4930afc2535719428b8f37300e25d28491fb..origin/feat/mcp-oauth-foundation-20260809 -- \
            backend/cmd/desktop/main.go \
            backend/cmd/desktop/main_test.go \
            backend/internal/api/mcp_oauth_handler.go \
            backend/internal/api/router.go \
            backend/internal/config/config.go \
            backend/internal/db/agent_runtime_migration_test.go \
            backend/internal/db/db.go \
            backend/internal/db/mcp_oauth_migration_test.go \
            backend/internal/mcpclient/http_client.go \
            backend/internal/mcpclient/http_oauth_test.go \
            backend/internal/mcpclient/manager.go \
            backend/internal/mcpclient/oauth.go \
            backend/internal/mcpclient/oauth_test.go \
            backend/internal/models/mcp_oauth.go \
            backend/internal/repository/mcp_oauth.go \
            backend/internal/repository/mcp_oauth_test.go \
            docs/MCP_OAUTH_2026-08.md \
            frontend/src/components/MCPAuthorizationPanel.tsx \
            frontend/src/components/SettingsPanel.tsx \
            frontend/src/mcpOAuthApi.ts | git apply --index
      - name: Validate backend
        working-directory: backend
        run: |
          gofmt -w \
            cmd/desktop/main.go cmd/desktop/main_test.go \
            internal/api/mcp_oauth_handler.go internal/api/router.go \
            internal/config/config.go \
            internal/db/agent_runtime_migration_test.go internal/db/db.go internal/db/mcp_oauth_migration_test.go \
            internal/mcpclient/http_client.go internal/mcpclient/http_oauth_test.go internal/mcpclient/manager.go internal/mcpclient/oauth.go internal/mcpclient/oauth_test.go \
            internal/models/mcp_oauth.go \
            internal/repository/mcp_oauth.go internal/repository/mcp_oauth_test.go
          mkdir -p cmd/desktop/frontend_dist
          test -f cmd/desktop/frontend_dist/index.html || printf '<!doctype html><html><body>test</body></html>' > cmd/desktop/frontend_dist/index.html
          go test ./internal/repository ./internal/mcpclient ./internal/api ./internal/db ./internal/config ./cmd/desktop
          go vet ./internal/repository ./internal/mcpclient ./internal/api ./internal/db ./internal/config ./cmd/desktop
          rm -f cmd/desktop/frontend_dist/index.html
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test:unit
          npm run build
      - name: Commit clean OAuth replay
        run: |
          rm .github/workflows/replay-mcp-oauth-foundation-main.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(mcp): add OAuth 2.1 authorization foundation"
          git push origin HEAD
