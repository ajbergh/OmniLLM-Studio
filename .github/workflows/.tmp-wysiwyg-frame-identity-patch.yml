name: Temporary WYSIWYG Frame Identity Patch

on:
  push:
    branches:
      - fix/video-wysiwyg-phase3-decoded-frame-identity
    paths:
      - '.github/workflows/.tmp-wysiwyg-frame-identity-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/video-wysiwyg-phase3-decoded-frame-identity
          fetch-depth: 0
      - name: Apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/__PR_NUMBER__/292/g' scripts/.tmp_wysiwyg_frame_identity_patch.py
          python3 scripts/.tmp_wysiwyg_frame_identity_patch.py
          node --check scripts/video-pixelate-parity-assert.mjs
          git diff --check
      - name: Commit implementation and remove temporary patch machinery
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/.tmp_wysiwyg_frame_identity_patch.py
          rm .github/workflows/.tmp-wysiwyg-frame-identity-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix deterministic decoded-video frame identity'
          git push origin HEAD:fix/video-wysiwyg-phase3-decoded-frame-identity
