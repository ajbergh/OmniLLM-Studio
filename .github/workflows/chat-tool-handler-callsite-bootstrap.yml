name: Chat tool handler callsite bootstrap

on:
  push:
    branches:
      - fix/chat-tool-handler-parallel-callsite-20260802
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  patch-and-test:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' || github.event.pull_request.head.ref == 'fix/chat-tool-handler-parallel-callsite-20260802')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out corrective branch
        uses: actions/checkout@v4
        with:
          ref: fix/chat-tool-handler-parallel-callsite-20260802
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Wire ordered runtime into Chat Studio
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/internal/api/message_handler.go')
          source = path.read_text(encoding='utf-8')
          if 'newChatToolExecution(h.toolExecutor, finalToolCalls)' in source:
              raise SystemExit('message handler callsite is already wired')

          start_marker = '\t\t\tresultLimitReached := false\n'
          loop_marker = '\t\t\tfor _, tc := range finalToolCalls {'
          start_token = start_marker + loop_marker
          if source.count(start_token) != 1:
              raise SystemExit(f'expected one sequential tool loop marker, found {source.count(start_token)}')
          start = source.index(start_token)

          end_marker = '\n\n\t\t\tif resultLimitReached {'
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit('could not locate result-limit continuation')

          legacy_loop = source[start + len(start_marker):end]
          legacy_loop = '\n'.join(('\t' + line) if line else line for line in legacy_loop.split('\n'))

          integration = '''\t\t\texecution := newChatToolExecution(h.toolExecutor, finalToolCalls)
          \t\t\tif execution.genericRuntimeEligible() {
          \t\t\t\ttoolCtx := browser.WithProviderType(r.Context(), providerType)
          \t\t\t\ttoolCtx = browser.WithProgress(toolCtx, func(event string, payload any) {
          \t\t\t\t\tsendSSE(w, flusher, event, payload)
          \t\t\t\t})
          \t\t\t\ttoolCtx = tools.ContextWithInvocationScope(toolCtx, tools.InvocationScope{
          \t\t\t\t\tUserID:         auth.ScopeUserIDFromContext(r.Context()),
          \t\t\t\t\tWorkspaceID:    toolWorkspaceID,
          \t\t\t\t\tConversationID: convoID,
          \t\t\t\t\tMessageID:      msgID,
          \t\t\t\t})
          \t\t\t\ttoolCtx = tools.ContextWithInlineApproval(toolCtx)
          \t\t\t\ttoolCtx = tools.ContextWithEventSink(toolCtx, func(event tools.ToolEvent) {
          \t\t\t\t\tsendToolEventSSE(w, flusher, event)
          \t\t\t\t})

          \t\t\t\toutcome := executeGenericChatToolRound(
          \t\t\t\t\ttoolCtx,
          \t\t\t\t\th.toolExecutor,
          \t\t\t\t\texecution.Plan,
          \t\t\t\t\ttotalToolResultChars,
          \t\t\t\t\tmaxToolResultCharsPerTurn,
          \t\t\t\t)
          \t\t\t\ttotalToolResultChars = outcome.UsedChars
          \t\t\t\tresultLimitReached = outcome.LimitReached

          \t\t\t\tfor _, item := range outcome.Processed {
          \t\t\t\t\ttoolResults = append(toolResults, item.MetadataResult)
          \t\t\t\t\tsendSSE(w, flusher, "tool_result", map[string]interface{}{
          \t\t\t\t\t\t"tool_call_id": item.ToolCallID,
          \t\t\t\t\t\t"tool_name":    item.ToolName,
          \t\t\t\t\t\t"result":       item.MetadataResult,
          \t\t\t\t\t})
          \t\t\t\t\tllmReq.Messages = append(llmReq.Messages, item.Message)
          \t\t\t\t}
          \t\t\t} else {
          '''
          replacement = start_marker + integration + legacy_loop + '\n\t\t\t}'
          source = source[:start] + replacement + source[end:]
          path.write_text(source, encoding='utf-8')

          wiring_test = Path('backend/internal/api/message_handler_tool_runtime_wiring_test.go')
          wiring_test.write_text('''package api

          import (
          \t"os"
          \t"strings"
          \t"testing"
          )

          func TestMessageHandlerWiresOrderedGenericToolRuntime(t *testing.T) {
          \tsource, err := os.ReadFile("message_handler.go")
          \tif err != nil {
          \t\tt.Fatalf("read message_handler.go: %v", err)
          \t}
          \ttext := string(source)
          \trequired := []string{
          \t\t"newChatToolExecution(h.toolExecutor, finalToolCalls)",
          \t\t"execution.genericRuntimeEligible()",
          \t\t"executeGenericChatToolRound(",
          \t\t"browser.WithProviderType(r.Context(), providerType)",
          \t}
          \tfor _, marker := range required {
          \t\tif !strings.Contains(text, marker) {
          \t\t\tt.Fatalf("message handler is missing ordered-runtime marker %q", marker)
          \t\t}
          \t}
          \tif !strings.Contains(text, "for _, tc := range finalToolCalls") {
          \t\tt.Fatal("message handler no longer contains the browser-aware sequential fallback")
          \t}
          }
          ''', encoding='utf-8')
          PY

          gofmt -w \
            backend/internal/api/message_handler.go \
            backend/internal/api/message_handler_tool_runtime_wiring_test.go \
            backend/internal/api/chat_tool_round.go \
            backend/internal/api/chat_tool_round_test.go \
            backend/internal/api/chat_tool_execution_test.go

      - name: Run focused backend tests
        run: cd backend && go test ./internal/tools ./internal/api

      - name: Run full backend tests
        run: cd backend && go test ./...

      - name: Commit validated callsite integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/internal/api/message_handler.go \
            backend/internal/api/message_handler_tool_runtime_wiring_test.go \
            backend/internal/api/chat_tool_round.go \
            backend/internal/api/chat_tool_round_test.go \
            backend/internal/api/chat_tool_execution_test.go
          git commit -m 'fix(chat): activate ordered tool runtime in message handler'
          git push origin HEAD:fix/chat-tool-handler-parallel-callsite-20260802
