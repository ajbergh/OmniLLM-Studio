name: macOS Sandbox Runtime Assurance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-macos-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.13'

jobs:
  sandbox-macos-runtime:
    name: Darwin local runtime confinement
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Prove first-party Darwin runtime boundaries
        working-directory: backend
        run: |
          set -o pipefail
          test -x /usr/bin/sandbox-exec
          go test ./internal/sandbox -run '^TestDarwin(LocalRuntime|Seatbelt)' -count=1 -v 2>&1 | tee ../sandbox-macos-runtime.log
      - name: Prove Darwin workspace root identity binding
        working-directory: backend
        run: |
          set -o pipefail
          go test ./internal/sandbox -run '^TestDarwinWorkspace(Grant|Legacy)' -count=10 -v 2>&1 | tee -a ../sandbox-macos-runtime.log
      - name: Prove Darwin governed-workspace path-race resistance
        working-directory: backend
        run: |
          set -o pipefail
          go test ./internal/sandbox -run '^TestDarwinWorkspace(Read|Mutation|Search)' -count=10 -v 2>&1 | tee -a ../sandbox-macos-runtime.log
      - name: Upload macOS sandbox runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-macos-runtime-diagnostics
          path: sandbox-macos-runtime.log
          if-no-files-found: ignore
          retention-days: 14
