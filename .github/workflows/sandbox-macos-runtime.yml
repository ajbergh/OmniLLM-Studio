name: macOS Sandbox Runtime Assurance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-macos-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.13'

jobs:
  sandbox-macos-runtime:
    name: Darwin local runtime confinement
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Prove first-party Darwin runtime boundaries
        working-directory: backend
        run: |
          set -o pipefail
          test -x /usr/bin/sandbox-exec
          go test ./internal/sandbox -run '^TestDarwin(LocalRuntime|Seatbelt)' -count=1 -v 2>&1 | tee ../sandbox-macos-runtime.log
      - name: Capture Seatbelt denial diagnostics
        if: failure()
        run: |
          /usr/bin/log show --last 5m --style compact \
            --predicate '(process == "kernel" OR process == "sandboxd") AND eventMessage CONTAINS[c] "deny"' \
            | tail -n 300 \
            | tee sandbox-macos-denials.log || true
      - name: Upload macOS sandbox runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-macos-runtime-diagnostics
          path: |
            sandbox-macos-runtime.log
            sandbox-macos-denials.log
          if-no-files-found: ignore
          retention-days: 14
