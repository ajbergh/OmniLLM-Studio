name: Temporary text playback integration patch

on:
  push:
    branches:
      - feat/video-wysiwyg-phase3-text-playback-readiness

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/video-wysiwyg-phase3-text-playback-readiness
          fetch-depth: 0
      - name: Apply integration patch
        run: python3 scripts/temporary-text-playback-patch.py
      - name: Validate patch
        run: |
          git diff --check
          git diff --exit-code -- .github/workflows/temporary-text-playback-patch.yml scripts/temporary-text-playback-patch.py
      - name: Commit integration patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/video-playback-canonical-parity.yml \
            frontend/src/components/video/PreviewTextPlaybackConsumer.tsx \
            frontend/src/components/video/VideoPreviewCanvas.tsx \
            scripts/video-playback-parity-capture.mjs
          git commit -m 'feat(video): integrate text playback readiness'
          git push origin HEAD:feat/video-wysiwyg-phase3-text-playback-readiness
