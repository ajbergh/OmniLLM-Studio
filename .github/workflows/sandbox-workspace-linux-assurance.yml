name: Linux Workspace Path Assurance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-workspace-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.13'

jobs:
  workspace-linux-paths:
    name: Linux workspace descriptor-relative reads
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Prove symlink denial and rename-race containment
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/sandbox -run '^TestLinuxWorkspaceRead' -count=10 -v 2>&1 | tee ../sandbox-workspace-linux.log
      - name: Upload Linux workspace diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-workspace-linux-diagnostics
          path: sandbox-workspace-linux.log
          if-no-files-found: ignore
          retention-days: 14
