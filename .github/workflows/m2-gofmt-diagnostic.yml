name: M2 gofmt diagnostic

on:
  pull_request:
    paths:
      - backend/internal/gitrepo/github_pull_request_merge_policy_evidence.go
      - .github/workflows/m2-gofmt-diagnostic.yml

permissions:
  contents: read

jobs:
  gofmt-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Print gofmt diff
        run: gofmt -d backend/internal/gitrepo/github_pull_request_merge_policy_evidence.go
