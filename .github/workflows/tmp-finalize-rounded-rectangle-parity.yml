name: Finalize Rounded Rectangle Parity

on:
  push:
    branches:
      - feat/video-wysiwyg-phase3-rounded-rectangle-parity

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply guarded truth and tracker patch
        run: |
          set -euo pipefail
          python scripts/tmp-finalize-rounded-rectangle-parity.py
          gofmt -w \
            backend/internal/video/strict_parity.go \
            backend/internal/video/strict_parity_test.go \
            backend/internal/video/renderer_capabilities.go \
            backend/internal/video/renderer.go \
            backend/internal/video/timeline.go
          git diff --check
      - name: Validate backend renderer and strict parity
        working-directory: backend
        run: |
          set -euo pipefail
          go test ./internal/video/rendercontract
          go test ./internal/video
      - name: Validate frontend types and registry
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Validate evidence script and permanent workflow presence
        run: |
          set -euo pipefail
          node --check scripts/video-rounded-rectangle-parity-capture.mjs
          test -f .github/workflows/video-rounded-rectangle-parity.yml
          grep -q 'pixel_pass_rate_min: 0.9985' .github/workflows/video-rounded-rectangle-parity.yml
          grep -q 'Canonical rounded-rectangle export parity slice' docs/VIDEO_EDIT_STUDIO_WYSIWYG_RENDERING_IMPLEMENTATION_PLAN_2026-08.md
          git diff --check
      - name: Commit validated ordinary-file finalization
        run: |
          set -euo pipefail
          git rm scripts/tmp-finalize-rounded-rectangle-parity.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize rounded rectangle parity support'
          git push origin HEAD:feat/video-wysiwyg-phase3-rounded-rectangle-parity
