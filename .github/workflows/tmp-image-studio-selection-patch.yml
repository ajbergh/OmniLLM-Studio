name: Temporary Image Studio Selection Patch

on:
  push:
    branches:
      - feat/image-studio-selection-ux-20260812

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[selection-patch]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/image-studio-selection-ux-20260812
      - name: Apply selection UX integration
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, count))

          replace(
              'frontend/src/types.ts',
              "  supports_masking?: boolean;\n  supports_content_reference?: boolean;",
              "  supports_masking?: boolean;\n  masking_mode?: 'none' | 'semantic' | 'pixel';\n  supports_content_reference?: boolean;",
          )
          replace(
              'frontend/src/types.ts',
              "  supports_masking: boolean;\n  supports_variations: boolean;",
              "  supports_masking: boolean;\n  masking_mode: 'none' | 'semantic' | 'pixel';\n  supports_variations: boolean;",
          )

          canvas = Path('frontend/src/components/image/ImageCanvas.tsx')
          text = canvas.read_text()
          text = text.replace(
              "import { attachmentUrl } from '../../api';",
              "import { attachmentUrl } from '../../api';\nimport { drawMaskStroke, type ImageMaskingMode } from './maskRaster';",
              1,
          )
          text = text.replace(
              "  onZoomChange: (zoom: number) => void;\n}",
              "  onZoomChange: (zoom: number) => void;\n  maskingMode?: ImageMaskingMode;\n}",
              1,
          )
          text = text.replace(
              "  exportMaskBlob: () => Blob | null;",
              "  exportMaskBlob: (mode?: ImageMaskingMode) => Blob | null;",
              1,
          )
          text = text.replace(
              "export const ImageCanvas = forwardRef<ImageCanvasHandle, ImageCanvasProps>(function ImageCanvas({ attachmentId, zoom, onZoomChange }, ref) {",
              "export const ImageCanvas = forwardRef<ImageCanvasHandle, ImageCanvasProps>(function ImageCanvas({ attachmentId, zoom, onZoomChange, maskingMode = 'none' }, ref) {",
              1,
          )
          text = text.replace(
              "  const isMaskMode = editMode === 'edit' && (tool === 'brush' || tool === 'eraser');",
              "  const isMaskMode = editMode === 'edit' && maskingMode !== 'none' && (tool === 'brush' || tool === 'eraser');",
              1,
          )
          text = text.replace(
              "  }, [maskStrokes, maskVisible, maskOpacity]); // eslint-disable-line react-hooks/exhaustive-deps",
              "  }, [maskStrokes, maskVisible, maskOpacity, maskingMode]); // eslint-disable-line react-hooks/exhaustive-deps",
              1,
          )
          text = text.replace("      drawStroke(ctx, stroke);", "      drawMaskStroke(ctx, stroke, { mode: 'preview', opacity: maskOpacity });")
          text = text.replace(
              "      drawStroke(ctx, {\n        points: currentStrokeRef.current,\n        brushSize,\n        tool,\n        feather: brushFeather,\n      } as MaskStroke);",
              "      drawMaskStroke(ctx, {\n        points: currentStrokeRef.current,\n        brushSize,\n        tool,\n        feather: brushFeather,\n      } as MaskStroke, { mode: 'preview', opacity: maskOpacity });",
              1,
          )
          start = text.index("  function drawStroke(ctx: CanvasRenderingContext2D, stroke: MaskStroke) {")
          end = text.index("  // Convert screen coordinates to image coordinates", start)
          text = text[:start] + text[end:]
          text = text.replace(
              "  /** Export mask as a PNG blob (white = masked, black = unmasked) for upload */\n  const exportMaskBlob = useCallback((): Blob | null => {",
              "  /** Export a provider-appropriate PNG selection guide. */\n  const exportMaskBlob = useCallback((mode: ImageMaskingMode = maskingMode): Blob | null => {",
              1,
          )
          loop_start = text.index("    // Punch transparent holes where the user painted (masked = edit).")
          loop_end = text.index("\n    // Convert to blob synchronously", loop_start)
          replacement = "    // Pixel masks use transparent edit regions; semantic masks use visible\n    // white-on-black guidance while sharing the same feather rasterization.\n    for (const stroke of maskStrokes) {\n      drawMaskStroke(ctx, stroke, { mode: mode === 'semantic' ? 'semantic' : 'pixel' });\n    }\n"
          text = text[:loop_start] + replacement + text[loop_end:]
          text = text.replace("  }, [maskStrokes]);", "  }, [maskStrokes, maskingMode]);", 1)
          text = text.replace(
              "              style={{ opacity: maskVisible ? 1 : 0 }}",
              "              style={{ opacity: maskVisible ? (maskingMode === 'none' ? 0.35 : 1) : 0 }}",
              1,
          )
          canvas.write_text(text)

          studio = Path('frontend/src/components/image/ImageEditStudio.tsx')
          text = studio.read_text()
          text = text.replace(
              "import { ImageCanvas, type ImageCanvasHandle } from './ImageCanvas';",
              "import { ImageCanvas, type ImageCanvasHandle } from './ImageCanvas';\nimport type { ImageMaskingMode } from './maskRaster';",
              1,
          )
          text = text.replace("    brushSize,\n    zoom,", "    brushSize,\n    brushFeather,\n    zoom,", 1)
          text = text.replace("    setBrushSize,\n    setZoom,", "    setBrushSize,\n    setBrushFeather,\n    setZoom,", 1)
          text = text.replace(
              "      supports_masking: overrides.supports_masking ?? capabilities.supports_masking,\n      supports_content_reference:",
              "      supports_masking: overrides.supports_masking ?? capabilities.supports_masking,\n      masking_mode: overrides.masking_mode ?? capabilities.masking_mode,\n      supports_content_reference:",
              1,
          )
          marker = "  const selectedProviderProfile = useMemo("
          insert = "  const maskingMode = (effectiveCaps?.masking_mode ?? (effectiveCaps?.supports_masking ? 'pixel' : 'none')) as ImageMaskingMode;\n  const maskToolsActive = editMode === 'edit' && effectiveCaps?.supports_masking === true && maskingMode !== 'none';\n  const maskSelectionInactive = editMode === 'edit' && maskStrokes.length > 0 && !maskToolsActive;\n\n"
          if marker not in text:
              raise SystemExit('selectedProviderProfile marker missing')
          text = text.replace(marker, insert + marker, 1)
          text = text.replace(
              "    if (maskStrokes.length > 0) {",
              "    if (maskStrokes.length > 0 && maskToolsActive) {",
              1,
          )
          text = text.replace(
              "        const blob = canvasRef.current?.exportMaskBlob?.();",
              "        const blob = canvasRef.current?.exportMaskBlob?.(maskingMode);",
              1,
          )
          old_mask_open = "                {/* Mask tools (shown in edit mode) */}\n                {editMode === 'edit' && (\n                  <div className={clsx('space-y-2', effectiveCaps != null && !effectiveCaps.supports_masking && 'opacity-40 pointer-events-none')}>\n                    <label className=\"text-xs font-medium text-text-muted uppercase tracking-wide\">\n                      Mask Tools\n                      {effectiveCaps != null && !effectiveCaps.supports_masking && (\n                        <span className=\"ml-1 text-[9px] text-amber-400 normal-case\">(not supported by provider)</span>\n                      )}\n                    </label>"
          new_mask_open = "                {/* Selection tools (shown in edit mode) */}\n                {editMode === 'edit' && (\n                  <>\n                  {maskSelectionInactive && (\n                    <div className=\"rounded-lg border border-amber-500/20 bg-amber-500/10 px-2.5 py-2 text-[10px] text-amber-300\">\n                      Selection retained but inactive for this model. This edit will apply to the full image unless you switch back to a selection-capable model.\n                    </div>\n                  )}\n                  <div className={clsx('space-y-2', !maskToolsActive && 'opacity-40 pointer-events-none')}>\n                    <label className=\"text-xs font-medium text-text-muted uppercase tracking-wide\">\n                      {maskingMode === 'pixel' ? 'Pixel Selection' : maskingMode === 'semantic' ? 'Edit Area Guidance' : 'Selection Tools'}\n                      {!maskToolsActive && (\n                        <span className=\"ml-1 text-[9px] text-amber-400 normal-case\">(not supported by model)</span>\n                      )}\n                    </label>"
          if old_mask_open not in text:
              raise SystemExit('mask tool opening block not found')
          text = text.replace(old_mask_open, new_mask_open, 1)
          old_close = "                  </div>\n                )}\n\n                {/* Generate / Edit button */}"
          new_close = "                  </div>\n                  </>\n                )}\n\n                {/* Generate / Edit button */}"
          if old_close not in text:
              raise SystemExit('mask tool closing block not found')
          text = text.replace(old_close, new_close, 1)
          brush_block = "                    {/* Mask opacity */}\n                    <div className=\"flex items-center gap-2\">"
          feather_block = "                    {/* Brush feather */}\n                    <div className=\"flex items-center gap-2\">\n                      <span className=\"text-[10px] text-text-muted w-12\">Feather</span>\n                      <input\n                        type=\"range\"\n                        min={0}\n                        max={100}\n                        value={brushFeather}\n                        onChange={(e) => setBrushFeather(Number(e.target.value))}\n                        className=\"flex-1 accent-primary\"\n                        aria-label=\"Selection feather\"\n                      />\n                      <span className=\"text-[10px] text-text-muted w-7 text-right\">{brushFeather}%</span>\n                    </div>\n\n                    {/* Mask opacity */}\n                    <div className=\"flex items-center gap-2\">"
          if brush_block not in text:
              raise SystemExit('mask opacity anchor not found')
          text = text.replace(brush_block, feather_block, 1)
          text = text.replace(
              "              onZoomChange={setZoom}\n            />",
              "              onZoomChange={setZoom}\n              maskingMode={maskToolsActive ? maskingMode : 'none'}\n            />",
              1,
          )
          studio.write_text(text)
          PY
      - name: Commit selection UX
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/types.ts frontend/src/components/image/ImageCanvas.tsx frontend/src/components/image/ImageEditStudio.tsx
          git commit -m 'feat(image): activate provider-aware selection UX [selection-patch]'
          git push origin HEAD:feat/image-studio-selection-ux-20260812
