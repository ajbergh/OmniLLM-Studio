name: M3A last-push hardening once

on:
  push:
    branches:
      - feat/github-merge-eligibility-evidence-m3a-20260812
    paths:
      - .github/workflows/m3a-last-push-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/github-merge-eligibility-evidence-m3a-20260812
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
      - name: Fail closed on unproven last-push approval and remove helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/internal/gitrepo/github_pull_request_merge_eligibility.go')
          text = path.read_text()
          old = '''\tresult.ReviewDecision = reviewDecision\n\tresult.OutstandingCodeOwnerRequests = codeOwnerRequests\n\tresult.ReviewsSatisfied = reviewsSatisfied\n\tif !reviewsComplete {\n\t\tincomplete("review_evidence_incomplete")\n\t} else if !reviewsSatisfied {\n\t\tblock("required_reviews_unsatisfied")\n\t}\n'''
          new = '''\tresult.ReviewDecision = reviewDecision\n\tresult.OutstandingCodeOwnerRequests = codeOwnerRequests\n\tresult.ReviewsSatisfied = reviewsSatisfied\n\tif !reviewsComplete {\n\t\tincomplete("review_evidence_incomplete")\n\t}\n\t// GitHub's reviewDecision is an aggregate code-review status, but the\n\t// documented last-push rule additionally depends on the identity of the\n\t// actor who made the most recent reviewable push. M3A does not have a\n\t// bounded provider field that proves that actor relationship, so this\n\t// requirement remains explicitly incomplete rather than inferred from an\n\t// APPROVED reviewDecision.\n\tif policy.Requirements.LastPushApprovalRequired {\n\t\tresult.ReviewsSatisfied = false\n\t\tincomplete("last_push_approval_evidence_unavailable")\n\t} else if reviewsComplete && !reviewsSatisfied {\n\t\tblock("required_reviews_unsatisfied")\n\t}\n'''
          if old not in text:
              raise SystemExit('review evidence anchor not found')
          path.write_text(text.replace(old, new))
          PY
          gofmt -w backend/internal/gitrepo/github_pull_request_merge_eligibility.go
          rm .github/workflows/m3a-last-push-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/gitrepo/github_pull_request_merge_eligibility.go .github/workflows/m3a-last-push-hardening.yml
          git commit -m "fix(github): fail closed on unproven last-push approval" || exit 0
          git push origin HEAD:feat/github-merge-eligibility-evidence-m3a-20260812
