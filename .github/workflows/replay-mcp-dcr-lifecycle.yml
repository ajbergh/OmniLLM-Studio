name: Replay MCP DCR lifecycle corrections

on:
  push:
    branches:
      - agent/mcp-dcr-lifecycle-docs-main-20260810

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Replay validated lifecycle files
        run: |
          git fetch origin agent/mcp-dcr-lifecycle-docs-20260810
          git checkout origin/agent/mcp-dcr-lifecycle-docs-20260810 -- \
            CLAUDE.md \
            backend/internal/api/mcp_oauth_handler.go \
            backend/internal/api/mcp_oauth_route_test.go \
            backend/internal/api/router.go \
            backend/internal/mcpclient/oauth.go \
            backend/internal/mcpclient/oauth_test.go \
            backend/internal/repository/mcp_oauth.go \
            backend/internal/repository/mcp_oauth_test.go \
            docs/MCP_HOW_TO_FAQ.md \
            docs/MCP_OAUTH_2026-08.md \
            docs/TECHNICAL_REFERENCE.md \
            frontend/src/components/MCPAuthorizationPanel.tsx \
            frontend/src/mcpOAuthApi.ts
          gofmt -w \
            backend/internal/api/mcp_oauth_handler.go \
            backend/internal/api/mcp_oauth_route_test.go \
            backend/internal/api/router.go \
            backend/internal/mcpclient/oauth.go \
            backend/internal/mcpclient/oauth_test.go \
            backend/internal/repository/mcp_oauth.go \
            backend/internal/repository/mcp_oauth_test.go

      - name: Backend validation
        working-directory: backend
        run: |
          go test ./internal/repository ./internal/mcpclient ./internal/api ./internal/db ./internal/config
          go vet ./internal/repository ./internal/mcpclient ./internal/api ./internal/db ./internal/config

      - name: Frontend validation
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test:unit
          npm run build

      - name: Commit clean replay
        run: |
          rm .github/workflows/replay-mcp-dcr-lifecycle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(mcp): recover DCR lifecycle and refresh docs"
          git push origin HEAD
