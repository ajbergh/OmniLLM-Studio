name: Temporary Git Module Lock Generation

on:
  push:
    branches:
      - agent/git-repository-tools-gogit-5.19.2

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false
      - name: Generate and commit module lock files
        shell: bash
        run: |
          cd backend
          go mod edit -require=github.com/remyoudompheng/bigfft@v0.0.0-20230129092748-24d4a6f8daec
          go mod tidy
          cd ..
          rm .github/workflows/tmp-git-module-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/go.mod backend/go.sum .github/workflows/tmp-git-module-lock.yml
          git commit -m 'fix(deps): tidy go-git module lock'
          git push origin HEAD:agent/git-repository-tools-gogit-5.19.2
